<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pocket Garden</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c1815;
      --panel: #13221e;
      --panel-2: #192d28;
      --panel-3: #213b34;
      --border: rgba(255, 255, 255, 0.1);
      --border-bright: #3be093;
      --text: #f3fff9;
      --muted: #93b3a8;
      --accent: #35d48a;
      --accent-dark: #1d9960;
      --gold: #ffcf48;
      --danger: #ff6666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
      gap: 8px;
      background: radial-gradient(circle at 50% 0%, #16302a 0%, #0a1412 100%);
    }

    /* ENLARGED VECTOR ICONS */
    .svg-ico {
      width: 22px;
      height: 22px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .svg-ico-sm {
      width: 18px;
      height: 18px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .svg-ico-tool {
      width: 30px;
      height: 30px;
      display: inline-block;
      flex-shrink: 0;
    }

    .svg-ico-nav {
      width: 26px;
      height: 26px;
      display: inline-block;
      flex-shrink: 0;
    }

    /* HEADER */
    .header {
      background: linear-gradient(180deg, #192e29 0%, #12211d 100%);
      border: 1.5px solid #26453d;
      border-bottom-width: 3px;
      border-radius: 16px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, #35d48a, #178250);
      border: 2px solid #8ff7c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #072116;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lvl-pill {
      background: rgba(53, 212, 138, 0.18);
      border: 1px solid #35d48a;
      color: #9efad0;
      font-size: 9.5px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .profile-record {
      font-size: 10.5px;
      color: var(--gold);
      font-weight: 800;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stats-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .weather-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(10, 20, 18, 0.72);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 11px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      color: #e3faf0;
    }

    .weather-bar {
      width: 22px;
      height: 4px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      overflow: hidden;
    }

    .weather-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transition: width 0.4s linear;
    }

    .coins-badge {
      background: linear-gradient(180deg, #ffde6b 0%, #f5b518 100%);
      border: 2px solid #fff2ba;
      border-bottom: 3px solid #b57700;
      color: #382000;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-variant-numeric: tabular-nums;
    }

    /* MAIN VIEWPORT */
    .views {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .view.active {
      display: flex;
    }

    /* GARDEN VIEW */
    .garden-view {
      gap: 8px;
    }

    .canvas-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #24423a;
      background: #102622;
      position: relative;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.42);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    .garden-overlay-top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
      z-index: 5;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .hud-chip {
      background: rgba(13, 26, 23, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      padding: 4px 10px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 800;
      color: #ebfff6;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .hud-chip.clickable {
      pointer-events: auto;
      cursor: pointer;
      background: linear-gradient(180deg, #1f4239, #152e28);
      border-color: #46e098;
    }

    .hud-chip.clickable:active {
      transform: scale(0.96);
    }

    .hud-chip.harvest-quick {
      pointer-events: auto;
      cursor: pointer;
      background: linear-gradient(180deg, #3be093, #1ea868);
      border-color: #b5ffdc;
      color: #062115;
    }

    .hud-chip.order-chip {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(25, 45, 40, 0.92);
      border-color: rgba(255, 207, 72, 0.55);
      color: #ffe9a3;
      font-size: 10.5px;
      padding: 3px 9px;
      margin: 0 auto;
    }

    .active-devices-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
    }

    .device-chip {
      background: rgba(13, 26, 23, 0.92);
      border: 1.5px solid #ffcf48;
      color: #fff5cc;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* 3-BUTTON TOOLBAR (STYLE MATCHING ORIGINAL SCREENSHOT) */
    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      flex-shrink: 0;
    }

    .tool-btn {
      background: linear-gradient(180deg, #1b2e29 0%, #142420 100%);
      border: 2px solid #28423b;
      border-bottom-width: 4px;
      color: var(--text);
      border-radius: 16px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .tool-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .tool-btn.active {
      background: linear-gradient(180deg, #215946 0%, #174032 100%);
      border-color: #46e098;
      color: #ffffff;
    }

    .tool-btn.danger.active {
      background: linear-gradient(180deg, #8c2e2e 0%, #631d1d 100%);
      border-color: #ff8f8f;
      color: #ffe5e5;
    }

    .tool-btn .sub {
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 700;
      max-width: 106px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-btn.active .sub {
      color: #8cf7c5;
    }

    /* SUBPAGES */
    .subpage {
      background: var(--panel);
      border: 2px solid #243d36;
      border-radius: 18px;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .timer-badge {
      background: var(--panel-2);
      border: 1.5px solid #2b4a41;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: #9efad0;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    .filter-btn {
      background: var(--panel-2);
      border: 1.5px solid #28453d;
      color: var(--muted);
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent-dark);
      border-color: #46e098;
      color: #fff;
    }

    .scroll-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .item-card {
      background: linear-gradient(180deg, #1b302b 0%, #142420 100%);
      border: 2px solid #28453d;
      border-bottom-width: 3px;
      border-radius: 15px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-card.out-of-stock {
      opacity: 0.48;
    }

    .item-card.selected-card {
      border-color: #46e098;
      background: linear-gradient(180deg, #214f41 0%, #17382e 100%);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }

    .item-thumb {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: #101f1b;
      border: 1.5px solid #2c4d44;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-info {
      min-width: 0;
    }

    .item-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .item-name {
      font-size: 13.5px;
      font-weight: 800;
    }

    .tag {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .rarity-common { background: rgba(203, 213, 225, 0.2); color: #e2e8f0; }
    .rarity-uncommon { background: rgba(56, 189, 248, 0.24); color: #7dd3fc; }
    .rarity-rare { background: rgba(192, 132, 252, 0.24); color: #e9d5ff; }
    .rarity-epic { background: rgba(244, 114, 182, 0.26); color: #fbcfe8; }
    .rarity-legendary { background: rgba(255, 207, 72, 0.26); color: #fef08a; }
    .rarity-mythical { background: rgba(255, 102, 102, 0.28); color: #fecaca; }

    .item-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.35;
    }

    .buy-btn {
      background: linear-gradient(180deg, #42e396 0%, #1eb06a 100%);
      border: 1.5px solid #a8ffd5;
      border-bottom: 3px solid #117042;
      color: #052415;
      font-weight: 900;
      font-size: 12.5px;
      padding: 8px 12px;
      border-radius: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      font-variant-numeric: tabular-nums;
    }

    .buy-btn:disabled {
      background: #1c332d;
      border-color: #27473f;
      border-bottom-width: 2px;
      color: #5b8075;
      cursor: not-allowed;
    }

    .sell-all-btn {
      background: linear-gradient(180deg, #ffde6b 0%, #f5b518 100%);
      border: 1.5px solid #fff2ba;
      border-bottom: 3px solid #b57700;
      color: #382000;
      font-weight: 900;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sell-all-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 36px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* BOTTOM NAVIGATION */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--panel);
      border: 2px solid #243d36;
      border-radius: 17px;
      padding: 5px;
      flex-shrink: 0;
    }

    .nav-btn {
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      position: relative;
    }

    .nav-btn.active {
      background: linear-gradient(180deg, #289e6b 0%, #1b754e 100%);
      border-color: #6df5b7;
      color: #fff;
    }

    .badge-dot {
      position: absolute;
      top: 3px;
      right: 11px;
      background: var(--gold);
      color: #2b1800;
      font-size: 9.5px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 7px;
      display: none;
    }

    .badge-dot.visible {
      display: inline-block;
    }

    /* MODALS & SHEETS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 14, 12, 0.82);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-backdrop.sheet {
      align-items: flex-end;
      padding: 0;
    }

    .modal {
      background: var(--panel);
      border: 2px solid #2c4d44;
      border-radius: 20px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-backdrop.sheet .modal {
      max-width: 520px;
      border-radius: 22px 22px 0 0;
      border-bottom: none;
      max-height: 75dvh;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      font-size: 13px;
      color: #d6f7ea;
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: var(--panel-3);
      border: 1.5px solid #355e53;
      color: var(--text);
      padding: 8px 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-danger {
      background: linear-gradient(180deg, #ff7070, #d93838);
      border: 1.5px solid #ffb3b3;
      color: #fff;
      padding: 8px 13px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: #142b26;
      border: 2px solid #46e098;
      color: #fff;
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 200;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="profile">
        <div id="avatarBox" class="avatar"></div>
        <div class="profile-info">
          <div class="profile-name-row">
            <div id="playerName" class="profile-name">Садовод</div>
            <span id="lvlBadge" class="lvl-pill">Ур. 1</span>
          </div>
          <div class="profile-record">
            <span id="trophyIco"></span>
            <span id="bestRecord">Рекорд: 0</span>
          </div>
        </div>
      </div>

      <div class="stats-right">
        <div class="weather-pill">
          <span id="weatherIconWrap"></span>
          <span id="weatherName">Ясно</span>
          <div class="weather-bar">
            <div id="weatherProgress" class="weather-bar-fill"></div>
          </div>
        </div>
        <div class="coins-badge">
          <span id="headerCoinIco"></span>
          <span id="coinsDisplay">120</span>
        </div>
      </div>
    </header>

    <!-- MAIN VIEWS -->
    <main class="views">
      <!-- 1. GARDEN VIEW -->
      <section id="view-garden" class="view garden-view active">
        <div id="canvasContainer" class="canvas-container">
          <div class="garden-overlay-top">
            <div class="hud-row">
              <span id="plotCountLabel" class="hud-chip">
                <span id="hudHouseIco"></span>
                <span id="plotCountText">9 / 15</span>
              </span>
              <button id="selectedSeedHud" class="hud-chip clickable">
                <span id="hudSeedIcon"></span>
                <span id="hudSeedText">Морковь: 3</span>
                <span style="font-size:9px;opacity:0.85;">▼</span>
              </button>
              <button id="readyCountBtn" class="hud-chip">
                <span id="hudBasketIco"></span>
                <span id="readyCountText">0</span>
              </button>
            </div>

            <div class="hud-row" style="justify-content:center;">
              <button id="orderBannerBtn" class="hud-chip order-chip">
                <span id="orderText">Заказ: Морковь (0/2) • +60%</span>
              </button>
            </div>

            <div id="activeDevicesStrip" class="active-devices-strip"></div>
          </div>
          <canvas id="gardenCanvas"></canvas>
        </div>

        <!-- 3-BUTTON TOOLBAR -->
        <div class="toolbar">
          <button id="toolPlant" class="tool-btn active">
            <span id="icoToolPlant"></span>
            <span>Посадка</span>
            <span id="seedSub" class="sub">Морковь (3)</span>
          </button>

          <button id="toolGear" class="tool-btn">
            <span id="icoToolGear"></span>
            <span>Снаряжение</span>
            <span id="gearSub" class="sub">Выбрать ▾</span>
          </button>

          <button id="toolShovel" class="tool-btn danger">
            <span id="icoToolShovel"></span>
            <span>Лопата</span>
            <span class="sub">Удалить</span>
          </button>
        </div>
      </section>

      <!-- 2. SEED SHOP VIEW -->
      <section id="view-shop" class="view subpage">
        <div class="panel-header">
          <div class="panel-title">
            <span id="icoTitleShop"></span>
            <span>Лавка семян</span>
          </div>
          <div class="timer-badge">Завоз: <span id="shopTimer">05:00</span></div>
        </div>

        <div class="filters" id="seedFilters">
          <button class="filter-btn active" data-filter="all">Все (24)</button>
          <button class="filter-btn" data-filter="common">Базовые</button>
          <button class="filter-btn" data-filter="rare">Редкие</button>
          <button class="filter-btn" data-filter="epic">Эпик</button>
          <button class="filter-btn" data-filter="legendary">Легенд.+Миф</button>
        </div>

        <div id="shopList" class="scroll-list"></div>
      </section>

      <!-- 3. GEAR SHOP VIEW -->
      <section id="view-gear" class="view subpage">
        <div class="panel-header">
          <div class="panel-title">
            <span id="icoTitleGear"></span>
            <span>Лавка снаряжения</span>
          </div>
          <div class="timer-badge">Завоз: <span id="gearShopTimer">05:00</span></div>
        </div>
