    // --- PROCEDURAL CARTOON VECTOR DRAWING FOR CROPS & GEAR ---
    function drawCropIllustration(ctx, crop, cx, cy, radius, stage = 1) {
      ctx.save();
      ctx.translate(cx, cy);

      // Stage 0: Sprout
      if (stage < 0.35) {
        ctx.strokeStyle = "#14532d";
        ctx.lineWidth = Math.max(2, radius * 0.12);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, radius * 0.45);
        ctx.quadraticCurveTo(-radius * 0.1, 0, 0, -radius * 0.25);
        ctx.stroke();

        ctx.fillStyle = "#4ade80";
        ctx.strokeStyle = "#14532d";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(-radius * 0.28, -radius * 0.18, radius * 0.28, radius * 0.15, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(radius * 0.28, -radius * 0.24, radius * 0.28, radius * 0.15, 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        return;
      }

      // Stage 0.35..0.75: Bush
      if (stage < 0.75) {
        ctx.fillStyle = "#22c55e";
        ctx.strokeStyle = "#14532d";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-radius * 0.25, radius * 0.05, radius * 0.36, 0, Math.PI * 2);
        ctx.arc(radius * 0.25, radius * 0.05, radius * 0.36, 0, Math.PI * 2);
        ctx.arc(0, -radius * 0.18, radius * 0.42, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Highlight
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.beginPath();
        ctx.arc(-radius * 0.12, -radius * 0.28, radius * 0.14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      // Full mature fruit/crop illustration
      const r = radius * 0.68;
      ctx.strokeStyle = "#1e1b18";
      ctx.lineWidth = Math.max(1.8, r * 0.11);
      ctx.lineJoin = "round";

      // Leaf top helper
      const drawTopLeaf = (yOff = -r * 0.85) => {
        ctx.fillStyle = crop.leaf || "#22c55e";
        ctx.beginPath();
        ctx.ellipse(-r * 0.28, yOff, r * 0.34, r * 0.18, -0.45, 0, Math.PI * 2);
        ctx.ellipse(r * 0.28, yOff, r * 0.34, r * 0.18, 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      };

      if (crop.shape === "carrot") {
        drawTopLeaf(-r * 0.72);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.moveTo(-r * 0.48, -r * 0.65);
        ctx.quadraticCurveTo(0, -r * 0.82, r * 0.48, -r * 0.65);
        ctx.lineTo(0, r * 0.95);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "berry") {
        drawTopLeaf(-r * 0.78);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.moveTo(-r * 0.72, -r * 0.55);
        ctx.quadraticCurveTo(0, -r * 0.85, r * 0.72, -r * 0.55);
        ctx.quadraticCurveTo(r * 0.75, r * 0.35, 0, r * 0.92);
        ctx.quadraticCurveTo(-r * 0.75, r * 0.35, -r * 0.72, -r * 0.55);
        ctx.fill();
        ctx.stroke();
        // Seeds
        ctx.fillStyle = "#fef08a";
        [[-0.25, -0.15], [0.25, -0.15], [0, 0.15], [-0.2, 0.42], [0.2, 0.42]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.arc(r * sx, r * sy, r * 0.07, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (crop.shape === "corn") {
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.46, r * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Husk leaves
        ctx.fillStyle = crop.leaf;
        ctx.beginPath();
        ctx.moveTo(-r * 0.55, r * 0.1);
        ctx.quadraticCurveTo(-r * 0.45, r * 0.9, 0, r * 0.95);
        ctx.quadraticCurveTo(r * 0.45, r * 0.9, r * 0.55, r * 0.1);
        ctx.quadraticCurveTo(0, r * 0.5, -r * 0.55, r * 0.1);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "pepper") {
        drawTopLeaf(-r * 0.75);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.moveTo(-r * 0.35, -r * 0.65);
        ctx.quadraticCurveTo(r * 0.55, -r * 0.65, r * 0.45, r * 0.35);
        ctx.quadraticCurveTo(r * 0.35, r * 0.95, -r * 0.15, r * 0.92);
        ctx.quadraticCurveTo(-r * 0.55, r * 0.25, -r * 0.35, -r * 0.65);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "cluster") {
        drawTopLeaf(-r * 0.85);
        ctx.fillStyle = crop.color;
        const pts = [[-0.35, -0.35], [0.35, -0.35], [0, -0.35], [-0.25, 0.1], [0.25, 0.1], [0, 0.55]];
        pts.forEach(([bx, by]) => {
          ctx.beginPath();
          ctx.arc(r * bx, r * by, r * 0.34, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
      } else if (crop.shape === "pumpkin") {
        drawTopLeaf(-r * 0.82);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.ellipse(-r * 0.42, 0.05 * r, r * 0.45, r * 0.72, 0, 0, Math.PI * 2);
        ctx.ellipse(r * 0.42, 0.05 * r, r * 0.45, r * 0.72, 0, 0, Math.PI * 2);
        ctx.ellipse(0, 0.05 * r, r * 0.42, r * 0.76, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "melon") {
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.84, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "#14532d";
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.45, -Math.PI * 0.4, Math.PI * 0.4);
        ctx.stroke();
      } else if (crop.shape === "pineapple") {
        ctx.fillStyle = crop.leaf;
        ctx.beginPath();
        ctx.moveTo(0, -r * 1.15);
        ctx.lineTo(-r * 0.45, -r * 0.45);
        ctx.lineTo(r * 0.45, -r * 0.45);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.18, r * 0.58, r * 0.72, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "mushroom") {
        ctx.fillStyle = "#f1f5f9";
        ctx.beginPath();
        ctx.roundRect(-r * 0.28, 0, r * 0.56, r * 0.78, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.arc(0, r * 0.05, r * 0.78, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "flower") {
        ctx.fillStyle = crop.color;
        for (let a = 0; a < 6; a++) {
          const ang = (a * Math.PI) / 3;
          ctx.beginPath();
          ctx.ellipse(Math.cos(ang) * r * 0.44, Math.sin(ang) * r * 0.44, r * 0.36, r * 0.24, ang, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.fillStyle = crop.leaf;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "star" || crop.shape === "dragon") {
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        const spikes = crop.shape === "star" ? 5 : 6;
        for (let i = 0; i < spikes * 2; i++) {
          const rad = i % 2 === 0 ? r * 0.9 : r * 0.45;
          const ang = (i * Math.PI) / spikes - Math.PI / 2;
          if (i === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
          else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "oval") {
        drawTopLeaf(-r * 0.76);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.08, r * 0.56, r * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        // round / peach
        drawTopLeaf(-r * 0.78);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.arc(0, r * 0.08, r * 0.76, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Cartoon glossy highlight
      ctx.fillStyle = "rgba(255, 255, 255, 0.34)";
      ctx.beginPath();
      ctx.ellipse(-r * 0.24, -r * 0.18, r * 0.18, r * 0.1, -0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawGearIllustration(ctx, gear, cx, cy, radius) {
      ctx.save();
      ctx.translate(cx, cy);
      const r = radius * 0.65;
      ctx.strokeStyle = "#16241b";
      ctx.lineWidth = 2;

      if (gear.id === "watering_can") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.roundRect(-r * 0.45, -r * 0.25, r * 0.9, r * 0.85, 5);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(r * 0.45, r * 0.2);
        ctx.lineTo(r * 0.95, -r * 0.35);
        ctx.stroke();
      } else if (gear.id === "giant_elixir" || gear.id === "growth_fertilizer") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.arc(0, r * 0.22, r * 0.62, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(-r * 0.22, -r * 0.75, r * 0.44, r * 0.42);
        ctx.strokeRect(-r * 0.22, -r * 0.75, r * 0.44, r * 0.42);
      } else if (gear.id === "sprinkler_basic" || gear.id === "sprinkler_gold") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.moveTo(-r * 0.55, r * 0.75);
        ctx.lineTo(0, -r * 0.45);
        ctx.lineTo(r * 0.55, r * 0.75);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#bae6fd";
        ctx.beginPath();
        ctx.arc(-r * 0.5, -r * 0.55, r * 0.18, 0, Math.PI * 2);
        ctx.arc(r * 0.5, -r * 0.55, r * 0.18, 0, Math.PI * 2);
        ctx.fill();
      } else if (gear.id === "lightning_rod") {
        ctx.strokeStyle = gear.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9);
        ctx.lineTo(0, r * 0.85);
        ctx.moveTo(-r * 0.5, -r * 0.35);
        ctx.lineTo(r * 0.5, -r * 0.35);
        ctx.stroke();
      } else if (gear.id === "star_prism") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9);
        ctx.lineTo(r * 0.75, 0);
        ctx.lineTo(0, r * 0.9);
        ctx.lineTo(-r * 0.75, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (gear.id === "collector_drone") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.1, r * 0.8, r * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#bae6fd";
        ctx.beginPath();
        ctx.arc(0, -r * 0.15, r * 0.38, Math.PI, 0);
        ctx.fill();
        ctx.stroke();
      } else {
        // expand_plot
        ctx.fillStyle = "#9c5c2b";
        ctx.beginPath();
        ctx.roundRect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4, 6);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "#fde047";
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.38);
        ctx.lineTo(0, r * 0.38);
        ctx.moveTo(-r * 0.38, 0);
        ctx.lineTo(r * 0.38, 0);
        ctx.stroke();
      }

      ctx.restore();
    }

    function createMiniThumbCanvas(drawFn) {
      const c = document.createElement("canvas");
      c.width = 80;
      c.height = 80;
      c.style.width = "40px";
      c.style.height = "40px";
      const g = c.getContext("2d");
      drawFn(g, 40, 40, 34);
      return c;
    }

    // --- HELPERS ---
    function getCrop(id) {
      return CROPS.find(c => c.id === id);
    }

    function getGear(id) {
      return GEAR_ITEMS.find(g => g.id === id);
    }

    function createEmptyPlot() {
      return {
        cropId: null,
        progressMs: 0,
        growDuration: 0,
        ready: false,
        weight: 0,
        mutations: [],
        giantBoost: 1
      };
    }

    function createDefaultState() {
      const now = Date.now();
      return {
        version: 8,
        coins: 120,
        bestFruitValue: 0,
        unlockedPlots: 9,
        plots: Array.from({ length: 15 }, () => createEmptyPlot()),
        seedInventory: { carrot: 3 },
        selectedSeed: "carrot",
        gearInventory: { watering_can: 2 },
        selectedGear: "watering_can",
        harvestBag: [],
        devices: [],
        weather: { id: "clear", remainingMs: 45000, durationMs: 45000 },
        shop: { nextRefreshAt: now + SHOP_REFRESH_MS, stock: {} },
        gearShop: { nextRefreshAt: now + SHOP_REFRESH_MS, stock: {} },
        lastTimestamp: now
      };
    }

    function generateSeedStock() {
      const stock = {};
      CROPS.forEach(c => {
        stock[c.id] = Math.random() <= c.stockChance ? Math.floor(Math.random() * c.maxStock) + 1 : 0;
      });
      if (!stock.carrot || stock.carrot < 3) stock.carrot = 5;
      return stock;
    }

    function generateGearStock() {
      const stock = {};
      GEAR_ITEMS.forEach(g => {
        if (g.id === "expand_plot") {
          stock[g.id] = 1;
        } else {
          stock[g.id] = Math.random() <= g.stockChance ? Math.floor(Math.random() * g.maxStock) + 1 : 0;
        }
      });
      if (!stock.watering_can || stock.watering_can < 2) stock.watering_can = 3;
      return stock;
    }

    function rollFruitStatsWithContext(crop, plot, weatherId, activeDeviceIds) {
      const hasGoldSprinkler = activeDeviceIds.includes("sprinkler_gold");
      const hasBasicSprinkler = activeDeviceIds.includes("sprinkler_basic");
      const hasPrism = activeDeviceIds.includes("star_prism");
      const hasRod = activeDeviceIds.includes("lightning_rod");

      const sizeBoost = (hasGoldSprinkler ? 1.35 : hasBasicSprinkler ? 1.2 : 1) * (plot.giantBoost || 1);
      const isGiantRoll = Math.random() < 0.12;
      const rawRatio = Math.pow(Math.random(), isGiantRoll ? 0.6 : 1.7);
      const weight = Number(((crop.minKg + (crop.maxKg - crop.minKg) * rawRatio) * sizeBoost).toFixed(2));

      const mutations = [];
      const goldMult = hasGoldSprinkler ? 3 : 1;
      const prismMult = hasPrism ? 3 : 1;
      const rodMult = hasRod ? 3 : 1;

      if (Math.random() < 0.012 * prismMult) {
        mutations.push({ id: "rainbow", name: "Rainbow", mult: 10, color: "#f472b6" });
      } else if (Math.random() < 0.04 * goldMult) {
        mutations.push({ id: "gold", name: "Gold", mult: 3, color: "#ffcb3d" });
      }

      if (weatherId === "rain" && Math.random() < 0.5) {
        mutations.push({ id: "wet", name: "Wet", mult: 1.5, color: "#38bdf8" });
      }
      if (weatherId === "frost" && Math.random() < 0.4) {
        mutations.push({ id: "frozen", name: "Frozen", mult: 5, color: "#7dd3fc" });
      }
      if (weatherId === "storm" && Math.random() < 0.18 * rodMult) {
        mutations.push({ id: "shocked", name: "Shocked", mult: 20, color: "#c084fc" });
      }
      if (weatherId === "meteor" && Math.random() < 0.14 * prismMult) {
        mutations.push({ id: "starlit", name: "Starlit", mult: 35, color: "#fde047" });
      }

      return { weight, mutations };
    }

    function calcFruitPrice(crop, weight, mutations) {
      const avgKg = (crop.minKg + crop.maxKg) / 2;
      const weightFactor = Math.max(0.75, Math.min(4.5, weight / avgKg));
      const mutMult = mutations.reduce((acc, m) => acc * m.mult, 1);
      return Math.max(1, Math.round(crop.baseSell * weightFactor * mutMult));
    }

    // --- OFFLINE PROGRESSION ---
    function applyElapsedOfflineTime(targetState, elapsedMs) {
      if (elapsedMs <= 0) return 0;
      const now = Date.now();
      const safeElapsed = Math.min(elapsedMs, 7 * 24 * 60 * 60 * 1000);

      const wasActiveIds = (targetState.devices || [])
        .filter(d => d.endAt > now - safeElapsed)
        .map(d => d.id);

      let offlineSpeed = 1;
      if (wasActiveIds.includes("sprinkler_basic")) offlineSpeed += 0.35;
      if (wasActiveIds.includes("sprinkler_gold")) offlineSpeed += 0.65;
      if (targetState.weather && targetState.weather.id === "rain") offlineSpeed += 0.20;

      const droneWasActive = wasActiveIds.includes("collector_drone");
      let maturedCount = 0;

      for (let i = 0; i < targetState.unlockedPlots; i++) {
        const p = targetState.plots[i];
        if (!p || !p.cropId) continue;
        const crop = getCrop(p.cropId);
        if (!crop) continue;

        const maxMs = (p.growDuration || crop.growSec) * 1000;
        if (!p.ready) {
          p.progressMs = Math.min(maxMs, (p.progressMs || 0) + safeElapsed * offlineSpeed);
          if (p.progressMs >= maxMs) {
            p.ready = true;
            const stats = rollFruitStatsWithContext(crop, p, targetState.weather.id, wasActiveIds);
            p.weight = stats.weight;
            p.mutations = stats.mutations;
            maturedCount++;
          }
        }

        if (p.ready && droneWasActive) {
          const val = calcFruitPrice(crop, p.weight, p.mutations);
          targetState.coins += val;
          if (val > targetState.bestFruitValue) targetState.bestFruitValue = val;
          if (crop.multi) {
            p.ready = false;
            p.progressMs = 0;
            p.weight = 0;
            p.mutations = [];
            p.giantBoost = 1;
          } else {
            targetState.plots[i] = createEmptyPlot();
          }
        }
      }

      targetState.devices = (targetState.devices || []).filter(d => d.endAt > now);
      targetState.lastTimestamp = now;
      return maturedCount;
    }

    function loadState() {
      const def = createDefaultState();
      try {
        const raw =
          localStorage.getItem(SAVE_KEY) ||
          localStorage.getItem("pocket_garden_save_v7") ||
          localStorage.getItem("pocket_garden_save_v6");

        if (!raw) {
          def.shop.stock = generateSeedStock();
          def.gearShop.stock = generateGearStock();
          return def;
        }

        const parsed = JSON.parse(raw);
        const now = Date.now();
        const st = {
          ...def,
          ...parsed,
          seedInventory: { ...def.seedInventory, ...(parsed.seedInventory || {}) },
          gearInventory: { ...def.gearInventory, ...(parsed.gearInventory || {}) },
          weather: { ...def.weather, ...(parsed.weather || {}) },
          shop: { ...def.shop, ...(parsed.shop || {}) },
          gearShop: { ...def.gearShop, ...(parsed.gearShop || {}) }
        };

        st.plots = Array.from({ length: 15 }, (_, i) => {
          const old = parsed.plots && parsed.plots[i] ? parsed.plots[i] : null;
          if (!old || !old.cropId) return createEmptyPlot();
          const crop = getCrop(old.cropId);
          if (!crop) return createEmptyPlot();

          const durSec = Number(old.growDuration) || crop.growSec;
          const maxMs = durSec * 1000;
          const progMs = Math.max(0, Math.min(maxMs, Number(old.progressMs) || 0));
          const isReady = Boolean(old.ready) || progMs >= maxMs;

          return {
            cropId: crop.id,
            progressMs: isReady ? maxMs : progMs,
            growDuration: durSec,
            ready: isReady,
            weight: Number(old.weight) || 0,
            mutations: Array.isArray(old.mutations) ? old.mutations : [],
            giantBoost: Number(old.giantBoost) || 1
          };
        });

        if (!Array.isArray(st.harvestBag)) st.harvestBag = [];
        if (!Array.isArray(st.devices)) st.devices = [];

        const prevTs = Number(parsed.lastTimestamp) || now;
        const offlineElapsed = Math.max(0, now - prevTs);
        applyElapsedOfflineTime(st, offlineElapsed);

        if (!st.shop.stock || Object.keys(st.shop.stock).length === 0 || now >= st.shop.nextRefreshAt) {
          st.shop.stock = generateSeedStock();
          st.shop.nextRefreshAt = now + SHOP_REFRESH_MS;
        }

        if (!st.gearShop.stock || Object.keys(st.gearShop.stock).length === 0 || now >= st.gearShop.nextRefreshAt) {
          st.gearShop.stock = generateGearStock();
          st.gearShop.nextRefreshAt = now + SHOP_REFRESH_MS;
        }

        ensureValidSelectedSeed(st);
        ensureValidSelectedGear(st);
        return st;
      } catch (e) {
        def.shop.stock = generateSeedStock();
        def.gearShop.stock = generateGearStock();
        return def;
      }
    }

    function ensureValidSelectedSeed(st) {
      if ((st.seedInventory[st.selectedSeed] || 0) <= 0) {
        const available = CROPS.find(c => (st.seedInventory[c.id] || 0) > 0);
        if (available) st.selectedSeed = available.id;
      }
    }

    function ensureValidSelectedGear(st) {
      if ((st.gearInventory[st.selectedGear] || 0) <= 0) {
        const available = GEAR_ITEMS.find(g => (st.gearInventory[g.id] || 0) > 0);
        if (available) st.selectedGear = available.id;
      }
    }

    function saveState() {
      try {
        state.lastTimestamp = Date.now();
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    let state = loadState();
    let activeTool = "plant"; // plant | gear | shovel
    let shopFilter = "all";
    let gearFilter = "all";
    let currentView = "garden";
    let lastTickAt = Date.now();

    window.addEventListener("beforeunload", saveState);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        saveState();
      } else {
        const now = Date.now();
        const awayMs = Math.max(0, now - (state.lastTimestamp || now));
        if (awayMs > 1500) {
          const matured = applyElapsedOfflineTime(state, awayMs);
          if (matured > 0) showToast(`Созрело за время отсутствия: ${matured}`);
          saveState();
        }
        lastTickAt = now;
      }
    });

    // --- PROFILE ---
    function initProfile() {
      const nameEl = document.getElementById("playerName");
      const avatarEl = document.getElementById("avatarBox");
      const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

      if (user) {
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ") || user.username || "Садовод";
        nameEl.textContent = fullName;
        const initials = (user.first_name ? user.first_name[0] : "С").toUpperCase();
        avatarEl.textContent = initials;

        if (user.photo_url) {
          const img = document.createElement("img");
          img.src = user.photo_url;
          img.alt = fullName;
          img.onload = () => {
            avatarEl.innerHTML = "";
            avatarEl.appendChild(img);
          };
          img.onerror = () => {
            avatarEl.textContent = initials;
          };
        }
      } else {
        avatarEl.textContent = "С";
      }
    }

    // --- TOAST & MODALS ---
    let toastTimer = null;
    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1900);
    }

    function openModal(title, htmlBody, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = htmlBody;
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      buttons.forEach(btn => {
        const b = document.createElement("button");
        b.className = btn.className || "btn-secondary";
        b.textContent = btn.label;
        b.onclick = () => {
          closeModal();
          if (btn.onClick) btn.onClick();
        };
        actions.appendChild(b);
      });
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    // --- SEED PICKER SHEET ---
    function openSeedPicker() {
      const list = document.getElementById("seedPickerList");
      list.innerHTML = "";

      const ownedCrops = CROPS.filter(c => (state.seedInventory[c.id] || 0) > 0);

      if (ownedCrops.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            В сумке нет семян.<br><br>
            <button id="goToShopFromPicker" class="buy-btn" style="margin:0 auto;">Открыть лавку семян</button>
          </div>
        `;
        document.getElementById("goToShopFromPicker").onclick = () => {
          closeSeedPicker();
          switchView("shop");
        };
      } else {
        ownedCrops.forEach(crop => {
          const qty = state.seedInventory[crop.id] || 0;
          const isSelected = state.selectedSeed === crop.id && activeTool === "plant";

          const card = document.createElement("div");
          card.className = "item-card" + (isSelected ? " selected-card" : "");
          card.style.cursor = "pointer";
          card.innerHTML = `
            <div class="item-left">
              <div class="item-thumb"></div>
              <div class="item-info">
                <div class="item-title-row">
                  <span class="item-name">${crop.name}</span>
                  <span class="tag rarity-${crop.rarity}">${crop.rarityLabel}</span>
                </div>
                <div class="item-meta">
                  ${crop.growSec}с • ${crop.multi ? "Многоразовое" : "Одноразовое"} • В сумке: <strong>${qty} шт.</strong>
                </div>
              </div>
            </div>
            <button class="buy-btn">${isSelected ? "Активно" : "Выбрать"}</button>
          `;

          card.querySelector(".item-thumb").appendChild(
            createMiniThumbCanvas((g, x, y, r) => drawCropIllustration(g, crop, x, y, r, 1))
          );

          card.onclick = () => {
            state.selectedSeed = crop.id;
            activeTool = "plant";
            updateToolButtons();
            saveState();
            closeSeedPicker();
            haptic("light");
            showToast(`Выбрано: ${crop.name}`);
          };

          list.appendChild(card);
        });
      }

      document.getElementById("seedPickerBackdrop").classList.add("open");
    }

    function closeSeedPicker() {
      document.getElementById("seedPickerBackdrop").classList.remove("open");
    }

    document.getElementById("closeSeedPicker").onclick = closeSeedPicker;
    document.getElementById("seedPickerBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "seedPickerBackdrop") closeSeedPicker();
    });

    // --- GEAR PICKER SHEET ---
    function openGearPicker() {
      const list = document.getElementById("gearPickerList");
      list.innerHTML = "";

      const ownedGear = GEAR_ITEMS.filter(g => (state.gearInventory[g.id] || 0) > 0);

      if (ownedGear.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            В сумке нет купленного снаряжения.<br><br>
            <button id="goToGearShopFromPicker" class="buy-btn" style="margin:0 auto;">Открыть лавку снаряжения</button>
          </div>
        `;
        document.getElementById("goToGearShopFromPicker").onclick = () => {
          closeGearPicker();
          switchView("gear");
        };
      } else {
        ownedGear.forEach(item => {
          const qty = state.gearInventory[item.id] || 0;
          const isPlotTool = item.mode === "plot";
          const isSelected = isPlotTool && state.selectedGear === item.id && activeTool === "gear";

          const card = document.createElement("div");
          card.className = "item-card" + (isSelected ? " selected-card" : "");
          card.style.cursor = "pointer";
          card.innerHTML = `
            <div class="item-left">
              <div class="item-thumb"></div>
              <div class="item-info">
                <div class="item-title-row">
                  <span class="item-name">${item.name}</span>
                  <span class="tag rarity-${item.rarity}">${qty} шт.</span>
                </div>
                <div class="item-meta">${item.desc}</div>
              </div>
            </div>
            <button class="buy-btn">${isPlotTool ? (isSelected ? "В руке" : "Взять") : "Включить"}</button>
          `;

          card.querySelector(".item-thumb").appendChild(
            createMiniThumbCanvas((g, x, y, r) => drawGearIllustration(g, item, x, y, r))
          );

          card.onclick = () => {
            if (isPlotTool) {
              state.selectedGear = item.id;
              activeTool = "gear";
              updateToolButtons();
              saveState();
              closeGearPicker();
              haptic("light");
              showToast(`Взято: ${item.name} (нажми на грядку)`);
            } else if (item.mode === "garden") {
              if ((state.gearInventory[item.id] || 0) <= 0) return;
              state.gearInventory[item.id]--;
              const existing = state.devices.find(d => d.id === item.id);
              if (existing) {
                existing.endAt = Math.max(existing.endAt, Date.now()) + item.durationSec * 1000;
              } else {
                state.devices.push({ id: item.id, endAt: Date.now() + item.durationSec * 1000 });
              }
              ensureValidSelectedGear(state);
              saveState();
              closeGearPicker();
              haptic("success");
              showToast(`${item.name} активирован в саду`);
            }
          };

          list.appendChild(card);
        });
      }

      document.getElementById("gearPickerBackdrop").classList.add("open");
    }

    function closeGearPicker() {
      document.getElementById("gearPickerBackdrop").classList.remove("open");
    }

    document.getElementById("closeGearPicker").onclick = closeGearPicker;
    document.getElementById("gearPickerBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "gearPickerBackdrop") closeGearPicker();
    });

    // --- SPEED & FORMATTERS ---
    function hasActiveDevice(id) {
      const now = Date.now();
      return state.devices.some(d => d.id === id && d.endAt > now);
    }

    function getSpeedMultiplier() {
      let mult = 1;
      if (hasActiveDevice("sprinkler_basic")) mult += 0.35;
      if (hasActiveDevice("sprinkler_gold")) mult += 0.65;
      if (state.weather.id === "rain") mult += 0.20;
      return mult;
    }

    function formatNumber(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e4) return (n / 1e3).toFixed(1) + "K";
      return Math.floor(n).toLocaleString("ru-RU");
    }

    function formatTimeLeft(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const m = String(Math.floor(totalSec / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    // --- WEATHER ---
    function pickRandomWeather(currentId) {
      const pool = WEATHERS.filter(w => w.id !== currentId);
      const total = pool.reduce((s, w) => s + w.weight, 0);
      let r = Math.random() * total;
      for (const w of pool) {
        if (r < w.weight) return w;
        r -= w.weight;
      }
      return pool[0];
    }

    let lastWeatherRenderedId = "";
    function updateWeather(dt) {
      state.weather.remainingMs -= dt;
      if (state.weather.remainingMs <= 0) {
        const next = pickRandomWeather(state.weather.id);
        const nextDur = (40 + Math.floor(Math.random() * 31)) * 1000;
        state.weather = { id: next.id, remainingMs: nextDur, durationMs: nextDur };
        showToast(`Погода сменилась: ${next.name}`);
      }
      const wObj = WEATHERS.find(w => w.id === state.weather.id) || WEATHERS[0];
      if (lastWeatherRenderedId !== wObj.id) {
        lastWeatherRenderedId = wObj.id;
        document.getElementById("weatherIconWrap").innerHTML = ICONS[wObj.iconKey] || ICONS.sun;
        document.getElementById("weatherName").textContent = wObj.name;
      }
      const leftPct = Math.max(0, Math.min(100, (state.weather.remainingMs / state.weather.durationMs) * 100));
      document.getElementById("weatherProgress").style.width = leftPct + "%";
    }

    // --- GAME TICK ---
    let saveCounter = 0;
    function gameTick() {
      const now = Date.now();
      const dt = Math.max(0, Math.min(1000, now - lastTickAt));
      lastTickAt = now;

      updateWeather(dt);

      if (now >= state.shop.nextRefreshAt) {
        state.shop.stock = generateSeedStock();
        state.shop.nextRefreshAt = now + SHOP_REFRESH_MS;
        showToast("Завоз в лавке семян!");
        if (currentView === "shop") renderShop();
      }
      document.getElementById("shopTimer").textContent = formatTimeLeft(state.shop.nextRefreshAt - now);

      if (now >= state.gearShop.nextRefreshAt) {
        state.gearShop.stock = generateGearStock();
        state.gearShop.nextRefreshAt = now + SHOP_REFRESH_MS;
        showToast("Завоз в лавке снаряжения!");
        if (currentView === "gear") renderGear();
      }
      document.getElementById("gearShopTimer").textContent = formatTimeLeft(state.gearShop.nextRefreshAt - now);

      const beforeDev = state.devices.length;
      state.devices = state.devices.filter(d => d.endAt > now);
      if (state.devices.length !== beforeDev && currentView === "gear") {
        renderGear();
      }

      const speedMult = getSpeedMultiplier();
      const activeIds = state.devices.map(d => d.id);
      let readyCount = 0;

      for (let i = 0; i < state.unlockedPlots; i++) {
        const p = state.plots[i];
        if (!p || !p.cropId) continue;
        const crop = getCrop(p.cropId);
        if (!crop) continue;

        const maxMs = p.growDuration * 1000;
        if (!p.ready) {
          p.progressMs = Math.min(maxMs, p.progressMs + dt * speedMult);
          if (p.progressMs >= maxMs) {
            p.ready = true;
            const stats = rollFruitStatsWithContext(crop, p, state.weather.id, activeIds);
            p.weight = stats.weight;
            p.mutations = stats.mutations;
          }
        }

        if (p.ready) {
          if (hasActiveDevice("collector_drone")) {
            const val = calcFruitPrice(crop, p.weight, p.mutations);
            state.coins += val;
            if (val > state.bestFruitValue) state.bestFruitValue = val;
            if (crop.multi) {
              p.ready = false;
              p.progressMs = 0;
              p.weight = 0;
              p.mutations = [];
              p.giantBoost = 1;
            } else {
              state.plots[i] = createEmptyPlot();
            }
          } else {
            readyCount++;
          }
        }
      }

      saveCounter++;
      if (saveCounter >= 4) {
        saveCounter = 0;
        saveState();
      }

      updateHUD(readyCount, now);
    }

    function updateHUD(readyCount, now) {
      document.getElementById("coinsDisplay").textContent = formatNumber(state.coins);
      document.getElementById("bestRecord").textContent = `Рекорд: ${formatNumber(state.bestFruitValue)}`;
      document.getElementById("plotCountLabel").textContent = `Грядки: ${state.unlockedPlots}/15`;
      document.getElementById("readyCountLabel").textContent = `Готово: ${readyCount}`;

      const selCrop = getCrop(state.selectedSeed);
      const selQty = state.seedInventory[state.selectedSeed] || 0;
      document.getElementById("seedSub").textContent = selCrop && selQty > 0 ? `${selCrop.name} (${selQty})` : "Выбрать ▾";

      const hudText = document.getElementById("hudSeedText");
      if (selCrop && selQty > 0) {
        hudText.textContent = `${selCrop.name}: ${selQty}`;
      } else {
        hudText.textContent = "Выбрать семена";
      }

      const totalGearOwned = Object.values(state.gearInventory).reduce((s, v) => s + (v || 0), 0);
      const selGearObj = getGear(state.selectedGear);
      const selGearQty = state.gearInventory[state.selectedGear] || 0;
      if (activeTool === "gear" && selGearObj && selGearQty > 0) {
        document.getElementById("gearSub").textContent = `${selGearObj.shortName} (${selGearQty})`;
      } else {
        document.getElementById("gearSub").textContent = totalGearOwned > 0 ? `Сумка: ${totalGearOwned} ▾` : "Пусто ▾";
      }

      const strip = document.getElementById("activeDevicesStrip");
      if (state.devices.length === 0) {
        if (strip.innerHTML !== "") strip.innerHTML = "";
      } else {
        strip.innerHTML = state.devices
          .map(d => {
            const g = getGear(d.id);
            if (!g) return "";
            return `<div class="device-chip"><span style="width:7px;height:7px;border-radius:50%;background:${g.color};display:inline-block;"></span>${g.shortName} • ${formatTimeLeft(d.endAt - now)}</div>`;
          })
          .join("");
      }

      const bagBadge = document.getElementById("bagBadge");
      bagBadge.textContent = state.harvestBag.length;
      bagBadge.classList.toggle("visible", state.harvestBag.length > 0);

      const gearBadge = document.getElementById("gearBadge");
      gearBadge.textContent = totalGearOwned;
      gearBadge.classList.toggle("visible", totalGearOwned > 0);
    }

    // --- PLOT INTERACTIONS ---
    function harvestPlot(idx) {
      const p = state.plots[idx];
      if (!p || !p.cropId || !p.ready) return false;
      const crop = getCrop(p.cropId);
      const value = calcFruitPrice(crop, p.weight, p.mutations);

      state.harvestBag.push({
        uid: Date.now() + Math.random(),
        cropId: crop.id,
        name: crop.name,
        weight: p.weight,
        mutations: p.mutations,
        value
      });

      if (value > state.bestFruitValue) state.bestFruitValue = value;

      const harvestedWeight = p.weight;
      const harvestedMuts = [...p.mutations];

      if (crop.multi) {
        p.ready = false;
        p.progressMs = 0;
        p.weight = 0;
        p.mutations = [];
        p.giantBoost = 1;
      } else {
        state.plots[idx] = createEmptyPlot();
      }

      haptic("success");
      const mutText = harvestedMuts.length ? ` [${harvestedMuts.map(m => m.name).join("+")}]` : "";
      showToast(`Собрано: ${crop.name} (${harvestedWeight} кг)${mutText}`);
      return true;
    }

    function handlePlotTap(idx) {
      if (idx < 0 || idx >= state.unlockedPlots) return;
      const p = state.plots[idx];

      // 1. Лопата
      if (activeTool === "shovel") {
        if (!p.cropId) {
          showToast("Эта грядка пустая");
          return;
        }
        const crop = getCrop(p.cropId);
        const refund = Math.floor(crop.cost * 0.25);
        haptic("warning");
        openModal(
          "Удалить растение?",
          `Выкопать <strong>${crop.name}</strong> с грядки №${idx + 1}?<br>Компенсация 25%: <strong>+${formatNumber(refund)} монет</strong>.`,
          [
            { label: "Отмена", className: "btn-secondary" },
            {
              label: `Удалить (+${formatNumber(refund)})`,
              className: "btn-danger",
              onClick: () => {
                state.coins += refund;
                state.plots[idx] = createEmptyPlot();
                saveState();
                haptic("medium");
                showToast(`Удалено (+${formatNumber(refund)} монет)`);
              }
            }
          ]
        );
        return;
      }

      // 2. Сбор созревшего урожая
      if (p.cropId && p.ready) {
        harvestPlot(idx);
        saveState();
        return;
      }

      // 3. Применение снаряжения на грядку
      if (activeTool === "gear") {
        const gItem = getGear(state.selectedGear);
        const gQty = state.gearInventory[state.selectedGear] || 0;
        if (!gItem || gQty <= 0 || gItem.mode !== "plot") {
          openGearPicker();
          return;
        }
        if (!p.cropId) {
          showToast("Сначала посади растение на грядку");
          return;
        }

        state.gearInventory[gItem.id]--;
        const maxMs = p.growDuration * 1000;

        if (gItem.id === "watering_can") {
          p.progressMs = Math.min(maxMs, p.progressMs + maxMs * 0.40);
          showToast("Полито (+40% роста)");
        } else if (gItem.id === "growth_fertilizer") {
          p.progressMs = Math.min(maxMs, p.progressMs + maxMs * 0.75);
          p.giantBoost = Number((p.giantBoost * 1.25).toFixed(2));
          showToast("Удобрено (+75% роста и +25% вес)");
        } else if (gItem.id === "giant_elixir") {
          p.giantBoost = Number((p.giantBoost * (2.5 + Math.random())).toFixed(2));
          showToast("Эликсир гиганта применён!");
        }

        if ((state.gearInventory[gItem.id] || 0) <= 0) {
          ensureValidSelectedGear(state);
          if ((state.gearInventory[state.selectedGear] || 0) <= 0) {
            activeTool = "plant";
            updateToolButtons();
          }
        }
        haptic("light");
        saveState();
        return;
      }

      // 4. Посадка на пустую грядку
      if (!p.cropId) {
        ensureValidSelectedSeed(state);
        const qty = state.seedInventory[state.selectedSeed] || 0;
        if (qty <= 0) {
          openSeedPicker();
          return;
        }
        const crop = getCrop(state.selectedSeed);
        state.seedInventory[crop.id]--;
        state.plots[idx] = {
          cropId: crop.id,
          progressMs: 0,
          growDuration: crop.growSec,
          ready: false,
          weight: 0,
          mutations: [],
          giantBoost: 1
        };
        ensureValidSelectedSeed(state);
        haptic("light");
        saveState();
        return;
      }

      // 5. Инспектор грядки
      const crop = getCrop(p.cropId);
      const pct = Math.min(99, Math.floor((p.progressMs / (p.growDuration * 1000)) * 100));
      openModal(
        crop.name,
        `Прогресс роста: <strong>${pct}%</strong><br>` +
        `Тип: <strong>${crop.multi ? "Многоразовая культура" : "Одноразовый урожай"}</strong><br>` +
        `Базовая цена: <strong>${formatNumber(crop.baseSell)} монет</strong><br>` +
        `Множитель веса: <strong>${p.giantBoost}x</strong>`,
        [{ label: "Закрыть", className: "btn-secondary" }]
      );
    }

    // --- RENDER SEED SHOP ---
    function renderShop() {
      const list = document.getElementById("shopList");
      list.innerHTML = "";

      const filtered = CROPS.filter(c => {
        if (shopFilter === "all") return true;
        if (shopFilter === "common") return c.rarity === "common" || c.rarity === "uncommon";
        if (shopFilter === "rare") return c.rarity === "rare";
        if (shopFilter === "epic") return c.rarity === "epic";
        if (shopFilter === "legendary") return c.rarity === "legendary" || c.rarity === "mythical";
        return true;
      });

      filtered.forEach(crop => {
        const stock = state.shop.stock[crop.id] || 0;
        const owned = state.seedInventory[crop.id] || 0;
        const canBuy = stock > 0 && state.coins >= crop.cost;

        const card = document.createElement("div");
        card.className = "item-card" + (stock <= 0 ? " out-of-stock" : "");
        card.innerHTML = `
          <div class="item-left">
            <div class="item-thumb"></div>
            <div class="item-info">
              <div class="item-title-row">
                <span class="item-name">${crop.name}</span>
                <span class="tag rarity-${crop.rarity}">${crop.rarityLabel}</span>
              </div>
              <div class="item-meta">
                ${crop.growSec}с • ${crop.multi ? "Многоразовое" : "Одноразовое"} • В сумке: <strong>${owned}</strong><br>
                В наличии: <strong>${stock > 0 ? stock + " шт." : "Нет в завозе"}</strong>
              </div>
            </div>
          </div>
          <button class="buy-btn" ${canBuy ? "" : "disabled"}>${ICONS.coin} ${formatNumber(crop.cost)}</button>
        `;

        card.querySelector(".item-thumb").appendChild(
          createMiniThumbCanvas((g, x, y, r) => drawCropIllustration(g, crop, x, y, r, 1))
        );

        card.querySelector(".buy-btn").onclick = () => {
          if (state.coins < crop.cost || (state.shop.stock[crop.id] || 0) <= 0) return;
          state.coins -= crop.cost;
          state.shop.stock[crop.id]--;
          state.seedInventory[crop.id] = (state.seedInventory[crop.id] || 0) + 1;
          state.selectedSeed = crop.id;
          activeTool = "plant";
          updateToolButtons();
          haptic("light");
          showToast(`Куплено: ${crop.name}`);
          saveState();
          renderShop();
        };

        card.querySelector(".item-left").onclick = () => {
          if ((state.seedInventory[crop.id] || 0) > 0) {
            state.selectedSeed = crop.id;
            activeTool = "plant";
            updateToolButtons();
            saveState();
            switchView("garden");
            showToast(`Выбрано: ${crop.name}`);
          }
        };

        list.appendChild(card);
      });
    }

    // --- RENDER GEAR SHOP ---
    function renderGear() {
      const list = document.getElementById("gearList");
      list.innerHTML = "";

      const filtered = GEAR_ITEMS.filter(g => {
        if (gearFilter === "all") return true;
        return g.category === gearFilter;
      });

      filtered.forEach(item => {
        const isExpansion = item.id === "expand_plot";
        const stock = isExpansion
          ? (state.unlockedPlots < 15 ? 1 : 0)
          : (state.gearShop.stock[item.id] || 0);
        const owned = state.gearInventory[item.id] || 0;

        let price = item.cost;
        if (isExpansion) {
          const boughtPlots = state.unlockedPlots - 9;
          price = Math.round(3500 * Math.pow(2.6, boughtPlots));
        }

        const canBuy = stock > 0 && state.coins >= price;

        const card = document.createElement("div");
        card.className = "item-card" + (stock <= 0 ? " out-of-stock" : "");
        card.innerHTML = `
          <div class="item-left">
            <div class="item-thumb"></div>
            <div class="item-info">
              <div class="item-title-row">
                <span class="item-name">${item.name}</span>
                <span class="tag rarity-${item.rarity}">${item.rarityLabel}</span>
              </div>
              <div class="item-meta">
                ${item.desc}<br>
                ${isExpansion
                  ? `Открыто грядок: <strong>${state.unlockedPlots} из 15</strong>`
                  : `В сумке: <strong>${owned}</strong> • В наличии: <strong>${stock > 0 ? stock + " шт." : "Нет в завозе"}</strong>`
                }
              </div>
            </div>
          </div>
          <button class="buy-btn" ${canBuy ? "" : "disabled"}>${isExpansion && state.unlockedPlots >= 15 ? "Макс." : ICONS.coin + " " + formatNumber(price)}</button>
        `;

        card.querySelector(".item-thumb").appendChild(
          createMiniThumbCanvas((g, x, y, r) => drawGearIllustration(g, item, x, y, r))
        );

        card.querySelector(".buy-btn").onclick = () => {
          if (!canBuy) return;
          if (isExpansion) {
            state.coins -= price;
            state.unlockedPlots++;
            haptic("success");
            showToast(`Открыта грядка №${state.unlockedPlots}`);
          } else {
            state.coins -= price;
            state.gearShop.stock[item.id]--;
            state.gearInventory[item.id] = (state.gearInventory[item.id] || 0) + 1;
            if (item.mode === "plot") {
              state.selectedGear = item.id;
            }
            haptic("light");
            showToast(`Куплено: ${item.name}`);
          }
          saveState();
          renderGear();
        };

        list.appendChild(card);
      });
    }

    // --- RENDER BACKPACK ---
    function renderBag() {
      const list = document.getElementById("bagList");
      const sellAllBtn = document.getElementById("btnSellAll");
      list.innerHTML = "";

      const sorted = [...state.harvestBag].sort((a, b) => b.value - a.value);
      const totalVal = sorted.reduce((s, item) => s + item.value, 0);

      sellAllBtn.disabled = sorted.length === 0;
      sellAllBtn.innerHTML = `${ICONS.coin} Продать всё (${formatNumber(totalVal)})`;

      if (sorted.length === 0) {
        list.innerHTML = `<div class="empty-state">Рюкзак пуст.<br>Нажми на созревшее растение в саду, чтобы собрать урожай.</div>`;
        return;
      }

      sorted.forEach(item => {
        const crop = getCrop(item.cropId);
        const mutHtml = item.mutations && item.mutations.length
          ? item.mutations.map(m => `<span class="tag" style="background:rgba(255,255,255,0.12);color:${m.color}">${m.name} x${m.mult}</span>`).join(" ")
          : `<span class="tag" style="background:rgba(255,255,255,0.08);color:#b4d6c0">Стандарт</span>`;

        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-left">
            <div class="item-thumb"></div>
            <div class="item-info">
              <div class="item-title-row">
                <span class="item-name">${item.name}</span>
                <span style="font-size:11px;color:#b8ffd2;font-weight:700;">${item.weight} кг</span>
              </div>
              <div class="item-meta" style="margin-top:4px;">${mutHtml}</div>
            </div>
          </div>
          <button class="buy-btn">+${formatNumber(item.value)}</button>
        `;

        if (crop) {
          card.querySelector(".item-thumb").appendChild(
            createMiniThumbCanvas((g, x, y, r) => drawCropIllustration(g, crop, x, y, r, 1))
          );
        }

        card.querySelector(".buy-btn").onclick = () => {
          state.coins += item.value;
          state.harvestBag = state.harvestBag.filter(x => x.uid !== item.uid);
          haptic("light");
          showToast(`Продано: +${formatNumber(item.value)} монет`);
          saveState();
          renderBag();
        };

        list.appendChild(card);
      });
    }

    // --- NAVIGATION & TOOLS ---
    function switchView(viewName) {
      currentView = viewName;
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === viewName));
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + viewName).classList.add("active");

      if (viewName === "garden") resizeCanvas();
      if (viewName === "shop") renderShop();
      if (viewName === "gear") renderGear();
      if (viewName === "bag") renderBag();
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.onclick = () => {
        haptic("light");
        switchView(btn.dataset.view);
      };
    });

    function updateToolButtons() {
      document.getElementById("toolPlant").classList.toggle("active", activeTool === "plant");
      document.getElementById("toolGear").classList.toggle("active", activeTool === "gear");
      document.getElementById("toolShovel").classList.toggle("active", activeTool === "shovel");
    }

    document.getElementById("toolPlant").onclick = () => {
      if (activeTool === "plant") {
        openSeedPicker();
      } else {
        activeTool = "plant";
        updateToolButtons();
      }
      haptic("light");
    };

    document.getElementById("toolGear").onclick = () => {
      haptic("light");
      openGearPicker();
    };

    document.getElementById("selectedSeedHud").onclick = () => {
      haptic("light");
      openSeedPicker();
    };

    document.getElementById("toolShovel").onclick = () => {
      activeTool = activeTool === "shovel" ? "plant" : "shovel";
      updateToolButtons();
      haptic("light");
    };

    document.getElementById("btnSellAll").onclick = () => {
      if (state.harvestBag.length === 0) return;
      const total = state.harvestBag.reduce((s, i) => s + i.value, 0);
      state.coins += total;
      state.harvestBag = [];
      haptic("success");
      showToast(`Продано на ${formatNumber(total)} монет`);
      saveState();
      renderBag();
    };

    document.querySelectorAll("#seedFilters .filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#seedFilters .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        shopFilter = btn.dataset.filter;
        renderShop();
      };
    });

    document.querySelectorAll("#gearFilters .filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#gearFilters .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        gearFilter = btn.dataset.gfilter;
        renderGear();
      };
    });

    // --- CARTOON GARDEN CANVAS RENDERER (NO EMOJIS) ---
    const canvasContainer = document.getElementById("canvasContainer");
    const canvas = document.getElementById("gardenCanvas");
    const ctx = canvas.getContext("2d");
    let logicalW = 360;
    let logicalH = 480;
    const plotRects = [];

    function resizeCanvas() {
      const rect = canvasContainer.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      logicalW = rect.width;
      logicalH = rect.height;
      canvas.width = Math.round(logicalW * dpr);
      canvas.height = Math.round(logicalH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    if (window.ResizeObserver) {
      new ResizeObserver(resizeCanvas).observe(canvasContainer);
    } else {
      window.addEventListener("resize", resizeCanvas);
    }

    const drops = Array.from({ length: 38 }, () => ({
      x: Math.random() * 500,
      y: Math.random() * 700,
      speed: 2 + Math.random() * 3.5,
      size: 1.5 + Math.random() * 2
    }));

    function drawLockVector(cx, cy) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
      ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -4, 5, Math.PI, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.roundRect(-7, -3, 14, 11, 3);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawGarden(ts) {
      if (currentView === "garden") {
        const wObj = WEATHERS.find(w => w.id === state.weather.id) || WEATHERS[0];

        // Яркая мультяшная лужайка
        const grad = ctx.createLinearGradient(0, 0, 0, logicalH);
        grad.addColorStop(0, wObj.grassTop);
        grad.addColorStop(1, wObj.grassBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, logicalW, logicalH);

        // Мультяшные кустики травы и маленькие цветочки на лужайке
        for (let i = 0; i < 24; i++) {
          const gx = ((i * 89) % Math.max(100, logicalW - 24)) + 12;
          const gy = ((i * 67) % Math.max(100, logicalH - 24)) + 12;
          ctx.strokeStyle = "rgba(134, 247, 176, 0.22)";
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(gx, gy);
          ctx.lineTo(gx - 3, gy - 6);
          ctx.moveTo(gx, gy);
          ctx.lineTo(gx + 3, gy - 5);
          ctx.stroke();

          if (i % 5 === 0) {
            ctx.fillStyle = i % 10 === 0 ? "#fde047" : "#ffffff";
            ctx.beginPath();
            ctx.arc(gx + 6, gy - 2, 2.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        const hasDevices = state.devices.length > 0;
        const topOffset = hasDevices ? 62 : 40;
        const cols = 3;
        const rows = 5;
        const padX = 11;
        const padBottom = 11;
        const gap = 9;
        const cellW = (logicalW - padX * 2 - gap * (cols - 1)) / cols;
        const cellH = (logicalH - topOffset - padBottom - gap * (rows - 1)) / rows;

        plotRects.length = 0;

        for (let i = 0; i < 15; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = padX + col * (cellW + gap);
          const y = topOffset + row * (cellH + gap);
          plotRects.push({ x, y, w: cellW, h: cellH });

          const unlocked = i < state.unlockedPlots;
          const p = state.plots[i];

          ctx.save();

          if (!unlocked) {
            ctx.beginPath();
            ctx.roundRect(x, y, cellW, cellH, 14);
            ctx.fillStyle = "rgba(15, 41, 25, 0.45)";
            ctx.fill();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.setLineDash([]);
            drawLockVector(x + cellW / 2, y + cellH / 2);
            ctx.restore();
            continue;
          }

          // Объемный 2.5D деревянный бортик грядки
          ctx.beginPath();
          ctx.roundRect(x, y + 4, cellW, cellH, 14);
          ctx.fillStyle = "#4d290e";
          ctx.fill();

          // Внешний деревянный короб
          ctx.beginPath();
          ctx.roundRect(x, y, cellW, cellH, 14);
          ctx.fillStyle = "#9c5c2b";
          ctx.fill();
          ctx.strokeStyle = activeTool === "shovel" && p.cropId
            ? "#ff7070"
            : activeTool === "gear" && p.cropId && !p.ready
              ? "#ffcb3d"
              : p.ready
                ? "#70f5a0"
                : "#593012";
          ctx.lineWidth = 2.4;
          ctx.stroke();

          // Внутренняя земляная грядка
          const inset = 5;
          ctx.beginPath();
          ctx.roundRect(x + inset, y + inset, cellW - inset * 2, cellH - inset * 2, 10);
          ctx.fillStyle = p.cropId ? "#5c381e" : "#4a2c16";
          ctx.fill();

          // Выпуклые грядковые борозды земли
          ctx.fillStyle = "rgba(33, 17, 6, 0.35)";
          const furrowCount = 3;
          for (let f = 0; f < furrowCount; f++) {
            const fy = y + inset + 8 + f * ((cellH - inset * 2 - 16) / (furrowCount - 1));
            ctx.beginPath();
            ctx.roundRect(x + 11, fy - 2, cellW - 22, 4, 2);
            ctx.fill();
          }

          // Растение на грядке
          if (p.cropId) {
            const crop = getCrop(p.cropId);
            const maxMs = p.growDuration * 1000;
            const progress = p.ready ? 1 : Math.min(0.99, p.progressMs / maxMs);

            // Свечение мутации или готовности
            if (p.ready) {
              const auraColor = p.mutations && p.mutations.length > 0
                ? p.mutations[p.mutations.length - 1].color
                : "#70f5a0";
              const pulse = 0.8 + Math.sin(ts / 220 + i) * 0.16;
              const radius = Math.min(cellW, cellH) * 0.34 * pulse;
              ctx.beginPath();
              ctx.arc(x + cellW / 2, y + cellH / 2 - 3, radius, 0, Math.PI * 2);
              ctx.fillStyle = auraColor + "40";
              ctx.fill();
            }

            const baseRadius = Math.min(cellW, cellH) * 0.34;
            let scale = 0.85 + progress * 0.2;
            if (p.ready && crop) {
              const ratio = Math.min(1.5, p.weight / crop.maxKg);
              scale = 1.05 + ratio * 0.48;
            }

            const bob = p.ready ? Math.sin(ts / 250 + i) * 2.5 : 0;
            drawCropIllustration(ctx, crop, x + cellW / 2, y + cellH / 2 - 4 + bob, baseRadius * scale, progress);

            if (!p.ready) {
              const barW = cellW - 20;
              ctx.fillStyle = "rgba(18, 10, 4, 0.65)";
              ctx.beginPath();
              ctx.roundRect(x + 10, y + cellH - 13, barW, 6, 3);
              ctx.fill();

              ctx.fillStyle = "#4ade80";
              ctx.beginPath();
              ctx.roundRect(x + 10, y + cellH - 13, Math.max(5, barW * progress), 6, 3);
              ctx.fill();
            } else {
              ctx.fillStyle = "rgba(17, 38, 25, 0.92)";
              ctx.beginPath();
              ctx.roundRect(x + 8, y + cellH - 20, cellW - 16, 14, 6);
              ctx.fill();
              ctx.strokeStyle = p.mutations.length ? "#ffcb3d" : "#70f5a0";
              ctx.lineWidth = 1;
              ctx.stroke();

              ctx.fillStyle = p.mutations.length ? "#ffcb3d" : "#f0fff5";
              ctx.font = "800 9.5px sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(`${p.weight} кг`, x + cellW / 2, y + cellH - 13);
            }
          }
          ctx.restore();
        }

        // Погодные эффекты
        if (state.weather.id === "rain" || state.weather.id === "storm") {
          ctx.strokeStyle = "rgba(186, 230, 253, 0.55)";
          ctx.lineWidth = 1.8;
          ctx.lineCap = "round";
          drops.forEach(d => {
            d.y += d.speed * 2.3;
            d.x -= 1.2;
            if (d.y > logicalH) { d.y = -10; d.x = Math.random() * logicalW; }
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 3, d.y + 10);
            ctx.stroke();
          });
        } else if (state.weather.id === "frost") {
          ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
          drops.forEach(d => {
            d.y += d.speed * 0.55;
            d.x += Math.sin(ts / 500 + d.y) * 0.45;
            if (d.y > logicalH) { d.y = -5; d.x = Math.random() * logicalW; }
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (state.weather.id === "meteor") {
          ctx.strokeStyle = "rgba(255, 224, 102, 0.82)";
          ctx.lineWidth = 2.2;
          ctx.lineCap = "round";
          drops.slice(0, 8).forEach(d => {
            d.y += d.speed * 2.8;
            d.x += d.speed * 1.6;
            if (d.y > logicalH || d.x > logicalW) { d.y = -10; d.x = Math.random() * (logicalW * 0.7); }
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 14, d.y - 20);
            ctx.stroke();
          });
        }
      }

      requestAnimationFrame(drawGarden);
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;

      for (let i = 0; i < plotRects.length; i++) {
        const r = plotRects[i];
        if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) {
          handlePlotTap(i);
          break;
        }
      }
    });

    // --- BOOT ---
    bindStaticIcons();
    initProfile();
    resizeCanvas();
    updateToolButtons();
    gameTick();
    setInterval(gameTick, 400);
    requestAnimationFrame(drawGarden);
  </script>
</body>
</html>
