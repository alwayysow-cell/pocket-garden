<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pocket Garden</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c1410;
      --bg-card: #15211b;
      --bg-card-2: #1d2d25;
      --border: rgba(167, 243, 208, 0.14);
      --text: #ecfdf5;
      --muted: #94a3b8;
      --accent: #34d399;
      --accent-dark: #059669;
      --gold: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
      gap: 8px;
    }

    /* COMPACT HEADER */
    .header {
      background: linear-gradient(145deg, #16241d, #101a15);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #047857);
      border: 2px solid rgba(52, 211, 153, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-record {
      font-size: 10px;
      color: var(--gold);
      margin-top: 1px;
    }

    .stats-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .weather-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      color: #cbd5e1;
    }

    .weather-bar {
      width: 24px;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      overflow: hidden;
    }

    .weather-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transition: width 0.4s linear;
    }

    .coins-badge {
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a;
      padding: 4px 9px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
    }

    /* MAIN VIEWPORT */
    .views {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .view.active {
      display: flex;
    }

    /* GARDEN FULLSCREEN VIEW */
    .garden-view {
      gap: 8px;
    }

    .canvas-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #13241b;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.35);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    .garden-overlay-top {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .hud-chip {
      background: rgba(12, 20, 16, 0.76);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .tool-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
    }

    .tool-btn:active {
      transform: scale(0.96);
    }

    .tool-btn.active {
      background: rgba(52, 211, 153, 0.18);
      border-color: var(--accent);
      color: #a7f3d0;
    }

    .tool-btn.danger.active {
      background: rgba(248, 113, 113, 0.18);
      border-color: var(--danger);
      color: #fecaca;
    }

    .tool-btn .icon {
      font-size: 16px;
      line-height: 1;
    }

    .tool-btn .sub {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      max-width: 74px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* SCROLLABLE SUB-PAGES (SHOP, GEAR, BAG) */
    .subpage {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
    }

    .timer-badge {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: #a7f3d0;
      font-weight: 700;
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    .filter-btn {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      background: rgba(52, 211, 153, 0.2);
      border-color: var(--accent);
      color: #ecfdf5;
    }

    .scroll-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .item-card {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-card.out-of-stock {
      opacity: 0.5;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .item-emoji {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .item-info {
      min-width: 0;
    }

    .item-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .item-name {
      font-size: 13px;
      font-weight: 800;
    }

    .tag {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .rarity-common { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
    .rarity-uncommon { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
    .rarity-rare { background: rgba(168, 85, 247, 0.22); color: #d8b4fe; }
    .rarity-epic { background: rgba(244, 114, 182, 0.22); color: #f9a8d4; }
    .rarity-legendary { background: rgba(251, 191, 36, 0.22); color: #fde68a; }
    .rarity-mythical { background: rgba(248, 113, 113, 0.25); color: #fca5a5; }

    .item-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.35;
    }

    .buy-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .buy-btn:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .sell-all-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .sell-all-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 36px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* BOTTOM NAVIGATION BAR */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 5px;
      flex-shrink: 0;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 7px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: 0.15s;
    }

    .nav-btn .nav-icon {
      font-size: 17px;
      line-height: 1;
    }

    .nav-btn.active {
      background: var(--accent-dark);
      color: #fff;
      box-shadow: 0 2px 10px rgba(5, 150, 105, 0.35);
    }

    .badge-dot {
      position: absolute;
      top: 4px;
      right: 14px;
      background: #f59e0b;
      color: #0f1713;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 999px;
      display: none;
    }

    .badge-dot.visible {
      display: inline-block;
    }

    /* MODAL & TOAST */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.74);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #18261f;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }

    .modal-body {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: #27372f;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-danger {
      background: #dc2626;
      border: none;
      color: #fff;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      background: #102a1e;
      border: 1px solid var(--accent);
      color: #ecfdf5;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 200;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="app">
    <!-- COMPACT HEADER -->
    <header class="header">
      <div class="profile">
        <div id="avatarBox" class="avatar">🌱</div>
        <div class="profile-info">
          <div id="playerName" class="profile-name">Садовод</div>
          <div id="bestRecord" class="profile-record">🏆 Рекорд: 0 🪙</div>
        </div>
      </div>

      <div class="stats-right">
        <div class="weather-pill">
          <span id="weatherIcon">☀️</span>
          <span id="weatherName">Ясно</span>
          <div class="weather-bar">
            <div id="weatherProgress" class="weather-bar-fill"></div>
          </div>
        </div>
        <div id="coinsDisplay" class="coins-badge">50 🪙</div>
      </div>
    </header>

    <!-- MAIN VIEWS -->
    <main class="views">
      <!-- 1. GARDEN VIEW (FULLSCREEN) -->
      <section id="view-garden" class="view garden-view active">
        <div id="canvasContainer" class="canvas-container">
          <div class="garden-overlay-top">
            <span id="plotCountLabel" class="hud-chip">🏡 9 / 15</span>
            <span id="selectedSeedHud" class="hud-chip">🌱 Морковь (4)</span>
            <span id="readyCountLabel" class="hud-chip">🧺 0</span>
          </div>
          <canvas id="gardenCanvas"></canvas>
        </div>

        <div class="toolbar">
          <button id="btnHarvestAll" class="tool-btn">
            <span class="icon">🧺</span>
            <span>Собрать</span>
            <span id="harvestSub" class="sub">0 шт.</span>
          </button>

          <button id="toolWater" class="tool-btn">
            <span class="icon">🚿</span>
            <span>Лейка</span>
            <span id="waterSub" class="sub">5/5</span>
          </button>

          <button id="toolPlant" class="tool-btn active">
            <span class="icon">🌱</span>
            <span>Посадка</span>
            <span id="seedSub" class="sub">Морковь</span>
          </button>

          <button id="toolShovel" class="tool-btn danger">
            <span class="icon">🪏</span>
            <span>Лопата</span>
            <span class="sub">Убрать</span>
          </button>
        </div>
      </section>

      <!-- 2. SHOP VIEW -->
      <section id="view-shop" class="view subpage">
        <div class="panel-header">
          <div class="panel-title">🏪 Лавка семян</div>
          <div class="timer-badge">⏳ Завоз: <span id="shopTimer">05:00</span></div>
        </div>

        <div class="filters">
          <button class="filter-btn active" data-filter="all">Все (15)</button>
          <button class="filter-btn" data-filter="common">Обычные</button>
          <button class="filter-btn" data-filter="rare">Редкие</button>
          <button class="filter-btn" data-filter="epic">Эпик+</button>
        </div>

        <div id="shopList" class="scroll-list"></div>
      </section>

      <!-- 3. GEAR VIEW -->
      <section id="view-gear" class="view subpage">
        <div class="panel-header">
          <div class="panel-title">⚙️ Снаряжение и участок</div>
          <div id="activeDevicesBadge" class="timer-badge">Активно: 0</div>
        </div>
        <div id="gearList" class="scroll-list"></div>
      </section>

      <!-- 4. BACKPACK VIEW -->
      <section id="view-bag" class="view subpage">
        <div class="panel-header">
          <div class="panel-title">🎒 Рюкзак урожая</div>
          <button id="btnSellAll" class="sell-all-btn" disabled>Продать всё (0 🪙)</button>
        </div>
        <div id="bagList" class="scroll-list"></div>
      </section>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="garden">
        <span class="nav-icon">🏡</span>
        <span>Сад</span>
      </button>
      <button class="nav-btn" data-view="shop">
        <span class="nav-icon">🏪</span>
        <span>Лавка</span>
      </button>
      <button class="nav-btn" data-view="gear">
        <span class="nav-icon">⚙️</span>
        <span>Снаряж.</span>
      </button>
      <button class="nav-btn" data-view="bag">
        <span class="nav-icon">🎒</span>
        <span>Рюкзак</span>
        <span id="bagBadge" class="badge-dot">0</span>
      </button>
    </nav>
  </div>

  <!-- MODAL -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div id="modalTitle" class="modal-title">Инфо</div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <script>
    // --- TELEGRAM INIT ---
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = "light") {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === "success" || type === "warning" || type === "error") {
            tg.HapticFeedback.notificationOccurred(type);
          } else {
            tg.HapticFeedback.impactOccurred(type);
          }
        }
      } catch (e) {}
    }

    // --- DATA ---
    const CROPS = [
      { id: "carrot", name: "Морковь", emoji: "🥕", rarity: "common", rarityLabel: "Обычная", cost: 10, baseSell: 18, growSec: 8, multi: false, minKg: 0.4, maxKg: 2.5, stockChance: 1.0, maxStock: 8 },
      { id: "radish", name: "Редис", emoji: "🌰", rarity: "common", rarityLabel: "Обычный", cost: 18, baseSell: 32, growSec: 12, multi: false, minKg: 0.3, maxKg: 2.0, stockChance: 1.0, maxStock: 7 },
      { id: "strawberry", name: "Клубника", emoji: "🍓", rarity: "common", rarityLabel: "Обычная", cost: 35, baseSell: 26, growSec: 15, multi: true, minKg: 0.2, maxKg: 1.8, stockChance: 0.95, maxStock: 5 },
      { id: "corn", name: "Кукуруза", emoji: "🌽", rarity: "uncommon", rarityLabel: "Необычная", cost: 65, baseSell: 115, growSec: 22, multi: false, minKg: 1.0, maxKg: 5.5, stockChance: 0.85, maxStock: 5 },
      { id: "tomato", name: "Томатный куст", emoji: "🍅", rarity: "uncommon", rarityLabel: "Необычный", cost: 110, baseSell: 75, growSec: 25, multi: true, minKg: 0.8, maxKg: 4.5, stockChance: 0.8, maxStock: 4 },
      { id: "blueberry", name: "Черника", emoji: "🫐", rarity: "uncommon", rarityLabel: "Необычная", cost: 180, baseSell: 125, growSec: 30, multi: true, minKg: 0.5, maxKg: 3.5, stockChance: 0.72, maxStock: 4 },
      { id: "pumpkin", name: "Тыква-гигант", emoji: "🎃", rarity: "rare", rarityLabel: "Редкая", cost: 320, baseSell: 580, growSec: 42, multi: false, minKg: 5.0, maxKg: 35.0, stockChance: 0.6, maxStock: 3 },
      { id: "watermelon", name: "Сахарный арбуз", emoji: "🍉", rarity: "rare", rarityLabel: "Редкий", cost: 520, baseSell: 940, growSec: 50, multi: false, minKg: 6.0, maxKg: 42.0, stockChance: 0.52, maxStock: 3 },
      { id: "peach", name: "Персиковое дерево", emoji: "🍑", rarity: "rare", rarityLabel: "Редкое", cost: 850, baseSell: 540, growSec: 55, multi: true, minKg: 1.5, maxKg: 9.0, stockChance: 0.45, maxStock: 2 },
      { id: "pineapple", name: "Королевский ананас", emoji: "🍍", rarity: "epic", rarityLabel: "Эпический", cost: 1500, baseSell: 2700, growSec: 70, multi: false, minKg: 3.0, maxKg: 18.0, stockChance: 0.35, maxStock: 2 },
      { id: "mango", name: "Манговое дерево", emoji: "🥭", rarity: "epic", rarityLabel: "Эпическое", cost: 2600, baseSell: 1650, growSec: 80, multi: true, minKg: 2.0, maxKg: 14.0, stockChance: 0.28, maxStock: 2 },
      { id: "glowshroom", name: "Светящийся гриб", emoji: "🍄", rarity: "epic", rarityLabel: "Эпический", cost: 4200, baseSell: 7600, growSec: 95, multi: false, minKg: 1.2, maxKg: 11.0, stockChance: 0.22, maxStock: 2 },

      { id: "goldapple", name: "Золотая яблоня", emoji: "🍏", rarity: "legendary", rarityLabel: "Легендарная", cost: 14000, baseSell: 9200, growSec: 130, multi: true, minKg: 3.5, maxKg: 24.0, stockChance: 0.11, maxStock: 1 },

    ];

    const WEATHERS = [
      { id: "clear", name: "Ясно", icon: "☀️", weight: 42, skyTop: "#1a382b", skyBot: "#11241b" },
      { id: "rain", name: "Дождь", icon: "🌧️", weight: 24, skyTop: "#162a38", skyBot: "#0f1e28" },

      { id: "meteor", name: "Звездопад", icon: "🌠", weight: 7, skyTop: "#1d1538", skyBot: "#0e0b20" }

    const GEAR_ITEMS = [
      { id: "sprinkler_basic", type: "device", name: "Базовый спринклер", emoji: "💦", cost: 250, durationSec: 180, desc: "Ускоряет рост на 35% и повышает вес плодов на 3 мин." },

    ];

    const SHOP_REFRESH_MS = 5 * 60 * 1000;
    const SAVE_KEY = "pocket_garden_save_v5";

    // --- STATE & SAFE PERSISTENCE (NO RELOAD GLITCHES / NO OFFLINE GROWTH) ---
    function createEmptyPlot() {
      return {
        cropId: null,
        progressMs: 0,
        growDuration: 0,
        ready: false,
        weight: 0,
        mutations: [],
        giantBoost: 1
      };
    }

    function createDefaultState() {
      return {
        version: 5,
        coins: 50,
        bestFruitValue: 0,
        unlockedPlots: 9,
        plots: Array.from({ length: 15 }, () => createEmptyPlot()),
        seedInventory: { carrot: 4 },
        selectedSeed: "carrot",
        harvestBag: [],
        waterCharges: 5,
        lastWaterTick: Date.now(),
        turboCan: false,
        devices: [],
        weather: { id: "clear", remainingMs: 45000, durationMs: 45000 },
        shop: { nextRefreshAt: Date.now() + SHOP_REFRESH_MS, stock: {} }
      };
    }

    function loadState() {
      const def = createDefaultState();
      try {
        const raw =
          localStorage.getItem(SAVE_KEY) ||
          localStorage.getItem("pocket_garden_save_data") ||
          localStorage.getItem("pocket_garden_v2") ||
          localStorage.getItem("pocket_garden_v1");

        if (!raw) {
          def.shop.stock = generateShopStock();
          return def;
        }

        const parsed = JSON.parse(raw);
        const state = {
          ...def,
          ...parsed,
          seedInventory: { ...def.seedInventory, ...(parsed.seedInventory || {}) },
          weather: { ...def.weather, ...(parsed.weather || {}) },
          shop: { ...def.shop, ...(parsed.shop || {}) }
        };

        // Нормализация всех 15 грядок: сохраняем точный progressMs без скачков и багов при обновлении
        state.plots = Array.from({ length: 15 }, (_, i) => {
          const old = parsed.plots && parsed.plots[i] ? parsed.plots[i] : null;
          if (!old || !old.cropId) return createEmptyPlot();

          const crop = getCrop(old.cropId);
          if (!crop) return createEmptyPlot();

          const durSec = Number(old.growDuration) || crop.growSec;
          const maxMs = durSec * 1000;
          let progMs = Number(old.progressMs);

          // Миграция со старой версии, если там был plantedAt
          if (isNaN(progMs)) {
            progMs = old.ready ? maxMs : 0;
          }

          progMs = Math.max(0, Math.min(maxMs, progMs));
          const isReady = Boolean(old.ready) || progMs >= maxMs;

          return {
            cropId: crop.id,
            progressMs: isReady ? maxMs : progMs,
            growDuration: durSec,
            ready: isReady,
            weight: Number(old.weight) || 0,
            mutations: Array.isArray(old.mutations) ? old.mutations : [],
            giantBoost: Number(old.giantBoost) || 1
          };
        });

        if (!Array.isArray(state.harvestBag)) state.harvestBag = [];
        if (!Array.isArray(state.devices)) state.devices = [];

        const now = Date.now();
        state.lastWaterTick = now;
        if (typeof state.weather.remainingMs !== "number" || state.weather.remainingMs <= 0) {
          state.weather.remainingMs = 45000;
          state.weather.durationMs = 45000;
        }

        if (!state.shop.stock || Object.keys(state.shop.stock).length === 0 || now >= state.shop.nextRefreshAt) {
          state.shop.stock = generateShopStock();
          state.shop.nextRefreshAt = now + SHOP_REFRESH_MS;
        }

        return state;
      } catch (e) {
        def.shop.stock = generateShopStock();
        return def;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function generateShopStock() {
      const stock = {};
      CROPS.forEach(c => {
        stock[c.id] = Math.random() <= c.stockChance ? Math.floor(Math.random() * c.maxStock) + 1 : 0;
      });
      if (!stock.carrot || stock.carrot < 3) stock.carrot = 5;
      return stock;
    }

    let state = loadState();
    let activeTool = "plant";
    let shopFilter = "all";
    let currentView = "garden";
    let lastTickAt = Date.now();

    // Сохранение перед перезагрузкой / сворачиванием мини-приложения
    window.addEventListener("beforeunload", saveState);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        saveState();
      } else {
        lastTickAt = Date.now(); // Сбрасываем дельту, чтобы при возврате не было скачка роста
      }
    });

    // --- PROFILE ---
    function initProfile() {
      const nameEl = document.getElementById("playerName");
      const avatarEl = document.getElementById("avatarBox");
      const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

      if (user) {
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ") || user.username || "Садовод";
        nameEl.textContent = fullName;
        const initials = (user.first_name ? user.first_name[0] : "С").toUpperCase();
        avatarEl.textContent = initials;

        if (user.photo_url) {
          const img = document.createElement("img");
          img.src = user.photo_url;
          img.alt = fullName;
          img.onload = () => {
            avatarEl.innerHTML = "";
            avatarEl.appendChild(img);
          };
          img.onerror = () => {
            avatarEl.textContent = initials;
          };

      }

    // --- TOAST & MODAL ---
    let toastTimer = null;
    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1900);
    }

    function openModal(title, htmlBody, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = htmlBody;
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      buttons.forEach(btn => {
        const b = document.createElement("button");
        b.className = btn.className || "btn-secondary";
        b.textContent = btn.label;
        b.onclick = () => {
          closeModal();
          if (btn.onClick) btn.onClick();
        };
        actions.appendChild(b);
      });
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    // --- HELPERS ---
    function getCrop(id) {
      return CROPS.find(c => c.id === id);
    }

    function hasActiveDevice(id) {
      const now = Date.now();
      return state.devices.some(d => d.id === id && d.endAt > now);
    }

    function getSpeedMultiplier() {
      let mult = 1;
      if (hasActiveDevice("sprinkler_basic")) mult += 0.35;
      if (hasActiveDevice("sprinkler_gold")) mult += 0.70;
      if (state.weather.id === "rain") mult += 0.25;
      return mult;
    }

    function rollFruitStats(crop, plot) {
      const sizeBoost = (hasActiveDevice("sprinkler_gold") ? 1.45 : hasActiveDevice("sprinkler_basic") ? 1.2 : 1) * (plot.giantBoost || 1);
      const isGiantRoll = Math.random() < 0.14;
      const rawRatio = Math.pow(Math.random(), isGiantRoll ? 0.55 : 1.6);
      const weight = Number(((crop.minKg + (crop.maxKg - crop.minKg) * rawRatio) * sizeBoost).toFixed(2));

      const mutations = [];
      const goldMult = hasActiveDevice("sprinkler_gold") ? 3 : 1;
      const prismMult = hasActiveDevice("star_prism") ? 3 : 1;
      const rodMult = hasActiveDevice("lightning_rod") ? 3 : 1;

      if (Math.random() < 0.015 * prismMult) {
        mutations.push({ id: "rainbow", name: "Rainbow", mult: 20, color: "#f472b6" });
      } else if (Math.random() < 0.045 * goldMult) {
        mutations.push({ id: "gold", name: "Gold", mult: 5, color: "#fbbf24" });
      }

      if (state.weather.id === "rain" && Math.random() < 0.55) {
        mutations.push({ id: "wet", name: "Wet", mult: 2, color: "#38bdf8" });
      }
      if (state.weather.id === "frost" && Math.random() < 0.45) {
        mutations.push({ id: "frozen", name: "Frozen", mult: 10, color: "#7dd3fc" });
      }
      if (state.weather.id === "storm" && Math.random() < 0.22 * rodMult) {
        mutations.push({ id: "shocked", name: "Shocked", mult: 50, color: "#c084fc" });
      }
      if (state.weather.id === "meteor" && Math.random() < 0.18 * prismMult) {
        mutations.push({ id: "starlit", name: "Starlit", mult: 100, color: "#fde047" });
      }

      return { weight, mutations };
    }

    function calcFruitPrice(crop, weight, mutations) {
      const avgKg = (crop.minKg + crop.maxKg) / 2;
      const weightFactor = Math.max(0.7, weight / avgKg);
      const mutMult = mutations.reduce((acc, m) => acc * m.mult, 1);
      return Math.max(1, Math.round(crop.baseSell * weightFactor * mutMult));
    }

    function formatNumber(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e4) return (n / 1e3).toFixed(1) + "K";
      return Math.floor(n).toLocaleString("ru-RU");
    }

    // --- WEATHER ---
    function pickRandomWeather(currentId) {
      const pool = WEATHERS.filter(w => w.id !== currentId);
      const total = pool.reduce((s, w) => s + w.weight, 0);
      let r = Math.random() * total;
      for (const w of pool) {
        if (r < w.weight) return w;
        r -= w.weight;
      }
      return pool[0];
    }

    function updateWeather(dt) {
      state.weather.remainingMs -= dt;
      if (state.weather.remainingMs <= 0) {
        const next = pickRandomWeather(state.weather.id);
        const nextDur = (35 + Math.floor(Math.random() * 31)) * 1000;
        state.weather = { id: next.id, remainingMs: nextDur, durationMs: nextDur };
        showToast(`${next.icon} Погода: ${next.name}`);
      }
      const wObj = WEATHERS.find(w => w.id === state.weather.id) || WEATHERS[0];
      document.getElementById("weatherIcon").textContent = wObj.icon;
      document.getElementById("weatherName").textContent = wObj.name;
      const leftPct = Math.max(0, Math.min(100, (state.weather.remainingMs / state.weather.durationMs) * 100));
      document.getElementById("weatherProgress").style.width = leftPct + "%";
    }

    // --- GAME TICK (INCREMENTAL PROGRESS, SAFE ON REFRESH) ---
    let saveCounter = 0;
    function gameTick() {
      const now = Date.now();
      // Ограничиваем шаг dt до 1000мс, чтобы при обновлении или сворачивании не было скачков
      const dt = Math.max(0, Math.min(1000, now - lastTickAt));
      lastTickAt = now;

      updateWeather(dt);

      // Восстановление лейки
      const maxWater = state.turboCan ? 10 : 5;
      const regenMs = state.turboCan ? 7500 : 15000;
      if (state.waterCharges < maxWater) {
        if (now - state.lastWaterTick >= regenMs) {
          state.waterCharges++;
          state.lastWaterTick = now;
        }
      } else {
        state.lastWaterTick = now;
      }

      // Автообновление лавки раз в 5 минут
      if (now >= state.shop.nextRefreshAt) {
        state.shop.stock = generateShopStock();
        state.shop.nextRefreshAt = now + SHOP_REFRESH_MS;
        showToast("🚚 В лавку завезли свежие семена!");
        if (currentView === "shop") renderShop();
      }
      const remSec = Math.max(0, Math.ceil((state.shop.nextRefreshAt - now) / 1000));
      const mm = String(Math.floor(remSec / 60)).padStart(2, "0");
      const ss = String(remSec % 60).padStart(2, "0");
      document.getElementById("shopTimer").textContent = `${mm}:${ss}`;

      // Устройства
      const beforeDev = state.devices.length;
      state.devices = state.devices.filter(d => d.endAt > now);
      if (state.devices.length !== beforeDev && currentView === "gear") {
        renderGear();
      }

      // Накопительный рост растений
      const speedMult = getSpeedMultiplier();
      let readyCount = 0;

      for (let i = 0; i < state.unlockedPlots; i++) {
        const p = state.plots[i];
        if (!p || !p.cropId) continue;
        const crop = getCrop(p.cropId);
        if (!crop) continue;

        const maxMs = p.growDuration * 1000;
        if (!p.ready) {
          p.progressMs = Math.min(maxMs, p.progressMs + dt * speedMult);
          if (p.progressMs >= maxMs) {
            p.ready = true;
            const stats = rollFruitStats(crop, p);
            p.weight = stats.weight;
            p.mutations = stats.mutations;
          }
        }

        if (p.ready) {
          if (hasActiveDevice("collector_bee")) {
            const val = calcFruitPrice(crop, p.weight, p.mutations);
            state.coins += val;
            if (val > state.bestFruitValue) state.bestFruitValue = val;
            if (crop.multi) {
              p.ready = false;
              p.progressMs = 0;
              p.weight = 0;
              p.mutations = [];
              p.giantBoost = 1;
            } else {
              state.plots[i] = createEmptyPlot();
            }
          } else {
            readyCount++;
          }
        }
      }

      saveCounter++;
      if (saveCounter >= 4) {
        saveCounter = 0;
        saveState();
      }

      updateHUD(readyCount);
    }

    function updateHUD(readyCount) {
      document.getElementById("coinsDisplay").textContent = `${formatNumber(state.coins)} 🪙`;
      document.getElementById("bestRecord").textContent = `🏆 Рекорд: ${formatNumber(state.bestFruitValue)} 🪙`;
      document.getElementById("plotCountLabel").textContent = `🏡 ${state.unlockedPlots} / 15`;
      document.getElementById("readyCountLabel").textContent = `🧺 ${readyCount}`;
      document.getElementById("harvestSub").textContent = `${readyCount} шт.`;

      const maxWater = state.turboCan ? 10 : 5;
      document.getElementById("waterSub").textContent = `${state.waterCharges}/${maxWater}`;

      const selCrop = getCrop(state.selectedSeed);
      const selQty = state.seedInventory[state.selectedSeed] || 0;
      document.getElementById("seedSub").textContent = selCrop ? `${selCrop.name} (${selQty})` : "Нет";
      document.getElementById("selectedSeedHud").textContent = selCrop ? `${selCrop.emoji} ${selCrop.name}: ${selQty}` : "Нет семян";

      const bagBadge = document.getElementById("bagBadge");
      bagBadge.textContent = state.harvestBag.length;
      bagBadge.classList.toggle("visible", state.harvestBag.length > 0);
      document.getElementById("activeDevicesBadge").textContent = `Активно: ${state.devices.length}`;
    }

    // --- PLOT ACTIONS ---
    function harvestPlot(idx, silent = false) {
      const p = state.plots[idx];
      if (!p || !p.cropId || !p.ready) return false;
      const crop = getCrop(p.cropId);
      const value = calcFruitPrice(crop, p.weight, p.mutations);

      state.harvestBag.push({
        uid: Date.now() + Math.random(),
        cropId: crop.id,
        name: crop.name,
        emoji: crop.emoji,
        weight: p.weight,
        mutations: p.mutations,
        value
      });

      if (value > state.bestFruitValue) state.bestFruitValue = value;

      const harvestedWeight = p.weight;
      const harvestedMuts = [...p.mutations];

      if (crop.multi) {
        p.ready = false;
        p.progressMs = 0;
        p.weight = 0;
        p.mutations = [];
        p.giantBoost = 1;
      } else {
        state.plots[idx] = createEmptyPlot();
      }

      if (!silent) {
        haptic("success");
        const mutText = harvestedMuts.length ? ` [${harvestedMuts.map(m => m.name).join("+")}]` : "";
        showToast(`🧺 ${crop.emoji} ${crop.name} (${harvestedWeight} кг)${mutText}`);
      }
      return true;
    }

    function handlePlotTap(idx) {
      if (idx < 0 || idx >= state.unlockedPlots) return;
      const p = state.plots[idx];

      // 1. Лопата
      if (activeTool === "shovel") {
        if (!p.cropId) {
          showToast("Эта грядка пустая");
          return;
        }
        const crop = getCrop(p.cropId);
        const refund = Math.floor(crop.cost * 0.3);
        haptic("warning");
        openModal(
          "🪏 Выкопать растение?",
          `Удалить <strong>${crop.emoji} ${crop.name}</strong> с грядки №${idx + 1}?<br>Возврат 30%: <strong>+${refund} 🪙</strong>.`,
          [
            { label: "Отмена", className: "btn-secondary" },
            {
              label: `Удалить (+${refund} 🪙)`,
              className: "btn-danger",
              onClick: () => {
                state.coins += refund;
                state.plots[idx] = createEmptyPlot();
                saveState();
                haptic("medium");
                showToast(`🪏 Удалено (+${refund} 🪙)`);
              }
            }
          ]
        );
        return;
      }

      // 2. Сбор урожая по тапу
      if (p.cropId && p.ready) {
        harvestPlot(idx);
        saveState();
        return;
      }

      // 3. Полив
      if (activeTool === "water") {
        if (!p.cropId) {
          showToast("Сначала посади семечко");
          return;
        }
        if (state.waterCharges <= 0) {
          showToast("🚿 Лейка пуста! Подожди заряда");
          return;
        }
        state.waterCharges--;
        p.progressMs = Math.min(p.growDuration * 1000, p.progressMs + (p.growDuration * 1000) * 0.35);
        haptic("light");
        showToast("💦 Грядка полита (+35% роста)");
        saveState();
        return;
      }

      // 4. Посадка на пустую грядку
      if (!p.cropId) {
        const qty = state.seedInventory[state.selectedSeed] || 0;
        if (qty <= 0) {
          const fallback = Object.keys(state.seedInventory).find(k => state.seedInventory[k] > 0);
          if (!fallback) {
            showToast("🌱 Семена закончились! Купи в лавке");
            switchView("shop");
            return;
          }
          state.selectedSeed = fallback;
        }
        const crop = getCrop(state.selectedSeed);
        state.seedInventory[crop.id]--;
        state.plots[idx] = {
          cropId: crop.id,
          progressMs: 0,
          growDuration: crop.growSec,
          ready: false,
          weight: 0,
          mutations: [],
          giantBoost: 1
        };
        haptic("light");
        saveState();
        return;
      }

      // 5. Инспектор грядки
      const crop = getCrop(p.cropId);
      const pct = Math.min(99, Math.floor((p.progressMs / (p.growDuration * 1000)) * 100));
      openModal(
        `${crop.emoji} ${crop.name}`,
        `Прогресс роста: <strong>${pct}%</strong><br>` +
        `Тип: <strong>${crop.multi ? "Многоразовое растение" : "Одноразовый урожай"}</strong><br>` +
        `Базовая цена: <strong>${formatNumber(crop.baseSell)} 🪙</strong><br>` +
        `Бонус гиганта: <strong>${p.giantBoost}x</strong>`,
        [{ label: "Закрыть", className: "btn-secondary" }]
      );
    }

    // --- RENDER SUBPAGES ---
    function renderShop() {
      const list = document.getElementById("shopList");
      list.innerHTML = "";

      const filtered = CROPS.filter(c => {
        if (shopFilter === "all") return true;
        if (shopFilter === "common") return c.rarity === "common" || c.rarity === "uncommon";
        if (shopFilter === "rare") return c.rarity === "rare";
        if (shopFilter === "epic") return c.rarity === "epic" || c.rarity === "legendary" || c.rarity === "mythical";
        return true;
      });

      filtered.forEach(crop => {
        const stock = state.shop.stock[crop.id] || 0;
        const owned = state.seedInventory[crop.id] || 0;
        const canBuy = stock > 0 && state.coins >= crop.cost;

        const card = document.createElement("div");
        card.className = "item-card" + (stock <= 0 ? " out-of-stock" : "");
        card.innerHTML = `
          <div class="item-left">
            <div class="item-emoji">${crop.emoji}</div>
            <div class="item-info">
              <div class="item-title-row">
                <span class="item-name">${crop.name}</span>
                <span class="tag rarity-${crop.rarity}">${crop.rarityLabel}</span>
              </div>
              <div class="item-meta">
                ⏱ ${crop.growSec}с • ${crop.multi ? "♻️ Многоразовое" : "1️⃣ Одноразовое"} • В сумке: <strong>${owned}</strong><br>
                В лавке: <strong>${stock > 0 ? stock + " шт." : "Раскуплено"}</strong>
              </div>
            </div>
          </div>
          <button class="buy-btn" ${canBuy ? "" : "disabled"}>${formatNumber(crop.cost)} 🪙</button>
        `;

        card.querySelector(".buy-btn").onclick = () => {
          if (state.coins < crop.cost || (state.shop.stock[crop.id] || 0) <= 0) return;
          state.coins -= crop.cost;
          state.shop.stock[crop.id]--;
          state.seedInventory[crop.id] = (state.seedInventory[crop.id] || 0) + 1;
          state.selectedSeed = crop.id;
          activeTool = "plant";
          updateToolButtons();
          haptic("light");
          showToast(`🌱 Куплено: ${crop.emoji} ${crop.name}`);
          saveState();
          renderShop();
        };

        card.querySelector(".item-left").onclick = () => {
          if ((state.seedInventory[crop.id] || 0) > 0) {
            state.selectedSeed = crop.id;
            activeTool = "plant";
            updateToolButtons();
            saveState();
            switchView("garden");
            showToast(`Выбрано: ${crop.emoji} ${crop.name}`);
          }
        };

        list.appendChild(card);
      });
    }

    function renderGear() {
      const list = document.getElementById("gearList");
      list.innerHTML = "";
      const now = Date.now();

      GEAR_ITEMS.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";

        let price = item.cost;
        let btnLabel = `${formatNumber(price)} 🪙`;
        let disabled = state.coins < price;
        let statusNote = "";

        if (item.type === "device") {
          const active = state.devices.find(d => d.id === item.id && d.endAt > now);
          if (active) {
            const left = Math.ceil((active.endAt - now) / 1000);
            statusNote = `<br><span style="color:#34d399;font-weight:700;">● Работает ещё ${left}с</span>`;
          }
        } else if (item.type === "upgrade") {
          if (state.turboCan) {
            btnLabel = "Куплено";
            disabled = true;
          }
        } else if (item.type === "expansion") {
          if (state.unlockedPlots >= 15) {
            btnLabel = "Макс. (15)";
            disabled = true;
          } else {
            const boughtPlots = state.unlockedPlots - 9;
            price = Math.round(300 * Math.pow(2.15, boughtPlots));
            btnLabel = `${formatNumber(price)} 🪙`;
            disabled = state.coins < price;
            statusNote = `<br>Открыто грядок: <strong>${state.unlockedPlots} из 15</strong>`;
          }
        }

        card.innerHTML = `
          <div class="item-left">
            <div class="item-emoji">${item.emoji}</div>
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-meta">${item.desc}${statusNote}</div>
            </div>
          </div>
          <button class="buy-btn" ${disabled ? "disabled" : ""}>${btnLabel}</button>
        `;

        card.querySelector(".buy-btn").onclick = () => {
          if (item.type === "expansion") {
            const boughtPlots = state.unlockedPlots - 9;
            const expCost = Math.round(300 * Math.pow(2.15, boughtPlots));
            if (state.unlockedPlots >= 15 || state.coins < expCost) return;
            state.coins -= expCost;
            state.unlockedPlots++;
            haptic("success");
            showToast(`🏡 Открыта грядка №${state.unlockedPlots}!`);
          } else if (item.type === "upgrade") {
            if (state.turboCan || state.coins < item.cost) return;
            state.coins -= item.cost;
            state.turboCan = true;
            state.waterCharges = 10;
            haptic("success");
            showToast("🚿 Турбо-лейка активирована!");
          } else if (item.type === "consumable") {
            if (state.coins < item.cost) return;
            const growing = state.plots.filter((p, i) => i < state.unlockedPlots && p.cropId && !p.ready);
            if (growing.length === 0) {
              showToast("Сначала посади растения на грядки!");
              return;
            }
            state.coins -= item.cost;
            growing.forEach(p => {
              p.giantBoost = Number((2.5 + Math.random() * 1.5).toFixed(2));
            });
            haptic("success");
            showToast("🧪 Эликсир гиганта применён!");
          } else if (item.type === "device") {
            if (state.coins < item.cost) return;
            state.coins -= item.cost;
            const existing = state.devices.find(d => d.id === item.id);
            if (existing) {
              existing.endAt = Math.max(existing.endAt, Date.now()) + item.durationSec * 1000;
            } else {
              state.devices.push({ id: item.id, endAt: Date.now() + item.durationSec * 1000 });
            }
            haptic("success");
            showToast(`${item.emoji} ${item.name} установлен!`);
          }
          saveState();
          renderGear();
        };

        list.appendChild(card);
      });
    }

    function renderBag() {
      const list = document.getElementById("bagList");
      const sellAllBtn = document.getElementById("btnSellAll");
      list.innerHTML = "";

      const sorted = [...state.harvestBag].sort((a, b) => b.value - a.value);
      const totalVal = sorted.reduce((s, item) => s + item.value, 0);

      sellAllBtn.disabled = sorted.length === 0;
      sellAllBtn.textContent = `Продать всё (${formatNumber(totalVal)} 🪙)`;

      if (sorted.length === 0) {
        list.innerHTML = `<div class="empty-state">Рюкзак пока пуст.<br>Перейди в раздел «Сад» и собери созревшие плоды!</div>`;
        return;
      }

      sorted.forEach(item => {
        const mutHtml = item.mutations && item.mutations.length
          ? item.mutations.map(m => `<span class="tag" style="background:rgba(255,255,255,0.1);color:${m.color}">${m.name} x${m.mult}</span>`).join(" ")
          : `<span class="tag" style="background:rgba(255,255,255,0.06);color:#94a3b8">Обычный</span>`;

        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-left">
            <div class="item-emoji">${item.emoji}</div>
            <div class="item-info">
              <div class="item-title-row">
                <span class="item-name">${item.name}</span>
                <span style="font-size:11px;color:#a7f3d0;font-weight:700;">${item.weight} кг</span>
              </div>
              <div class="item-meta" style="margin-top:4px;">${mutHtml}</div>
            </div>
          </div>
          <button class="buy-btn">+${formatNumber(item.value)} 🪙</button>
        `;

        card.querySelector(".buy-btn").onclick = () => {
          state.coins += item.value;
          state.harvestBag = state.harvestBag.filter(x => x.uid !== item.uid);
          haptic("light");
          showToast(`🪙 Продано за ${formatNumber(item.value)} монет`);
          saveState();
          renderBag();
        };

        list.appendChild(card);
      });
    }

    // --- NAVIGATION & TOOLS ---
    function switchView(viewName) {
      currentView = viewName;
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === viewName));
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + viewName).classList.add("active");

      if (viewName === "garden") resizeCanvas();
      if (viewName === "shop") renderShop();
      if (viewName === "gear") renderGear();
      if (viewName === "bag") renderBag();
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.onclick = () => {
        haptic("light");
        switchView(btn.dataset.view);
      };
    });

    function updateToolButtons() {
      document.getElementById("toolWater").classList.toggle("active", activeTool === "water");
      document.getElementById("toolPlant").classList.toggle("active", activeTool === "plant");
      document.getElementById("toolShovel").classList.toggle("active", activeTool === "shovel");
    }

    document.getElementById("toolWater").onclick = () => {
      activeTool = "water";
      updateToolButtons();
      haptic("light");
    };

    document.getElementById("toolPlant").onclick = () => {
      activeTool = "plant";
      updateToolButtons();
      haptic("light");
    };

    document.getElementById("toolShovel").onclick = () => {
      activeTool = activeTool === "shovel" ? "plant" : "shovel";
      updateToolButtons();
      haptic("light");
    };

    document.getElementById("btnHarvestAll").onclick = () => {
      let count = 0;
      for (let i = 0; i < state.unlockedPlots; i++) {
        if (harvestPlot(i, true)) count++;
      }
      if (count > 0) {
        haptic("success");
        showToast(`🧺 Собрано плодов: ${count} шт.`);
        saveState();
      } else {
        showToast("Пока нет созревших плодов");
      }
    };

    document.getElementById("btnSellAll").onclick = () => {
      if (state.harvestBag.length === 0) return;
      const total = state.harvestBag.reduce((s, i) => s + i.value, 0);
      state.coins += total;
      state.harvestBag = [];
      haptic("success");
      showToast(`💰 Продано за ${formatNumber(total)} 🪙`);
      saveState();
      renderBag();
    };

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        shopFilter = btn.dataset.filter;
        renderShop();
      };
    });

    // --- RESPONSIVE FULLSCREEN CANVAS ---
    const canvasContainer = document.getElementById("canvasContainer");
    const canvas = document.getElementById("gardenCanvas");
    const ctx = canvas.getContext("2d");
    let logicalW = 360;
    let logicalH = 480;
    const plotRects = [];

    function resizeCanvas() {
      const rect = canvasContainer.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      logicalW = rect.width;
      logicalH = rect.height;
      canvas.width = Math.round(logicalW * dpr);
      canvas.height = Math.round(logicalH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    if (window.ResizeObserver) {
      new ResizeObserver(resizeCanvas).observe(canvasContainer);
    } else {
      window.addEventListener("resize", resizeCanvas);
    }

    const drops = Array.from({ length: 42 }, () => ({
      x: Math.random() * 500,
      y: Math.random() * 700,
      speed: 2 + Math.random() * 4,
      size: 1.2 + Math.random() * 2
    }));

    function drawGarden(ts) {
      if (currentView === "garden") {
        const wObj = WEATHERS.find(w => w.id === state.weather.id) || WEATHERS[0];

        // Фон участка
        const grad = ctx.createLinearGradient(0, 0, 0, logicalH);
        grad.addColorStop(0, wObj.skyTop);
        grad.addColorStop(1, wObj.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, logicalW, logicalH);

        // Декоративные травинки
        ctx.fillStyle = "rgba(52, 211, 153, 0.07)";
        for (let i = 0; i < 22; i++) {
          const gx = (i * 89) % Math.max(100, logicalW - 20) + 10;
          const gy = (i * 67) % Math.max(100, logicalH - 20) + 10;
          ctx.beginPath();
          ctx.arc(gx, gy, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Крупная сетка 3 колонки x 5 рядов на весь экран!
        const cols = 3;
        const rows = 5;
        const padX = 12;
        const topOffset = 38;
        const padBottom = 12;
        const gap = 10;
        const cellW = (logicalW - padX * 2 - gap * (cols - 1)) / cols;
        const cellH = (logicalH - topOffset - padBottom - gap * (rows - 1)) / rows;

        plotRects.length = 0;

        for (let i = 0; i < 15; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = padX + col * (cellW + gap);
          const y = topOffset + row * (cellH + gap);
          plotRects.push({ x, y, w: cellW, h: cellH });

          const unlocked = i < state.unlockedPlots;
          const p = state.plots[i];

          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x, y, cellW, cellH, 14);

          if (!unlocked) {
            ctx.fillStyle = "rgba(12, 20, 16, 0.55)";
            ctx.fill();
            ctx.strokeStyle = "rgba(148, 163, 184, 0.16)";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = "rgba(148, 163, 184, 0.45)";
            ctx.font = "18px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🔒", x + cellW / 2, y + cellH / 2);
            ctx.restore();
            continue;
          }

          // Почва грядки
          ctx.fillStyle = p.cropId ? "#3e291b" : "#2c1d13";
          ctx.fill();

          if (activeTool === "shovel" && p.cropId) {
            ctx.strokeStyle = "#f87171";
            ctx.lineWidth = 2.5;
          } else if (p.ready) {
            ctx.strokeStyle = "#34d399";
            ctx.lineWidth = 2.2;
          } else {
            ctx.strokeStyle = "#61402a";
            ctx.lineWidth = 2;
          }
          ctx.stroke();

          // Борозды
          ctx.strokeStyle = "rgba(0,0,0,0.28)";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(x + 12, y + cellH * 0.36);
          ctx.lineTo(x + cellW - 12, y + cellH * 0.36);
          ctx.moveTo(x + 12, y + cellH * 0.64);
          ctx.lineTo(x + cellW - 12, y + cellH * 0.64);
          ctx.stroke();

          // Растение
          if (p.cropId) {
            const crop = getCrop(p.cropId);
            const maxMs = p.growDuration * 1000;
            const progress = p.ready ? 1 : Math.min(0.99, p.progressMs / maxMs);

            if (p.ready && p.mutations && p.mutations.length > 0) {
              const topMut = p.mutations[p.mutations.length - 1];
              const pulse = 0.72 + Math.sin(ts / 220) * 0.25;
              const radius = Math.min(cellW, cellH) * 0.36 * pulse;
              ctx.beginPath();
              ctx.arc(x + cellW / 2, y + cellH / 2, radius, 0, Math.PI * 2);
              ctx.fillStyle = topMut.color + "33";
              ctx.fill();
            }

            const baseEmojiSize = Math.min(cellW, cellH) * 0.44;
            let scale = 0.5 + progress * 0.5;
            if (p.ready && crop) {
              const ratio = p.weight / crop.maxKg;
              scale = 1.0 + ratio * 0.65;
            }

            const bob = p.ready ? Math.sin(ts / 260 + i) * 2.5 : 0;
            ctx.font = `${Math.round(baseEmojiSize * scale)}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const icon = progress < 0.35 ? "🌱" : progress < 0.75 ? "🌿" : crop.emoji;
            ctx.fillText(icon, x + cellW / 2, y + cellH / 2 - 4 + bob);

            if (!p.ready) {
              const barW = cellW - 20;
              ctx.fillStyle = "rgba(0,0,0,0.52)";
              ctx.fillRect(x + 10, y + cellH - 12, barW, 5);
              ctx.fillStyle = "#34d399";
              ctx.fillRect(x + 10, y + cellH - 12, barW * progress, 5);
            } else {
              ctx.fillStyle = "rgba(12, 20, 16, 0.84)";
              ctx.beginPath();
              ctx.roundRect(x + 8, y + cellH - 19, cellW - 16, 14, 6);
              ctx.fill();
              ctx.fillStyle = p.mutations.length ? "#fde047" : "#ecfdf5";
              ctx.font = "bold 10px sans-serif";
              ctx.fillText(`${p.weight} кг`, x + cellW / 2, y + cellH - 12);
            }
          }
          ctx.restore();
        }

        // Активные устройства на участке
        if (state.devices.length > 0) {
          state.devices.forEach((d, idx) => {
            const item = GEAR_ITEMS.find(g => g.id === d.id);
            if (!item) return;
            const dx = logicalW / 2 - ((state.devices.length - 1) * 14) + idx * 28;
            const dy = 22 + Math.sin(ts / 300 + idx) * 2;
            ctx.font = "17px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(item.emoji, dx, dy);
          });
        }

        // Погодные частицы
        if (state.weather.id === "rain" || state.weather.id === "storm") {
          ctx.strokeStyle = "rgba(125, 211, 252, 0.42)";
          ctx.lineWidth = 1.4;
          drops.forEach(d => {
            d.y += d.speed * 2.2;
            d.x -= 1.2;
            if (d.y > logicalH) { d.y = -10; d.x = Math.random() * logicalW; }
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 3, d.y + 10);
            ctx.stroke();
          });
        } else if (state.weather.id === "frost") {
          ctx.fillStyle = "rgba(224, 242, 254, 0.68)";
          drops.forEach(d => {
            d.y += d.speed * 0.55;
            d.x += Math.sin(ts / 500 + d.y) * 0.4;
            if (d.y > logicalH) { d.y = -5; d.x = Math.random() * logicalW; }
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (state.weather.id === "meteor") {
          ctx.strokeStyle = "rgba(253, 224, 71, 0.72)";
          ctx.lineWidth = 2;
          drops.slice(0, 9).forEach(d => {
            d.y += d.speed * 2.8;
            d.x += d.speed * 1.6;
            if (d.y > logicalH || d.x > logicalW) { d.y = -10; d.x = Math.random() * (logicalW * 0.7); }
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 14, d.y - 20);
            ctx.stroke();
          });
        }
      }

      requestAnimationFrame(drawGarden);
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;

      for (let i = 0; i < plotRects.length; i++) {
        const r = plotRects[i];
        if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) {
          handlePlotTap(i);
          break;
        }
      }
    });

    // --- BOOT ---
    initProfile();
    resizeCanvas();
    updateToolButtons();
    gameTick();
    setInterval(gameTick, 400);
    requestAnimationFrame(drawGarden);
  </script>
</body>
</html>
