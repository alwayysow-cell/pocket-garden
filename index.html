<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pocket Garden</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #1c1922;
      --bg-bot: #121016;
      --card: #25212d;
      --card-2: #302b3b;
      --card-3: #3d364a;
      --ink: #f7f4fa;
      --ink-muted: #a69eb5;
      --outline: #0d0b10;
      --accent: #ff8c42;
      --accent-dark: #d9621c;
      --teal: #2dd4bf;
      --gold: #ffca3a;
      --gold-dark: #b88200;
      --danger: #ff5964;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-bot);
      color: var(--ink);
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      max-width: 520px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
      gap: 8px;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    }

    /* VECTOR ICONS */
    .svg-ico {
      width: 21px;
      height: 21px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .svg-ico-sm {
      width: 17px;
      height: 17px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .svg-ico-tool {
      width: 28px;
      height: 28px;
      display: inline-block;
      flex-shrink: 0;
    }

    .svg-ico-nav {
      width: 23px;
      height: 23px;
      display: inline-block;
      flex-shrink: 0;
    }

    /* HEADER */
    .header {
      background: var(--card);
      border: 2.5px solid var(--outline);
      border-bottom-width: 5px;
      border-radius: 22px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.07), 0 5px 15px rgba(0, 0, 0, 0.45);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      cursor: pointer;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8c42 0%, #e04f5f 100%);
      border: 2.5px solid var(--outline);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #ffffff;
      text-shadow: 0 1.5px 0 var(--outline);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lvl-pill {
      background: #2dd4bf;
      border: 1.8px solid var(--outline);
      color: #082f2c;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .profile-rank-row {
      font-size: 11px;
      color: #ffca3a;
      font-weight: 800;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stats-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .weather-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--card-2);
      border: 2px solid var(--outline);
      border-radius: 99px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 900;
      color: var(--ink);
    }

    .weather-bar {
      width: 20px;
      height: 5px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      overflow: hidden;
    }

    .weather-bar-fill {
      height: 100%;
      background: var(--teal);
      width: 100%;
      transition: width 0.4s linear;
    }

    .coins-badge {
      background: linear-gradient(180deg, #ffda66 0%, #f59e0b 100%);
      border: 2.5px solid var(--outline);
      border-bottom-width: 4px;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45);
      color: #291500;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-variant-numeric: tabular-nums;
    }

    /* MAIN VIEWPORT */
    .views {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .view.active {
      display: flex;
    }

    /* GARDEN VIEW */
    .garden-view {
      gap: 8px;
    }

    .canvas-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      border: 3px solid var(--outline);
      border-bottom-width: 5px;
      background: #231f29;
      position: relative;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    .garden-overlay-top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
      z-index: 5;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .hud-chip {
      background: rgba(34, 30, 42, 0.92);
      border: 2px solid var(--outline);
      border-bottom-width: 3.5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 900;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    .hud-chip.clickable {
      pointer-events: auto;
      cursor: pointer;
      background: linear-gradient(180deg, #383145 0%, #272230 100%);
    }

    .hud-chip.clickable:active {
      transform: translateY(1.5px);
      border-bottom-width: 2px;
    }

    .hud-chip.harvest-quick {
      pointer-events: auto;
      cursor: pointer;
      background: linear-gradient(180deg, #ffa45c 0%, #ea631c 100%);
      border-color: var(--outline);
      color: #ffffff;
    }

    .hud-chip.order-chip {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(37, 33, 45, 0.94);
      border-color: var(--outline);
      color: #ffca3a;
      font-size: 11px;
      padding: 3px 11px;
      margin: 0 auto;
    }

    .active-devices-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
    }

    .device-chip {
      background: #302b3b;
      border: 2px solid var(--outline);
      color: #5eead4;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    /* 3-BUTTON TOOLBAR */
    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      flex-shrink: 0;
    }

    .tool-btn {
      background: linear-gradient(180deg, #322c3d 0%, #24202c 100%);
      border: 2.5px solid var(--outline);
      border-bottom-width: 5px;
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.08), 0 4px 10px rgba(0, 0, 0, 0.4);
      color: var(--ink);
      border-radius: 18px;
      padding: 6px 6px;
      font-size: 12px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.08s;
    }

    .tool-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2.5px;
    }

    .tool-btn.active {
      background: linear-gradient(180deg, #ffa45c 0%, #e0611b 100%);
      border-color: var(--outline);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), 0 4px 12px rgba(224, 97, 27, 0.35);
      color: #ffffff;
    }

    .tool-btn.danger.active {
      background: linear-gradient(180deg, #ff7582 0%, #d92638 100%);
      border-color: var(--outline);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }

    .tool-btn .sub {
      font-size: 10px;
      color: var(--ink-muted);
      font-weight: 800;
      max-width: 106px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-btn.active .sub {
      color: #ffedd5;
    }

    .tool-btn.danger.active .sub {
      color: #ffe4e6;
    }

    /* SUBPAGES */
    .subpage {
      background: var(--card);
      border: 2.5px solid var(--outline);
      border-bottom-width: 5px;
      border-radius: 24px;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.07), 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 16.5px;
      font-weight: 900;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .timer-badge {
      background: var(--card-2);
      border: 2px solid var(--outline);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      color: #d8d2e3;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2dd4bf;
      box-shadow: 0 0 8px #2dd4bf;
      animation: livePulse 1.5s infinite;
      flex-shrink: 0;
    }

    .live-dot.connecting {
      background: #ffca3a;
      box-shadow: 0 0 6px #ffca3a;
    }

    @keyframes livePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.65; }
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    .filter-btn {
      background: var(--card-2);
      border: 2px solid var(--outline);
      border-bottom-width: 3px;
      color: var(--ink-muted);
      border-radius: 99px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      background: linear-gradient(180deg, #ffa45c 0%, #e0611b 100%);
      color: #ffffff;
      font-weight: 900;
    }

    .scroll-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .item-card {
      background: var(--card-2);
      border: 2px solid var(--outline);
      border-bottom-width: 4px;
      border-left: 5px solid #524a63;
      border-radius: 18px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .item-card.out-of-stock {
      opacity: 0.45;
      background: #1e1b24;
    }

    .item-card.selected-card {
      border-color: #ff8c42;
      border-left-color: #ff8c42;
      background: linear-gradient(180deg, #3b3145 0%, #2c2433 100%);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .item-thumb {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(180deg, #211d29 0%, #17141c 100%);
      border: 2px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-info {
      min-width: 0;
    }

    .item-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .item-name {
      font-size: 14px;
      font-weight: 900;
      color: var(--ink);
    }

    .tag {
      font-size: 9.5px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 7px;
      border: 1.5px solid rgba(0, 0, 0, 0.4);
      text-transform: uppercase;
    }

    .rarity-common { background: #433d52; color: #e9e4f2; }
    .rarity-uncommon { background: #0f766e; color: #ccfbf1; }
    .rarity-rare { background: #6d28d9; color: #ede9fe; }
    .rarity-epic { background: #be185d; color: #fce7f3; }
    .rarity-legendary { background: #b45309; color: #fef3c7; }
    .rarity-mythical { background: #b91c1c; color: #fee2e2; }

    .item-meta {
      font-size: 11px;
      color: var(--ink-muted);
      font-weight: 700;
      margin-top: 3px;
      line-height: 1.35;
    }

    .item-meta strong {
      color: #f3effa;
    }

    .buy-btn {
      background: linear-gradient(180deg, #ffda66 0%, #f59e0b 100%);
      border: 2px solid var(--outline);
      border-bottom-width: 4px;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45);
      color: #291500;
      font-weight: 900;
      font-size: 12.5px;
      padding: 8px 12px;
      border-radius: 14px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      font-variant-numeric: tabular-nums;
    }

    .buy-btn:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .buy-btn:disabled {
      background: #26222e;
      border-color: #15121a;
      border-bottom-width: 2px;
      box-shadow: none;
      color: #6b637a;
      cursor: not-allowed;
    }

    .sell-all-btn {
      background: linear-gradient(180deg, #ffda66 0%, #f59e0b 100%);
      border: 2px solid var(--outline);
      border-bottom-width: 4px;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45);
      color: #291500;
      font-weight: 900;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sell-all-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 36px 12px;
      color: var(--ink-muted);
      font-weight: 800;
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* LIVE COIN LEADERBOARD (ONLINE + OFFLINE PLAYERS, NO LEAGUES) */
    .lb-summary-card {
      background: linear-gradient(180deg, #352d42 0%, #282233 100%);
      border: 2px solid var(--outline);
      border-bottom-width: 4px;
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .lb-summary-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .lb-summary-title {
      font-size: 13px;
      font-weight: 900;
      color: #ffca3a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lb-summary-sub {
      font-size: 11px;
      font-weight: 800;
      color: var(--ink-muted);
    }

    .lb-row {
      background: var(--card-2);
      border: 2px solid var(--outline);
      border-bottom-width: 3.5px;
      border-radius: 16px;
      padding: 8px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .lb-row.is-me {
      background: linear-gradient(180deg, #423347 0%, #322638 100%);
      border-color: #ff8c42;
    }

    .lb-row.is-offline {
      opacity: 0.88;
    }

    .lb-row.flash-update {
      border-color: #2dd4bf;
      background: linear-gradient(180deg, #273e42 0%, #233036 100%);
    }

    .lb-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .lb-rank {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: #211d29;
      border: 1.8px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #cbd5e1;
      flex-shrink: 0;
    }

    .lb-rank.top-1 {
      background: linear-gradient(180deg, #ffe066 0%, #f59e0b 100%);
      color: #291500;
    }

    .lb-rank.top-2 {
      background: linear-gradient(180deg, #e2e8f0 0%, #94a3b8 100%);
      color: #0f172a;
    }

    .lb-rank.top-3 {
      background: linear-gradient(180deg, #f4a261 0%, #c26d2d 100%);
      color: #291100;
    }

    .lb-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .lb-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      overflow: hidden;
    }

    .lb-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2dd4bf;
      border: 2px solid var(--card-2);
    }

    .status-dot.offline {
      background: #64748b;
    }

    .lb-name-wrap {
      min-width: 0;
    }

    .lb-name {
      font-size: 13px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lb-sub {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--ink-muted);
    }

    .lb-sub .online-txt {
      color: #2dd4bf;
    }

    .lb-coins {
      background: #1d1924;
      border: 1.8px solid var(--outline);
      padding: 4px 9px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 900;
      color: #ffca3a;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* 5-TAB BOTTOM NAVIGATION */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: var(--card);
      border: 2.5px solid var(--outline);
      border-bottom-width: 5px;
      border-radius: 22px;
      padding: 5px;
      flex-shrink: 0;
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.07), 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    .nav-btn {
      border: 2px solid transparent;
      background: transparent;
      color: var(--ink-muted);
      border-radius: 14px;
      padding: 5px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      position: relative;
    }

    .nav-btn.active {
      background: linear-gradient(180deg, #ffa45c 0%, #e0611b 100%);
      border-color: var(--outline);
      border-bottom-width: 3px;
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }

    .badge-dot {
      position: absolute;
      top: 1px;
      right: 6px;
      background: #2dd4bf;

    .modal-backdrop {

      justify-content: center;

      padding: 0;
    }

      border: 3px solid var(--outline);
      border-bottom-width: 6px;
      border-radius: 24px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.09), 0 14px 36px rgba(0, 0, 0, 0.6);
    }

    .modal-backdrop.sheet .modal {
      max-width: 520px;
      border-radius: 26px 26px 0 0;
      border-bottom: none;
      max-height: 75dvh;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .modal-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;

      font-weight: 700;
      line-height: 1.45;

    }

    .modal-actions {

      gap: 8px;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: var(--card-2);
      border: 2px solid var(--outline);
      border-bottom-width: 3.5px;
      color: var(--ink);
      padding: 8px 13px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-danger {
      background: linear-gradient(180deg, #ff7582 0%, #d92638 100%);

      border-bottom-width: 3.5px;
      color: #ffffff;
      padding: 8px 13px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: #2b2636;
      border: 2.5px solid var(--outline);

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    // --- LIVE REAL-TIME + OFFLINE COIN LEADERBOARD (NO LEAGUES) ---
    const LIVE_TOPIC_PREFIX = "pocket_garden_live_top_v1/players/";
    const PLAYER_UID_KEY = "pocket_garden_player_uid_v1";
    const LIVE_CACHE_KEY = "pocket_garden_live_players_cache_v1";
    const AVATAR_COLORS = ["#e11d48", "#9333ea", "#2563eb", "#db2777", "#d97706", "#0d9488", "#4f46e5", "#ea580c"];

    function getPersistentPlayerId() {
      const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
      if (user && user.id) return "tg_" + String(user.id);
      let uid = localStorage.getItem(PLAYER_UID_KEY);
      if (!uid) {
        uid = "web_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem(PLAYER_UID_KEY, uid);
      }
      return uid;
    }

    function pickColorForId(id) {
      let hash = 0;
      for (let i = 0; i < id.length; i++) {
        hash = (hash * 31 + id.charCodeAt(i)) | 0;
      }
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    let playerProfile = {
      id: getPersistentPlayerId(),
      name: "Садовод",
      initials: "С",
      photoUrl: null,
      color: pickColorForId(getPersistentPlayerId())
    };

    const livePlayersMap = new Map();
    const recentlyUpdatedIds = new Set();
    let mqttClient = null;
    let isLiveConnected = false;
    let lastPublishedCoins = -1;
    let lastPublishedAt = 0;
    let publishDebounceTimer = null;

    function loadCachedPlayers() {
      try {
        const raw = localStorage.getItem(LIVE_CACHE_KEY);
        if (!raw) return;
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return;
        arr.forEach(p => {
          if (!p || !p.id || p.id === playerProfile.id) return;
          livePlayersMap.set(String(p.id), {
            id: String(p.id),
            name: String(p.name || "Садовод").slice(0, 28),
            initials: String(p.initials || "С").toUpperCase(),
            photoUrl: p.photoUrl || null,
            color: p.color || pickColorForId(String(p.id)),
            coins: Math.max(0, Math.floor(Number(p.coins) || 0)),
            lvl: Math.max(1, Math.floor(Number(p.lvl) || 1)),
            updatedAt: Number(p.updatedAt) || (Date.now() - 3600000),
            isMe: false
          });
        });
      } catch (e) {}
    }

    function saveCachedPlayers() {
      try {
        const list = Array.from(livePlayersMap.values())
          .filter(p => !p.isMe)
          .sort((a, b) => b.coins - a.coins)
          .slice(0, 100);
        localStorage.setItem(LIVE_CACHE_KEY, JSON.stringify(list));
      } catch (e) {}
    }

    function formatLastSeen(updatedAt) {
      const diffSec = Math.max(1, Math.floor((Date.now() - (updatedAt || Date.now())) / 1000));
      if (diffSec < 60) return "только что";
      const mins = Math.floor(diffSec / 60);
      if (mins < 60) return `${mins} мин. назад`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} ч. назад`;
      const days = Math.floor(hours / 24);
      return `${days} дн. назад`;
    }

    function syncSelfToLiveMap() {
      const now = Date.now();
      livePlayersMap.set(playerProfile.id, {
        id: playerProfile.id,
        name: playerProfile.name,
        initials: playerProfile.initials,
        photoUrl: playerProfile.photoUrl,
        color: playerProfile.color,
        coins: Math.floor(state.coins),
        lvl: getPlayerLevel(),
        updatedAt: now,
        isMe: true
      });
    }

    function publishMyLiveScore(force = false) {
      syncSelfToLiveMap();
      if (!mqttClient || !isLiveConnected) return;

      const now = Date.now();
      const currentCoins = Math.floor(state.coins);
      if (!force && currentCoins === lastPublishedCoins && now - lastPublishedAt < 12000) {
        return;
      }

      lastPublishedCoins = currentCoins;
      lastPublishedAt = now;

      const payload = JSON.stringify({
        id: playerProfile.id,
        name: playerProfile.name,
        initials: playerProfile.initials,
        photoUrl: playerProfile.photoUrl || null,
        color: playerProfile.color,
        coins: currentCoins,
        lvl: getPlayerLevel(),
        updatedAt: now
      });

      try {
        mqttClient.publish(LIVE_TOPIC_PREFIX + playerProfile.id, payload, { qos: 0, retain: true });
      } catch (e) {}
    }

    function scheduleLiveScorePublish() {
      syncSelfToLiveMap();
      clearTimeout(publishDebounceTimer);
      publishDebounceTimer = setTimeout(() => publishMyLiveScore(false), 900);
    }

    function initLiveLeaderboard() {
      loadCachedPlayers();
      syncSelfToLiveMap();

      if (typeof window.mqtt === "undefined") {
        updateLiveStatusUI();
        return;
      }

      try {
        mqttClient = window.mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
          clientId: "pg_" + playerProfile.id + "_" + Math.random().toString(16).slice(2, 6),
          clean: true,
          connectTimeout: 8000,
          reconnectPeriod: 4000
        });

        mqttClient.on("connect", () => {
          isLiveConnected = true;
          mqttClient.subscribe(LIVE_TOPIC_PREFIX + "#", { qos: 0 });
          publishMyLiveScore(true);
          updateLiveStatusUI();
          if (currentView === "top") renderLeaderboard();
        });

        mqttClient.on("reconnect", () => {
          isLiveConnected = false;
          updateLiveStatusUI();
        });

        mqttClient.on("offline", () => {
          isLiveConnected = false;
          updateLiveStatusUI();
        });

        mqttClient.on("message", (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            if (!data || !data.id || typeof data.coins !== "number") return;
            if (data.id === playerProfile.id) return;

            const prev = livePlayersMap.get(data.id);
            const incomingTs = Number(data.updatedAt) || Date.now();
            if (prev && prev.updatedAt && incomingTs < prev.updatedAt) return;

            const changed = !prev || prev.coins !== data.coins;

            livePlayersMap.set(data.id, {
              id: String(data.id),
              name: String(data.name || "Садовод").slice(0, 28),
              initials: String(data.initials || (data.name ? data.name[0] : "С")).toUpperCase(),
              photoUrl: data.photoUrl || null,
              color: data.color || pickColorForId(String(data.id)),
              coins: Math.max(0, Math.floor(data.coins)),
              lvl: Math.max(1, Math.floor(Number(data.lvl) || 1)),
              updatedAt: incomingTs,
              isMe: false
            });

            saveCachedPlayers();

            if (changed) {
              recentlyUpdatedIds.add(data.id);
              setTimeout(() => recentlyUpdatedIds.delete(data.id), 1400);
            }

            updateLiveStatusUI();
            if (currentView === "top") renderLeaderboard();
          } catch (e) {}
        });
      } catch (e) {
        isLiveConnected = false;
        updateLiveStatusUI();
      }

      setInterval(() => {
        if (isLiveConnected) publishMyLiveScore(true);
        if (currentView === "top") renderLeaderboard();
      }, 15000);
    }

    function getCoinLeaderboard() {
      syncSelfToLiveMap();
      const all = Array.from(livePlayersMap.values());
      all.sort((a, b) => {
        if (b.coins !== a.coins) return b.coins - a.coins;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });
      return all;
    }

    function getMyLeaderboardRank() {
      const board = getCoinLeaderboard();
      const idx = board.findIndex(x => x.id === playerProfile.id);
      return { rank: idx >= 0 ? idx + 1 : 1, total: board.length, board };
    }

    function getOnlinePlayersCount() {
      const now = Date.now();
      let count = 0;
      livePlayersMap.forEach(p => {
        if (p.isMe || now - (p.updatedAt || 0) < 50000) count++;
      });
      return Math.max(1, count);
    }

        dot.classList.add("connecting");
        text.textContent = `Офлайн • Всего: ${total}`;
      }

    // --- CUTE EXPRESSIVE CARTOON PLANT ILLUSTRATION ---
    function drawCropIllustration(ctx, crop, cx, cy, radius, progress = 1, showCuteFace = false) {
      ctx.save();
      ctx.translate(cx, cy);

      const growthScale = progress < 1 ? (0.65 + progress * 0.35) : 1;
      ctx.scale(growthScale, growthScale);

      if (progress < 1) {
        ctx.fillStyle = "#261307";
        ctx.beginPath();
        ctx.ellipse(0, radius * 0.65, radius * 0.65, radius * 0.24, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#40c057";
        ctx.strokeStyle = "#0d0b10";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(-radius * 0.45, radius * 0.55, radius * 0.28, radius * 0.13, -0.35, 0, Math.PI * 2);
        ctx.ellipse(radius * 0.45, radius * 0.55, radius * 0.28, radius * 0.13, 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      const r = radius * 0.84;
      ctx.strokeStyle = "#140b05";
      ctx.lineWidth = Math.max(2.3, r * 0.12);
      ctx.lineJoin = "round";

      const drawTopLeaf = (yOff = -r * 0.85) => {
        ctx.fillStyle = crop.leaf || "#40c057";
        ctx.beginPath();
        ctx.ellipse(-r * 0.32, yOff, r * 0.38, r * 0.2, -0.45, 0, Math.PI * 2);
        ctx.ellipse(r * 0.32, yOff, r * 0.38, r * 0.2, 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      };

      if (crop.shape === "carrot") {
        drawTopLeaf(-r * 0.72);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.moveTo(-r * 0.54, -r * 0.65);
        ctx.quadraticCurveTo(0, -r * 0.84, r * 0.54, -r * 0.65);
        ctx.lineTo(0, r * 0.98);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "rgba(124, 45, 18, 0.45)";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(-r * 0.24, -r * 0.22);
        ctx.lineTo(r * 0.1, -r * 0.22);
        ctx.moveTo(-r * 0.14, r * 0.28);
        ctx.lineTo(r * 0.12, r * 0.28);
        ctx.stroke();
      } else if (crop.shape === "berry") {
        drawTopLeaf(-r * 0.78);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.moveTo(-r * 0.76, -r * 0.55);
        ctx.quadraticCurveTo(0, -r * 0.85, r * 0.76, -r * 0.55);
        ctx.quadraticCurveTo(r * 0.78, r * 0.35, 0, r * 0.95);
        ctx.quadraticCurveTo(-r * 0.78, r * 0.35, -r * 0.76, -r * 0.55);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#fff3bf";
        [[-0.32, -0.2], [0.32, -0.2], [-0.24, 0.42], [0.24, 0.42]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.arc(r * sx, r * sy, r * 0.08, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (crop.shape === "corn") {
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.52, r * 0.88, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = crop.leaf;
        ctx.beginPath();
        ctx.moveTo(-r * 0.62, r * 0.12);
        ctx.quadraticCurveTo(-r * 0.48, r * 0.94, 0, r * 0.98);
        ctx.quadraticCurveTo(r * 0.48, r * 0.94, r * 0.62, r * 0.12);
        ctx.quadraticCurveTo(0, r * 0.54, -r * 0.62, r * 0.12);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "pepper") {
        drawTopLeaf(-r * 0.75);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.moveTo(-r * 0.38, -r * 0.65);
        ctx.quadraticCurveTo(r * 0.6, -r * 0.65, r * 0.5, r * 0.35);
        ctx.quadraticCurveTo(r * 0.36, r * 0.98, -r * 0.16, r * 0.94);
        ctx.quadraticCurveTo(-r * 0.6, r * 0.25, -r * 0.38, -r * 0.65);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "cluster") {
        drawTopLeaf(-r * 0.85);
        ctx.fillStyle = crop.color;
        const pts = [[-0.36, -0.35], [0.36, -0.35], [0, -0.35], [-0.26, 0.1], [0.26, 0.1], [0, 0.56]];
        pts.forEach(([bx, by]) => {
          ctx.beginPath();
          ctx.arc(r * bx, r * by, r * 0.36, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
      } else if (crop.shape === "pumpkin") {
        drawTopLeaf(-r * 0.82);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.ellipse(-r * 0.44, 0.05 * r, r * 0.48, r * 0.76, 0, 0, Math.PI * 2);
        ctx.ellipse(r * 0.44, 0.05 * r, r * 0.48, r * 0.76, 0, 0, Math.PI * 2);
        ctx.ellipse(0, 0.05 * r, r * 0.44, r * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "melon") {
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "#1b4d36";
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.48, -Math.PI * 0.42, Math.PI * 0.42);
        ctx.stroke();
      } else if (crop.shape === "pineapple") {
        ctx.fillStyle = crop.leaf;
        ctx.beginPath();
        ctx.moveTo(0, -r * 1.15);
        ctx.lineTo(-r * 0.48, -r * 0.45);
        ctx.lineTo(r * 0.48, -r * 0.45);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.18, r * 0.62, r * 0.76, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "mushroom") {
        ctx.fillStyle = "#f1f5f9";
        ctx.beginPath();
        ctx.roundRect(-r * 0.28, 0, r * 0.56, r * 0.8, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.arc(0, r * 0.05, r * 0.82, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "flower") {
        ctx.fillStyle = crop.color;
        for (let a = 0; a < 6; a++) {
          const ang = (a * Math.PI) / 3;
          ctx.beginPath();
          ctx.ellipse(Math.cos(ang) * r * 0.46, Math.sin(ang) * r * 0.46, r * 0.4, r * 0.26, ang, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.fillStyle = crop.leaf;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.36, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "star" || crop.shape === "dragon") {
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        const spikes = crop.shape === "star" ? 5 : 6;
        for (let i = 0; i < spikes * 2; i++) {
          const rad = i % 2 === 0 ? r * 0.95 : r * 0.5;
          const ang = (i * Math.PI) / spikes - Math.PI / 2;
          if (i === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
          else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (crop.shape === "oval") {
        drawTopLeaf(-r * 0.76);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.08, r * 0.62, r * 0.78, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        drawTopLeaf(-r * 0.78);
        ctx.fillStyle = crop.color;
        ctx.beginPath();
        ctx.arc(0, r * 0.08, r * 0.82, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(255, 255, 255, 0.42)";
      ctx.beginPath();
      ctx.ellipse(-r * 0.26, -r * 0.22, r * 0.21, r * 0.11, -0.5, 0, Math.PI * 2);
      ctx.fill();

      if (showCuteFace && progress >= 1 && r >= 12) {
        const eyeY = crop.shape === "carrot" ? -r * 0.12 : r * 0.06;
        const eyeDist = r * 0.22;

        ctx.fillStyle = "rgba(255, 105, 135, 0.55)";
        ctx.beginPath();
        ctx.ellipse(-eyeDist * 1.35, eyeY + r * 0.11, r * 0.11, r * 0.065, 0, 0, Math.PI * 2);
        ctx.ellipse(eyeDist * 1.35, eyeY + r * 0.11, r * 0.11, r * 0.065, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#140b05";
        ctx.beginPath();
        ctx.arc(-eyeDist, eyeY, r * 0.095, 0, Math.PI * 2);
        ctx.arc(eyeDist, eyeY, r * 0.095, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(-eyeDist - r * 0.03, eyeY - r * 0.03, r * 0.035, 0, Math.PI * 2);
        ctx.arc(eyeDist - r * 0.03, eyeY - r * 0.03, r * 0.035, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#140b05";
        ctx.lineWidth = Math.max(1.5, r * 0.075);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, eyeY + r * 0.05, r * 0.12, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawGearIllustration(ctx, gear, cx, cy, radius) {
      ctx.save();
      ctx.translate(cx, cy);
      const r = radius * 0.76;
      ctx.strokeStyle = "#0d0b10";
      ctx.lineWidth = 2.4;

      if (gear.id === "watering_can") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.roundRect(-r * 0.48, -r * 0.28, r * 0.94, r * 0.88, 7);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(r * 0.46, r * 0.2);
        ctx.lineTo(r * 0.98, -r * 0.36);
        ctx.stroke();
      } else if (gear.id === "giant_elixir" || gear.id === "growth_fertilizer") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.arc(0, r * 0.22, r * 0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(-r * 0.24, -r * 0.76, r * 0.48, r * 0.44);
        ctx.strokeRect(-r * 0.24, -r * 0.76, r * 0.48, r * 0.44);
      } else if (gear.id === "sprinkler_basic" || gear.id === "sprinkler_gold") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.moveTo(-r * 0.58, r * 0.76);
        ctx.lineTo(0, -r * 0.46);
        ctx.lineTo(r * 0.58, r * 0.76);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#4dabf7";
        ctx.beginPath();
        ctx.arc(-r * 0.52, -r * 0.56, r * 0.22, 0, Math.PI * 2);
        ctx.arc(r * 0.52, -r * 0.56, r * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (gear.id === "lightning_rod") {
        ctx.strokeStyle = gear.color;
        ctx.lineWidth = 3.8;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.92);
        ctx.lineTo(0, r * 0.86);
        ctx.moveTo(-r * 0.54, -r * 0.35);
        ctx.lineTo(r * 0.54, -r * 0.35);
        ctx.stroke();
      } else if (gear.id === "star_prism") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.92);
        ctx.lineTo(r * 0.78, 0);
        ctx.lineTo(0, r * 0.92);
        ctx.lineTo(-r * 0.78, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (gear.id === "collector_drone") {
        ctx.fillStyle = gear.color;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.1, r * 0.84, r * 0.38, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#bae6fd";
        ctx.beginPath();
        ctx.arc(0, -r * 0.16, r * 0.4, Math.PI, 0);
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.fillStyle = "#a35e29";
        ctx.beginPath();
        ctx.roundRect(-r * 0.72, -r * 0.72, r * 1.44, r * 1.44, 8);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "#ffca3a";
        ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.4);
        ctx.lineTo(0, r * 0.4);
        ctx.moveTo(-r * 0.4, 0);
        ctx.lineTo(r * 0.4, 0);
        ctx.stroke();
      }

      ctx.restore();
    }

    function createMiniThumbCanvas(drawFn) {

      c.width = 104;
      c.height = 104;
      c.style.width = "50px";
      c.style.height = "50px";

    // --- HELPERS & ORDERS ---
    function getCrop(id) {
      return CROPS.find(c => c.id === id);
    }

    function getGear(id) {
      return GEAR_ITEMS.find(g => g.id === id);
    }

    function createEmptyPlot() {
      return {
        cropId: null,
        progressMs: 0,
        growDuration: 0,
        ready: false,
        weight: 0,
        mutations: [],
        giantBoost: 1
      };
    }

    function generateOrder(st) {
      const unlockedTierCrops = CROPS.filter(c => c.cost <= Math.max(500, (st.coins || 120) * 3));
      const pool = unlockedTierCrops.length > 0 ? unlockedTierCrops : CROPS.slice(0, 4);
      const pick = pool[Math.floor(Math.random() * pool.length)];
      const target = pick.multi ? 3 : 2;
      return {
        cropId: pick.id,
        target,
        progress: 0
      };
    }

    function createDefaultState() {
      const now = Date.now();
      return {
        version: 11,
        coins: 120,
        xp: 0,
        bestFruitValue: 0,
        unlockedPlots: 9,
        plots: Array.from({ length: 15 }, () => createEmptyPlot()),
        seedInventory: { carrot: 3 },
        selectedSeed: "carrot",
        gearInventory: { watering_can: 2 },
        selectedGear: "watering_can",
        harvestBag: [],
        devices: [],
        weather: { id: "clear", remainingMs: 45000, durationMs: 45000 },
        shop: { nextRefreshAt: now + SHOP_REFRESH_MS, stock: {} },
        gearShop: { nextRefreshAt: now + SHOP_REFRESH_MS, stock: {} },
        order: { cropId: "carrot", target: 2, progress: 0 },
        lastTimestamp: now
      };
    }

    function getPlayerLevel() {
      const xp = state.xp || 0;
      return Math.max(1, Math.floor(Math.sqrt(xp / 120)) + 1);
    }

    function getLevelBonusMultiplier() {
      return 1 + (getPlayerLevel() - 1) * 0.05;
    }

    function generateSeedStock() {
      const stock = {};
      CROPS.forEach(c => {
        stock[c.id] = Math.random() <= c.stockChance ? Math.floor(Math.random() * c.maxStock) + 1 : 0;
      });
      if (!stock.carrot || stock.carrot < 3) stock.carrot = 5;
      return stock;
    }

    function generateGearStock() {
      const stock = {};
      GEAR_ITEMS.forEach(g => {
        if (g.id === "expand_plot") {
          stock[g.id] = 1;
        } else {
          stock[g.id] = Math.random() <= g.stockChance ? Math.floor(Math.random() * g.maxStock) + 1 : 0;
        }
      });
      if (!stock.watering_can || stock.watering_can < 2) stock.watering_can = 3;
      return stock;
    }

    function rollFruitStatsWithContext(crop, plot, weatherId, activeDeviceIds) {
      const hasGoldSprinkler = activeDeviceIds.includes("sprinkler_gold");
      const hasBasicSprinkler = activeDeviceIds.includes("sprinkler_basic");
      const hasPrism = activeDeviceIds.includes("star_prism");
      const hasRod = activeDeviceIds.includes("lightning_rod");

      const sizeBoost = (hasGoldSprinkler ? 1.35 : hasBasicSprinkler ? 1.2 : 1) * (plot.giantBoost || 1);
      const isGiantRoll = Math.random() < 0.12;
      const rawRatio = Math.pow(Math.random(), isGiantRoll ? 0.6 : 1.7);
      const weight = Number(((crop.minKg + (crop.maxKg - crop.minKg) * rawRatio) * sizeBoost).toFixed(2));

      const mutations = [];
      const goldMult = hasGoldSprinkler ? 3 : 1;
      const prismMult = hasPrism ? 3 : 1;
      const rodMult = hasRod ? 3 : 1;

      if (Math.random() < 0.012 * prismMult) {
        mutations.push({ id: "rainbow", name: "Rainbow", mult: 10, color: "#f06595" });
      } else if (Math.random() < 0.04 * goldMult) {
        mutations.push({ id: "gold", name: "Gold", mult: 3, color: "#ffd43b" });
      }

      if (weatherId === "rain" && Math.random() < 0.5) {
        mutations.push({ id: "wet", name: "Wet", mult: 1.5, color: "#4dabf7" });
      }
      if (weatherId === "frost" && Math.random() < 0.4) {
        mutations.push({ id: "frozen", name: "Frozen", mult: 5, color: "#74c0fc" });
      }
      if (weatherId === "storm" && Math.random() < 0.18 * rodMult) {
        mutations.push({ id: "shocked", name: "Shocked", mult: 20, color: "#cc5de8" });
      }
      if (weatherId === "meteor" && Math.random() < 0.14 * prismMult) {
        mutations.push({ id: "starlit", name: "Starlit", mult: 35, color: "#ffe066" });
      }

      return { weight, mutations };
    }

    function calcFruitPrice(crop, weight, mutations) {
      const avgKg = (crop.minKg + crop.maxKg) / 2;
      const weightFactor = Math.max(0.75, Math.min(4.5, weight / avgKg));
      const mutMult = mutations.reduce((acc, m) => acc * m.mult, 1);
      const lvlMult = typeof state !== "undefined" ? getLevelBonusMultiplier() : 1;
      return Math.max(1, Math.round(crop.baseSell * weightFactor * mutMult * lvlMult));
    }

    // --- OFFLINE PROGRESSION ---
    function applyElapsedOfflineTime(targetState, elapsedMs) {
      if (elapsedMs <= 0) return 0;
      const now = Date.now();
      const safeElapsed = Math.min(elapsedMs, 7 * 24 * 60 * 60 * 1000);

      const wasActiveIds = (targetState.devices || [])
        .filter(d => d.endAt > now - safeElapsed)
        .map(d => d.id);

      let offlineSpeed = 1;
      if (wasActiveIds.includes("sprinkler_basic")) offlineSpeed += 0.35;
      if (wasActiveIds.includes("sprinkler_gold")) offlineSpeed += 0.65;
      if (targetState.weather && targetState.weather.id === "rain") offlineSpeed += 0.20;

      const droneWasActive = wasActiveIds.includes("collector_drone");
      let maturedCount = 0;

      for (let i = 0; i < targetState.unlockedPlots; i++) {
        const p = targetState.plots[i];
        if (!p || !p.cropId) continue;
        const crop = getCrop(p.cropId);
        if (!crop) continue;

        const maxMs = (p.growDuration || crop.growSec) * 1000;
        if (!p.ready) {
          p.progressMs = Math.min(maxMs, (p.progressMs || 0) + safeElapsed * offlineSpeed);
          if (p.progressMs >= maxMs) {
            p.ready = true;
            const stats = rollFruitStatsWithContext(crop, p, targetState.weather.id, wasActiveIds);
            p.weight = stats.weight;
            p.mutations = stats.mutations;
            maturedCount++;
          }
        }

        if (p.ready && droneWasActive) {
          const val = calcFruitPrice(crop, p.weight, p.mutations);
          targetState.coins += val;
          targetState.xp = (targetState.xp || 0) + 15;
          if (val > targetState.bestFruitValue) targetState.bestFruitValue = val;
          if (crop.multi) {
            p.ready = false;
            p.progressMs = 0;
            p.weight = 0;
            p.mutations = [];
            p.giantBoost = 1;
          } else {
            targetState.plots[i] = createEmptyPlot();
          }
        }
      }

      targetState.devices = (targetState.devices || []).filter(d => d.endAt > now);
      targetState.lastTimestamp = now;
      return maturedCount;
    }

    function loadState() {
      const def = createDefaultState();
      try {
        const raw =
          localStorage.getItem(SAVE_KEY) ||
          localStorage.getItem("pocket_garden_save_v10") ||
          localStorage.getItem("pocket_garden_save_v9");

        if (!raw) {
          def.shop.stock = generateSeedStock();
          def.gearShop.stock = generateGearStock();
          return def;
        }

        const parsed = JSON.parse(raw);
        const now = Date.now();
        const st = {
          ...def,
          ...parsed,
          seedInventory: { ...def.seedInventory, ...(parsed.seedInventory || {}) },
          gearInventory: { ...def.gearInventory, ...(parsed.gearInventory || {}) },
          weather: { ...def.weather, ...(parsed.weather || {}) },
          shop: { ...def.shop, ...(parsed.shop || {}) },
          gearShop: { ...def.gearShop, ...(parsed.gearShop || {}) },
          order: parsed.order && getCrop(parsed.order.cropId) ? parsed.order : def.order
        };

        st.plots = Array.from({ length: 15 }, (_, i) => {
          const old = parsed.plots && parsed.plots[i] ? parsed.plots[i] : null;
          if (!old || !old.cropId) return createEmptyPlot();
          const crop = getCrop(old.cropId);
          if (!crop) return createEmptyPlot();

          const durSec = Number(old.growDuration) || crop.growSec;
          const maxMs = durSec * 1000;
          const progMs = Math.max(0, Math.min(maxMs, Number(old.progressMs) || 0));
          const isReady = Boolean(old.ready) || progMs >= maxMs;

          return {
            cropId: crop.id,
            progressMs: isReady ? maxMs : progMs,
            growDuration: durSec,
            ready: isReady,
            weight: Number(old.weight) || 0,
            mutations: Array.isArray(old.mutations) ? old.mutations : [],
            giantBoost: Number(old.giantBoost) || 1
          };
        });

        if (!Array.isArray(st.harvestBag)) st.harvestBag = [];
        if (!Array.isArray(st.devices)) st.devices = [];

        const prevTs = Number(parsed.lastTimestamp) || now;
        const offlineElapsed = Math.max(0, now - prevTs);
        applyElapsedOfflineTime(st, offlineElapsed);

        if (!st.shop.stock || Object.keys(st.shop.stock).length === 0 || now >= st.shop.nextRefreshAt) {
          st.shop.stock = generateSeedStock();
          st.shop.nextRefreshAt = now + SHOP_REFRESH_MS;
        }

        if (!st.gearShop.stock || Object.keys(st.gearShop.stock).length === 0 || now >= st.gearShop.nextRefreshAt) {
          st.gearShop.stock = generateGearStock();
          st.gearShop.nextRefreshAt = now + SHOP_REFRESH_MS;
        }

        ensureValidSelectedSeed(st);
        ensureValidSelectedGear(st);
        return st;
      } catch (e) {
        def.shop.stock = generateSeedStock();
        def.gearShop.stock = generateGearStock();
        return def;
      }
    }

    function ensureValidSelectedSeed(st) {
      if ((st.seedInventory[st.selectedSeed] || 0) <= 0) {
        const available = CROPS.find(c => (st.seedInventory[c.id] || 0) > 0);
        if (available) st.selectedSeed = available.id;
      }
    }

    function ensureValidSelectedGear(st) {
      if ((st.gearInventory[st.selectedGear] || 0) <= 0) {
        const available = GEAR_ITEMS.find(g => (st.gearInventory[g.id] || 0) > 0);
        if (available) st.selectedGear = available.id;
      }
    }

    function saveState() {
      try {
        state.lastTimestamp = Date.now();
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        scheduleLiveScorePublish();
      } catch (e) {}
    }

    let state = loadState();
    let activeTool = "plant";
    let shopFilter = "all";
    let gearFilter = "all";
    let currentView = "garden";
    let lastTickAt = Date.now();

    window.addEventListener("beforeunload", saveState);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        saveState();
      } else {
        const now = Date.now();
        const awayMs = Math.max(0, now - (state.lastTimestamp || now));
        if (awayMs > 1500) {
          const matured = applyElapsedOfflineTime(state, awayMs);
          if (matured > 0) showToast(`Созрело за время отсутствия: ${matured}`);
          saveState();
        }
        lastTickAt = now;
      }
    });

    // --- TOAST & MODALS ---
    let toastTimer = null;
    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1900);

    function openModal(title, htmlBody, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = htmlBody;
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      buttons.forEach(btn => {
        const b = document.createElement("button");
        b.className = btn.className || "btn-secondary";
        b.textContent = btn.label;
        b.onclick = () => {
          closeModal();
          if (btn.onClick) btn.onClick();
        };
        actions.appendChild(b);
      });
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    // --- ORDER INFO MODAL ---
    document.getElementById("orderBannerBtn").onclick = () => {

      openModal(

        `Соберите с грядок: <strong>${crop.name} (${ord.progress}/${ord.target} шт.)</strong>.<br><br>` +
        `Награда за выполнение заказа:<br>` +
        `• Бонус <strong>+${formatNumber(bonusCoins)} монет</strong><br>` +
        `• Опыт садовода <strong>+45 XP</strong> (+5% к продаже за каждый уровень)`,
        [
          {
            label: "Сменить заказ",
            className: "btn-secondary",
            onClick: () => {
              state.order = generateOrder(state);

    // --- SEED PICKER SHEET ---
    function openSeedPicker() {

          </div>

        document.getElementById("goToShopFromPicker").onclick = () => {

          switchView("shop");
        };
      } else {
        ownedCrops.forEach(crop => {
          const qty = state.seedInventory[crop.id] || 0;

          const card = document.createElement("div");
          card.className = "item-card" + (isSelected ? " selected-card" : "");

                  ${crop.growSec}с • ${crop.multi ? "Многоразовое" : "Одноразовое"} • В сумке: <strong>${qty} шт.</strong>
                </div>
              </div>
            </div>
            <button class="buy-btn">${isSelected ? "Активно" : "Выбрать"}</button>

          card.querySelector(".item-thumb").appendChild(

          card.onclick = () => {
            state.selectedSeed = crop.id;
            activeTool = "plant";
            updateToolButtons();

            closeSeedPicker();

          };

          list.appendChild(card);

      document.getElementById("seedPickerBackdrop").classList.add("open");

    function closeSeedPicker() {
