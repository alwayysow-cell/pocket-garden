<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pocket Garden</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e0d;
      --surface: #121715;
      --surface-2: #181f1c;
      --surface-3: #1f2824;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f1f5f3;
      --muted: #8a9992;
      --accent: #2ea877;
      --accent-soft: rgba(46, 168, 119, 0.16);
      --gold: #d4a348;
      --danger: #cf5656;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    .app {
      max-width: 520px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
      gap: 8px;
    }

    /* HEADER */
    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-record {
      font-size: 10px;
      color: var(--gold);
      font-weight: 600;
      margin-top: 1px;
    }

    .stats-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .weather-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5d1;
    }

    .weather-bar {
      width: 20px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .weather-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transition: width 0.4s linear;
    }

    .coins-badge {
      background: var(--surface-2);
      border: 1px solid rgba(212, 163, 72, 0.35);
      color: #f0cf8e;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    /* MAIN VIEWPORT */
    .views {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .view.active {
      display: flex;
    }

    /* GARDEN VIEW */
    .garden-view {
      gap: 8px;
    }

    .canvas-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #101513;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    .garden-overlay-top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
      z-index: 5;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .hud-chip {
      background: rgba(14, 19, 17, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-strong);
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #dce5e1;
    }

    .hud-chip.clickable {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hud-chip.clickable:active {
      opacity: 0.8;
    }

    .active-devices-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
    }

    .device-chip {
      background: rgba(14, 19, 17, 0.88);
      border: 1px solid rgba(46, 168, 119, 0.4);
      color: #bce8d4;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* 3-BUTTON TOOLBAR */
    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .tool-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .tool-btn:active {
      background: var(--surface-2);
    }

    .tool-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #c8f3df;
    }

    .tool-btn.danger.active {
      background: rgba(207, 86, 86, 0.16);
      border-color: var(--danger);
      color: #f5c2c2;
    }

    .tool-btn .icon {
      font-size: 16px;
      line-height: 1;
    }

    .tool-btn .sub {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      max-width: 96px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-btn.active .sub {
      color: #8fd9b8;
    }

    /* SUBPAGES */
    .subpage {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .timer-badge {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 11px;
      color: #b4d4c6;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    .filter-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--text);
    }

    .scroll-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 2px;
    }

    .item-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-card.out-of-stock {
      opacity: 0.45;
    }

    .item-card.selected-card {
      border-color: var(--accent);
      background: rgba(46, 168, 119, 0.1);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .item-emoji {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .item-info {
      min-width: 0;
    }

    .item-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .item-name {
      font-size: 13px;
      font-weight: 700;
    }

    .tag {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .rarity-common { background: rgba(148, 163, 184, 0.14); color: #b8c4ce; }
    .rarity-uncommon { background: rgba(56, 189, 248, 0.14); color: #7cc4e4; }
    .rarity-rare { background: rgba(168, 85, 247, 0.16); color: #c9a7eb; }
    .rarity-epic { background: rgba(236, 72, 153, 0.16); color: #e89ec2; }
    .rarity-legendary { background: rgba(212, 163, 72, 0.18); color: #ebd096; }
    .rarity-mythical { background: rgba(207, 86, 86, 0.2); color: #eba3a3; }

    .item-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.35;
    }

    .buy-btn {
      background: var(--accent);
      border: none;
      color: #07140e;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 11px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .buy-btn:disabled {
      background: var(--surface-3);
      color: #5c6b64;
      cursor: not-allowed;
    }

    .sell-all-btn {
      background: var(--gold);
      border: none;
      color: #140f05;
      font-weight: 700;
      font-size: 12px;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
    }

    .sell-all-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 36px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* BOTTOM NAVIGATION */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      flex-shrink: 0;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .nav-btn .nav-icon {
      font-size: 16px;
      line-height: 1;
    }

    .nav-btn.active {
      background: var(--surface-3);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--border-strong);
    }

    .badge-dot {
      position: absolute;
      top: 4px;
      right: 14px;
      background: var(--gold);
      color: #120d04;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 6px;
      display: none;
    }

    .badge-dot.visible {
      display: inline-block;
    }

    /* MODALS & PICKER SHEETS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-backdrop.sheet {
      align-items: flex-end;
      padding: 0;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-backdrop.sheet .modal {
      max-width: 520px;
      border-radius: 18px 18px 0 0;
      border-bottom: none;
      max-height: 74dvh;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      font-size: 13px;
      color: #cbd5d1;
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-danger {
      background: var(--danger);
      border: none;
      color: #fff;
      padding: 8px 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 200;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="profile">
        <div id="avatarBox" class="avatar">🌱</div>
        <div class="profile-info">
          <div id="playerName" class="profile-name">Садовод</div>
          <div id="bestRecord" class="profile-record">🏆 Рекорд: 0 🪙</div>
        </div>
      </div>

      <div class="stats-right">
        <div class="weather-pill">
          <span id="weatherIcon">☀️</span>
          <span id="weatherName">Ясно</span>
          <div class="weather-bar">
            <div id="weatherProgress" class="weather-bar-fill"></div>
          </div>
        </div>
        <div id="coinsDisplay" class="coins-badge">60 🪙</div>
      </div>
    </header>

    <!-- MAIN VIEWS -->
    <main class="views">
      <!-- 1. GARDEN VIEW -->
      <section id="view-garden" class="view garden-view active">
        <div id="canvasContainer" class="canvas-container">
          <div class="garden-overlay-top">
            <div class="hud-row">
              <span id="plotCountLabel" class="hud-chip">Участок: 9/15</span>
              <button id="selectedSeedHud" class="hud-chip clickable">
                <span>🥕 Морковь: 3</span>
                <span style="font-size:9px;opacity:0.7;">▼</span>
              </button>
              <span id="readyCountLabel" class="hud-chip">Созрело: 0</span>
            </div>
            <div id="activeDevicesStrip" class="active-devices-strip"></div>
          </div>
          <canvas id="gardenCanvas"></canvas>
        </div>

        <!-- 3-BUTTON TOOLBAR (БЕЗ КНОПКИ СОБРАТЬ, С МЕНЮ СНАРЯЖЕНИЯ) -->
        <div class="toolbar">
          <button id="toolPlant" class="tool-btn active">
            <span class="icon">🌱</span>
            <span>Посадка</span>
            <span id="seedSub" class="sub">Морковь (3)</span>
          </button>

          <button id="toolGear" class="tool-btn">
            <span class="icon">🧰</span>
            <span>Снаряжение</span>
            <span id="gearSub" class="sub">Выбрать ▾</span>
          </button>

          <button id="toolShovel" class="tool-btn danger">
            <span class="icon">🪏</span>
            <span>Лопата</span>
            <span class="sub">Удалить</span>
          </button>
        </div>
      </section>

      <!-- 2. SEED SHOP VIEW -->
      <section id="view-shop" class="view subpage">
        <div class="panel-header">
          <div class="panel-title">Лавка семян</div>
          <div class="timer-badge">Завоз: <span id="shopTimer">05:00</span></div>
        </div>

        <div class="filters" id="seedFilters">
          <button class="filter-btn active" data-filter="all">Все (24)</button>
          <button class="filter-btn" data-filter="common">Базовые</button>
          <button class="filter-btn" data-filter="rare">Редкие</button>
          <button class="filter-btn" data-filter="epic">Эпик</button>
          <button class="filter-btn" data-filter="legendary">Легенд.+Миф</button>
        </div>

        <div id="shopList" class="scroll-list"></div>
      </section>

      <!-- 3. GEAR SHOP VIEW (КАК ЛАВКА СЕМЯН СО СТОКОМ РАЗ В 5 МИН) -->
      <section id="view-gear" class="view subpage">
        <div class="panel-header">
          <div class="panel-title">Лавка снаряжения</div>
          <div class="timer-badge">Завоз: <span id="gearShopTimer">05:00</span></div>
        </div>

        <div class="filters" id="gearFilters">
          <button class="filter-btn active" data-gfilter="all">Всё</button>
          <button class="filter-btn" data-gfilter="growth">Полив и рост</button>
          <button class="filter-btn" data-gfilter="mutation">Мутации</button>
          <button class="filter-btn" data-gfilter="auto">Авто и участок</button>
        </div>

        <div id="gearList" class="scroll-list"></div>
      </section>

      <!-- 4. BACKPACK VIEW -->
      <section id="view-bag" class="view subpage">
        <div class="panel-header">
          <div class="panel-title">Рюкзак урожая</div>
          <button id="btnSellAll" class="sell-all-btn" disabled>Продать всё (0 🪙)</button>
        </div>
        <div id="bagList" class="scroll-list"></div>
      </section>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="garden">
        <span class="nav-icon">🏡</span>
        <span>Сад</span>
      </button>
      <button class="nav-btn" data-view="shop">
        <span class="nav-icon">🌱</span>
        <span>Семена</span>
      </button>
      <button class="nav-btn" data-view="gear">
        <span class="nav-icon">🧰</span>
        <span>Снаряж.</span>
        <span id="gearBadge" class="badge-dot">0</span>
      </button>
      <button class="nav-btn" data-view="bag">
        <span class="nav-icon">🎒</span>
        <span>Рюкзак</span>
        <span id="bagBadge" class="badge-dot">0</span>
      </button>
    </nav>
  </div>

  <!-- GENERAL MODAL -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div id="modalTitle" class="modal-title">Инфо</div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <!-- SEED PICKER SHEET -->
  <div id="seedPickerBackdrop" class="modal-backdrop sheet">
    <div class="modal">
      <div class="modal-title">
        <span>Выбор семян из сумки</span>
        <button id="closeSeedPicker" class="btn-secondary" style="padding:4px 9px;">✕</button>
      </div>
      <div id="seedPickerList" class="scroll-list" style="max-height:52dvh;"></div>
    </div>
  </div>

  <!-- GEAR PICKER SHEET -->
  <div id="gearPickerBackdrop" class="modal-backdrop sheet">
    <div class="modal">
      <div class="modal-title">
        <span>Снаряжение в сумке</span>
        <button id="closeGearPicker" class="btn-secondary" style="padding:4px 9px;">✕</button>
      </div>
      <div id="gearPickerList" class="scroll-list" style="max-height:52dvh;"></div>
    </div>
  </div>

  <script>
    // --- TELEGRAM INIT ---
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = "light") {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === "success" || type === "warning" || type === "error") {
            tg.HapticFeedback.notificationOccurred(type);
          } else {
            tg.HapticFeedback.impactOccurred(type);
          }
        }
      } catch (e) {}
    }

    // --- 24 CROPS & REBALANCED ECONOMY ---

    // --- HELPERS ---
    function getCrop(id) {

    function createEmptyPlot() {

    function generateSeedStock() {
      const stock = {};
      CROPS.forEach(c => {
        stock[c.id] = Math.random() <= c.stockChance ? Math.floor(Math.random() * c.maxStock) + 1 : 0;
      });
      if (!stock.carrot || stock.carrot < 3) stock.carrot = 5;
      return stock;
    }

    function generateGearStock() {
      const stock = {};
      GEAR_ITEMS.forEach(g => {
        if (g.id === "expand_plot") {
          stock[g.id] = 1;
        } else {
          stock[g.id] = Math.random() <= g.stockChance ? Math.floor(Math.random() * g.maxStock) + 1 : 0;
        }
      });
      if (!stock.watering_can || stock.watering_can < 2) stock.watering_can = 3;
      return stock;
    }

    // Rebalanced multipliers
    function rollFruitStatsWithContext(crop, plot, weatherId, activeDeviceIds) {
      const hasGoldSprinkler = activeDeviceIds.includes("sprinkler_gold");
      const hasBasicSprinkler = activeDeviceIds.includes("sprinkler_basic");
      const hasPrism = activeDeviceIds.includes("star_prism");
      const hasRod = activeDeviceIds.includes("lightning_rod");

      const sizeBoost = (hasGoldSprinkler ? 1.35 : hasBasicSprinkler ? 1.2 : 1) * (plot.giantBoost || 1);
      const isGiantRoll = Math.random() < 0.12;
      const rawRatio = Math.pow(Math.random(), isGiantRoll ? 0.6 : 1.7);
      const weight = Number(((crop.minKg + (crop.maxKg - crop.minKg) * rawRatio) * sizeBoost).toFixed(2));

      const mutations = [];
      const goldMult = hasGoldSprinkler ? 3 : 1;
      const prismMult = hasPrism ? 3 : 1;
      const rodMult = hasRod ? 3 : 1;

      if (Math.random() < 0.012 * prismMult) {
        mutations.push({ id: "rainbow", name: "Rainbow", mult: 10, color: "#e89ec2" });
      } else if (Math.random() < 0.04 * goldMult) {
        mutations.push({ id: "gold", name: "Gold", mult: 3, color: "#ebd096" });
      }

      if (weatherId === "rain" && Math.random() < 0.5) {
        mutations.push({ id: "wet", name: "Wet", mult: 1.5, color: "#7cc4e4" });
      }
      if (weatherId === "frost" && Math.random() < 0.4) {
        mutations.push({ id: "frozen", name: "Frozen", mult: 5, color: "#9bd8f0" });
      }
      if (weatherId === "storm" && Math.random() < 0.18 * rodMult) {
        mutations.push({ id: "shocked", name: "Shocked", mult: 20, color: "#c9a7eb" });
      }
      if (weatherId === "meteor" && Math.random() < 0.14 * prismMult) {
        mutations.push({ id: "starlit", name: "Starlit", mult: 35, color: "#f5dc84" });
      }

      return { weight, mutations };
    }

    function calcFruitPrice(crop, weight, mutations) {
      const avgKg = (crop.minKg + crop.maxKg) / 2;
      const weightFactor = Math.max(0.75, Math.min(4.5, weight / avgKg));
      const mutMult = mutations.reduce((acc, m) => acc * m.mult, 1);
      return Math.max(1, Math.round(crop.baseSell * weightFactor * mutMult));
    }

    // --- OFFLINE PROGRESSION ---
    function applyElapsedOfflineTime(targetState, elapsedMs) {
      if (elapsedMs <= 0) return 0;
      const now = Date.now();
      const safeElapsed = Math.min(elapsedMs, 7 * 24 * 60 * 60 * 1000);

      const wasActiveIds = (targetState.devices || [])
        .filter(d => d.endAt > now - safeElapsed)
        .map(d => d.id);

      let offlineSpeed = 1;
      if (wasActiveIds.includes("sprinkler_basic")) offlineSpeed += 0.35;
      if (wasActiveIds.includes("sprinkler_gold")) offlineSpeed += 0.65;
      if (targetState.weather && targetState.weather.id === "rain") offlineSpeed += 0.20;

      const droneWasActive = wasActiveIds.includes("collector_drone");
      let maturedCount = 0;

      for (let i = 0; i < targetState.unlockedPlots; i++) {
        const p = targetState.plots[i];
        if (!p || !p.cropId) continue;
        const crop = getCrop(p.cropId);
        if (!crop) continue;

        const maxMs = (p.growDuration || crop.growSec) * 1000;
        if (!p.ready) {
          p.progressMs = Math.min(maxMs, (p.progressMs || 0) + safeElapsed * offlineSpeed);
          if (p.progressMs >= maxMs) {
            p.ready = true;
            const stats = rollFruitStatsWithContext(crop, p, targetState.weather.id, wasActiveIds);
            p.weight = stats.weight;
            p.mutations = stats.mutations;
            maturedCount++;
          }
        }

        if (p.ready && droneWasActive) {
          const val = calcFruitPrice(crop, p.weight, p.mutations);
          targetState.coins += val;
          if (val > targetState.bestFruitValue) targetState.bestFruitValue = val;
          if (crop.multi) {
            p.ready = false;
            p.progressMs = 0;
            p.weight = 0;
            p.mutations = [];
            p.giantBoost = 1;
          } else {
            targetState.plots[i] = createEmptyPlot();
          }
        }
      }

      targetState.devices = (targetState.devices || []).filter(d => d.endAt > now);
      targetState.lastTimestamp = now;
      return maturedCount;
    }

    function loadState() {
      const def = createDefaultState();
      try {
        const raw =
          localStorage.getItem(SAVE_KEY) ||
          localStorage.getItem("pocket_garden_save_v6") ||
          localStorage.getItem("pocket_garden_save_v5");

        if (!raw) {
          def.shop.stock = generateSeedStock();
          def.gearShop.stock = generateGearStock();
          return def;
        }

        const parsed = JSON.parse(raw);
        const now = Date.now();
        const st = {
          ...def,
          ...parsed,
          seedInventory: { ...def.seedInventory, ...(parsed.seedInventory || {}) },
          gearInventory: { ...def.gearInventory, ...(parsed.gearInventory || {}) },
          weather: { ...def.weather, ...(parsed.weather || {}) },
          shop: { ...def.shop, ...(parsed.shop || {}) },
          gearShop: { ...def.gearShop, ...(parsed.gearShop || {}) }
        };

        st.plots = Array.from({ length: 15 }, (_, i) => {
          const old = parsed.plots && parsed.plots[i] ? parsed.plots[i] : null;
          if (!old || !old.cropId) return createEmptyPlot();
          const crop = getCrop(old.cropId);
          if (!crop) return createEmptyPlot();

          const durSec = Number(old.growDuration) || crop.growSec;
          const maxMs = durSec * 1000;
          const progMs = Math.max(0, Math.min(maxMs, Number(old.progressMs) || 0));
          const isReady = Boolean(old.ready) || progMs >= maxMs;

          return {
            cropId: crop.id,
            progressMs: isReady ? maxMs : progMs,
            growDuration: durSec,
            ready: isReady,
            weight: Number(old.weight) || 0,
            mutations: Array.isArray(old.mutations) ? old.mutations : [],
            giantBoost: Number(old.giantBoost) || 1
          };
        });

        if (!Array.isArray(st.harvestBag)) st.harvestBag = [];
        if (!Array.isArray(st.devices)) st.devices = [];

        const prevTs = Number(parsed.lastTimestamp) || now;
        const offlineElapsed = Math.max(0, now - prevTs);
        applyElapsedOfflineTime(st, offlineElapsed);

        if (!st.shop.stock || Object.keys(st.shop.stock).length === 0 || now >= st.shop.nextRefreshAt) {
          st.shop.stock = generateSeedStock();
          st.shop.nextRefreshAt = now + SHOP_REFRESH_MS;
        }

        if (!st.gearShop.stock || Object.keys(st.gearShop.stock).length === 0 || now >= st.gearShop.nextRefreshAt) {
          st.gearShop.stock = generateGearStock();
          st.gearShop.nextRefreshAt = now + SHOP_REFRESH_MS;
        }

        ensureValidSelectedSeed(st);
        ensureValidSelectedGear(st);
        return st;
      } catch (e) {
        def.shop.stock = generateSeedStock();
        def.gearShop.stock = generateGearStock();
        return def;
      }
    }

    function ensureValidSelectedSeed(st) {
      if ((st.seedInventory[st.selectedSeed] || 0) <= 0) {
        const available = CROPS.find(c => (st.seedInventory[c.id] || 0) > 0);
        if (available) st.selectedSeed = available.id;
      }
    }

    function ensureValidSelectedGear(st) {
      if ((st.gearInventory[st.selectedGear] || 0) <= 0) {
        const available = GEAR_ITEMS.find(g => (st.gearInventory[g.id] || 0) > 0);
        if (available) st.selectedGear = available.id;
      }
    }

    function saveState() {
      try {
        state.lastTimestamp = Date.now();
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    let gearFilter = "all";
    let currentView = "garden";

    window.addEventListener("beforeunload", saveState);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        saveState();
      } else {
        const now = Date.now();
        const awayMs = Math.max(0, now - (state.lastTimestamp || now));
        if (awayMs > 1500) {
          const matured = applyElapsedOfflineTime(state, awayMs);
          if (matured > 0) showToast(`Созрело за время отсутствия: ${matured}`);
          saveState();
        }
        lastTickAt = now;
      }
    });

      if (user) {

        nameEl.textContent = fullName;
        const initials = (user.first_name ? user.first_name[0] : "С").toUpperCase();
        avatarEl.textContent = initials;

        if (user.photo_url) {
          const img = document.createElement("img");
          img.src = user.photo_url;
          img.alt = fullName;
          img.onload = () => {
            avatarEl.innerHTML = "";
            avatarEl.appendChild(img);
          };
          img.onerror = () => {
            avatarEl.textContent = initials;
          };
        }
      }
    }

    // --- TOAST & MODALS ---
    let toastTimer = null;
    function showToast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1900);
    }

    function openModal(title, htmlBody, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = htmlBody;
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      buttons.forEach(btn => {
        const b = document.createElement("button");
        b.className = btn.className || "btn-secondary";
        b.textContent = btn.label;
        b.onclick = () => {
          closeModal();
          if (btn.onClick) btn.onClick();
        };
        actions.appendChild(b);
      });
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    // --- SEED PICKER SHEET ---

        `;

          switchView("shop");
        };
      } else {
        ownedCrops.forEach(crop => {
          const qty = state.seedInventory[crop.id] || 0;
          const isSelected = state.selectedSeed === crop.id && activeTool === "plant";

          card.className = "item-card" + (isSelected ? " selected-card" : "");
          card.style.cursor = "pointer";
          card.innerHTML = `
            <div class="item-left">

              <div class="item-info">
                <div class="item-title-row">
                  <span class="item-name">${crop.name}</span>

                </div>
                <div class="item-meta">

                </div>
              </div>
            </div>
            <button class="buy-btn">${isSelected ? "Активно" : "Выбрать"}</button>
          `;

          card.onclick = () => {
            state.selectedSeed = crop.id;
            activeTool = "plant";
            updateToolButtons();

            closeSeedPicker();

    function closeSeedPicker() {
      document.getElementById("seedPickerBackdrop").classList.remove("open");

    document.getElementById("closeSeedPicker").onclick = closeSeedPicker;
    document.getElementById("seedPickerBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "seedPickerBackdrop") closeSeedPicker();

    // --- GEAR PICKER SHEET (ВМЕСТО КНОПКИ С ЛЕЙКОЙ) ---
    function openGearPicker() {
      const list = document.getElementById("gearPickerList");
      list.innerHTML = "";

      const ownedGear = GEAR_ITEMS.filter(g => (state.gearInventory[g.id] || 0) > 0);

      if (ownedGear.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            В сумке пока нет купленного снаряжения.<br><br>
            <button id="goToGearShopFromPicker" class="buy-btn">Открыть лавку снаряжения</button>
          </div>
        `;
        document.getElementById("goToGearShopFromPicker").onclick = () => {
          closeGearPicker();
          switchView("gear");
        };
      } else {
        ownedGear.forEach(item => {
          const qty = state.gearInventory[item.id] || 0;
          const isPlotTool = item.mode === "plot";
          const isSelected = isPlotTool && state.selectedGear === item.id && activeTool === "gear";

          const card = document.createElement("div");
          card.className = "item-card" + (isSelected ? " selected-card" : "");
          card.style.cursor = "pointer";
          card.innerHTML = `
            <div class="item-left">
              <div class="item-emoji">${item.emoji}</div>
              <div class="item-info">
                <div class="item-title-row">
                  <span class="item-name">${item.name}</span>
                  <span class="tag rarity-${item.rarity}">${qty} шт.</span>
                </div>
                <div class="item-meta">${item.desc}</div>
              </div>
            </div>
            <button class="buy-btn">${isPlotTool ? (isSelected ? "В руке" : "Взять") : "Включить"}</button>
          `;

          card.onclick = () => {
            if (isPlotTool) {
              state.selectedGear = item.id;
              activeTool = "gear";
              updateToolButtons();
              saveState();
              closeGearPicker();
              haptic("light");
              showToast(`Взято в руку: ${item.emoji} ${item.name} (тапни по грядке)`);
            } else if (item.mode === "garden") {
              if ((state.gearInventory[item.id] || 0) <= 0) return;
              state.gearInventory[item.id]--;
              const existing = state.devices.find(d => d.id === item.id);
              if (existing) {
                existing.endAt = Math.max(existing.endAt, Date.now()) + item.durationSec * 1000;
              } else {
                state.devices.push({ id: item.id, endAt: Date.now() + item.durationSec * 1000 });
              }
              ensureValidSelectedGear(state);
              saveState();
              closeGearPicker();
              haptic("success");
              showToast(`${item.emoji} ${item.name} активирован в саду!`);

          };

          list.appendChild(card);
        });

      document.getElementById("gearPickerBackdrop").classList.add("open");

    function closeGearPicker() {
      document.getElementById("gearPickerBackdrop").classList.remove("open");
    }

    document.getElementById("closeGearPicker").onclick = closeGearPicker;
    document.getElementById("gearPickerBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "gearPickerBackdrop") closeGearPicker();
    });

    // --- SPEED & FORMATTERS ---
    function hasActiveDevice(id) {
      const now = Date.now();
      return state.devices.some(d => d.id === id && d.endAt > now);
    }

    function getSpeedMultiplier() {
      let mult = 1;
      if (hasActiveDevice("sprinkler_basic")) mult += 0.35;
      if (hasActiveDevice("sprinkler_gold")) mult += 0.65;
      if (state.weather.id === "rain") mult += 0.20;
      return mult;
    }

    function formatNumber(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e4) return (n / 1e3).toFixed(1) + "K";
      return Math.floor(n).toLocaleString("ru-RU");
    }

    function formatTimeLeft(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const m = String(Math.floor(totalSec / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    // --- WEATHER ---
    function pickRandomWeather(currentId) {
      const pool = WEATHERS.filter(w => w.id !== currentId);
      const total = pool.reduce((s, w) => s + w.weight, 0);
      let r = Math.random() * total;
      for (const w of pool) {
        if (r < w.weight) return w;
        r -= w.weight;
      }
      return pool[0];
    }

    function updateWeather(dt) {
      state.weather.remainingMs -= dt;
      if (state.weather.remainingMs <= 0) {
        const next = pickRandomWeather(state.weather.id);
        const nextDur = (40 + Math.floor(Math.random() * 31)) * 1000;
        state.weather = { id: next.id, remainingMs: nextDur, durationMs: nextDur };
        showToast(`${next.icon} Погода: ${next.name}`);
      }
      const wObj = WEATHERS.find(w => w.id === state.weather.id) || WEATHERS[0];
      document.getElementById("weatherIcon").textContent = wObj.icon;
      document.getElementById("weatherName").textContent = wObj.name;
      const leftPct = Math.max(0, Math.min(100, (state.weather.remainingMs / state.weather.durationMs) * 100));
      document.getElementById("weatherProgress").style.width = leftPct + "%";
    }

    // --- GAME TICK ---
    let saveCounter = 0;
    function gameTick() {
      const now = Date.now();
      const dt = Math.max(0, Math.min(1000, now - lastTickAt));
      lastTickAt = now;

      updateWeather(dt);

      // Обновление лавки семян (5 мин)
      if (now >= state.shop.nextRefreshAt) {
        state.shop.stock = generateSeedStock();
        state.shop.nextRefreshAt = now + SHOP_REFRESH_MS;
        showToast("Завоз в лавке семян!");
        if (currentView === "shop") renderShop();
      }
      document.getElementById("shopTimer").textContent = formatTimeLeft(state.shop.nextRefreshAt - now);

      // Обновление лавки снаряжения (5 мин)
      if (now >= state.gearShop.nextRefreshAt) {
        state.gearShop.stock = generateGearStock();
        state.gearShop.nextRefreshAt = now + SHOP_REFRESH_MS;
        showToast("Завоз в лавке снаряжения!");
        if (currentView === "gear") renderGear();
      }
      document.getElementById("gearShopTimer").textContent = formatTimeLeft(state.gearShop.nextRefreshAt - now);

      // Активные устройства
      const beforeDev = state.devices.length;
      state.devices = state.devices.filter(d => d.endAt > now);
      if (state.devices.length !== beforeDev && currentView === "gear") {
        renderGear();
      }

      // Рост растений
      const speedMult = getSpeedMultiplier();
      const activeIds = state.devices.map(d => d.id);
      let readyCount = 0;

      for (let i = 0; i < state.unlockedPlots; i++) {
        const p = state.plots[i];
        if (!p || !p.cropId) continue;
        const crop = getCrop(p.cropId);
        if (!crop) continue;

        const maxMs = p.growDuration * 1000;
        if (!p.ready) {
          p.progressMs = Math.min(maxMs, p.progressMs + dt * speedMult);
          if (p.progressMs >= maxMs) {
            p.ready = true;
            const stats = rollFruitStatsWithContext(crop, p, state.weather.id, activeIds);
            p.weight = stats.weight;
            p.mutations = stats.mutations;
          }
        }

        if (p.ready) {
          if (hasActiveDevice("collector_drone")) {
            const val = calcFruitPrice(crop, p.weight, p.mutations);
            state.coins += val;
            if (val > state.bestFruitValue) state.bestFruitValue = val;
            if (crop.multi) {
              p.ready = false;
              p.progressMs = 0;
              p.weight = 0;
              p.mutations = [];
              p.giantBoost = 1;
            } else {
              state.plots[i] = createEmptyPlot();
            }
          } else {
            readyCount++;
          }
        }
      }

      saveCounter++;
      if (saveCounter >= 4) {
        saveCounter = 0;
        saveState();
      }

      updateHUD(readyCount, now);
    }

    function updateHUD(readyCount, now) {
      document.getElementById("coinsDisplay").textContent = `${formatNumber(state.coins)} 🪙`;
      document.getElementById("bestRecord").textContent = `🏆 Рекорд: ${formatNumber(state.bestFruitValue)} 🪙`;
      document.getElementById("plotCountLabel").textContent = `Участок: ${state.unlockedPlots}/15`;
      document.getElementById("readyCountLabel").textContent = `Созрело: ${readyCount}`;

      // Кнопка Посадка
      const selCrop = getCrop(state.selectedSeed);
      const selQty = state.seedInventory[state.selectedSeed] || 0;
      document.getElementById("seedSub").textContent = selCrop && selQty > 0 ? `${selCrop.name} (${selQty})` : "Выбрать ▾";

      const hudSeed = document.getElementById("selectedSeedHud");
      if (selCrop && selQty > 0) {
        hudSeed.innerHTML = `<span>${selCrop.emoji} ${selCrop.name}: ${selQty}</span><span style="font-size:9px;opacity:0.7;">▼</span>`;
      } else {
        hudSeed.innerHTML = `<span>Выбрать семена</span><span style="font-size:9px;opacity:0.7;">▼</span>`;
      }

      // Кнопка Снаряжение
      const totalGearOwned = Object.values(state.gearInventory).reduce((s, v) => s + (v || 0), 0);
      const selGearObj = getGear(state.selectedGear);
      const selGearQty = state.gearInventory[state.selectedGear] || 0;
      if (activeTool === "gear" && selGearObj && selGearQty > 0) {
        document.getElementById("gearSub").textContent = `${selGearObj.shortName} (${selGearQty})`;
      } else {
        document.getElementById("gearSub").textContent = totalGearOwned > 0 ? `Сумка: ${totalGearOwned} ▾` : "Пусто ▾";
      }

      // Полоска активных устройств в саду
      const strip = document.getElementById("activeDevicesStrip");
      if (state.devices.length === 0) {
        if (strip.innerHTML !== "") strip.innerHTML = "";
      } else {
        strip.innerHTML = state.devices
          .map(d => {
            const g = getGear(d.id);
            if (!g) return "";
            return `<div class="device-chip">${g.emoji} ${g.shortName} • ${formatTimeLeft(d.endAt - now)}</div>`;
          })
          .join("");
      }

      const bagBadge = document.getElementById("bagBadge");
      bagBadge.textContent = state.harvestBag.length;
      bagBadge.classList.toggle("visible", state.harvestBag.length > 0);

      const gearBadge = document.getElementById("gearBadge");
      gearBadge.textContent = totalGearOwned;
      gearBadge.classList.toggle("visible", totalGearOwned > 0);
    }

    // --- PLOT INTERACTIONS ---
    function harvestPlot(idx) {
      const p = state.plots[idx];
      if (!p || !p.cropId || !p.ready) return false;
      const crop = getCrop(p.cropId);
      const value = calcFruitPrice(crop, p.weight, p.mutations);

      state.harvestBag.push({
        uid: Date.now() + Math.random(),
        cropId: crop.id,
        name: crop.name,
        emoji: crop.emoji,
        weight: p.weight,
        mutations: p.mutations,
        value
      });

      if (value > state.bestFruitValue) state.bestFruitValue = value;

      const harvestedWeight = p.weight;
      const harvestedMuts = [...p.mutations];

      if (crop.multi) {
        p.ready = false;
        p.progressMs = 0;
        p.weight = 0;
        p.mutations = [];
        p.giantBoost = 1;
      } else {
        state.plots[idx] = createEmptyPlot();
      }

      haptic("success");
      const mutText = harvestedMuts.length ? ` [${harvestedMuts.map(m => m.name).join("+")}]` : "";
      showToast(`${crop.emoji} ${crop.name} (${harvestedWeight} кг)${mutText}`);
      return true;
    }

    function handlePlotTap(idx) {
      if (idx < 0 || idx >= state.unlockedPlots) return;
      const p = state.plots[idx];

      // 1. Лопата
      if (activeTool === "shovel") {
        if (!p.cropId) {
          showToast("Эта грядка пустая");
          return;
        }
        const crop = getCrop(p.cropId);
        const refund = Math.floor(crop.cost * 0.25);
        haptic("warning");
        openModal(
          "Удалить растение?",
          `Выкопать <strong>${crop.emoji} ${crop.name}</strong> с грядки №${idx + 1}?<br>Компенсация 25%: <strong>+${formatNumber(refund)} 🪙</strong>.`,
          [
            { label: "Отмена", className: "btn-secondary" },
            {
              label: `Удалить (+${formatNumber(refund)} 🪙)`,
              className: "btn-danger",
              onClick: () => {
                state.coins += refund;
                state.plots[idx] = createEmptyPlot();
                saveState();
                haptic("medium");
                showToast(`Удалено (+${formatNumber(refund)} 🪙)`);
              }
            }
          ]
        );
        return;
      }

      // 2. Сбор созревшего урожая по тапу на грядку
      if (p.cropId && p.ready) {
        harvestPlot(idx);
        saveState();
        return;
      }

      // 3. Применение выбранного снаряжения на грядку
      if (activeTool === "gear") {
        const gItem = getGear(state.selectedGear);
        const gQty = state.gearInventory[state.selectedGear] || 0;
        if (!gItem || gQty <= 0 || gItem.mode !== "plot") {
          openGearPicker();
          return;
        }
        if (!p.cropId) {
          showToast("Сначала посади растение на грядку");
          return;
        }

        state.gearInventory[gItem.id]--;
        const maxMs = p.growDuration * 1000;

        if (gItem.id === "watering_can") {
          p.progressMs = Math.min(maxMs, p.progressMs + maxMs * 0.40);
          showToast("🚿 Полито (+40% роста)");
        } else if (gItem.id === "growth_fertilizer") {
          p.progressMs = Math.min(maxMs, p.progressMs + maxMs * 0.75);
          p.giantBoost = Number((p.giantBoost * 1.25).toFixed(2));
          showToast("🌿 Удобрено (+75% роста и +25% вес)");
        } else if (gItem.id === "giant_elixir") {
          p.giantBoost = Number((p.giantBoost * (2.5 + Math.random())).toFixed(2));
          showToast("🧪 Эликсир гиганта применён!");
        }

        if ((state.gearInventory[gItem.id] || 0) <= 0) {
          ensureValidSelectedGear(state);
          if ((state.gearInventory[state.selectedGear] || 0) <= 0) {
            activeTool = "plant";
            updateToolButtons();
          }
        }
        haptic("light");
        saveState();
        return;
      }

      // 4. Посадка на пустую грядку
      if (!p.cropId) {
        ensureValidSelectedSeed(state);
        const qty = state.seedInventory[state.selectedSeed] || 0;
        if (qty <= 0) {
          openSeedPicker();
          return;
        }
        const crop = getCrop(state.selectedSeed);
        state.seedInventory[crop.id]--;
        state.plots[idx] = {
          cropId: crop.id,
          progressMs: 0,
          growDuration: crop.growSec,
          ready: false,
          weight: 0,
          mutations: [],
          giantBoost: 1
        };
        ensureValidSelectedSeed(state);
        haptic("light");
        saveState();
        return;
      }

      // 5. Инспектор грядки
      const crop = getCrop(p.cropId);
      const pct = Math.min(99, Math.floor((p.progressMs / (p.growDuration * 1000)) * 100));
      openModal(
        `${crop.emoji} ${crop.name}`,
        `Прогресс роста: <strong>${pct}%</strong><br>` +
        `Тип: <strong>${crop.multi ? "Многоразовая культура" : "Одноразовый урожай"}</strong><br>` +
        `Базовая цена: <strong>${formatNumber(crop.baseSell)} 🪙</strong><br>` +
        `Множитель веса: <strong>${p.giantBoost}x</strong>`,
        [{ label: "Закрыть", className: "btn-secondary" }]
      );
    }

    // --- RENDER SEED SHOP ---
    function renderShop() {
      const list = document.getElementById("shopList");
      list.innerHTML = "";

      const filtered = CROPS.filter(c => {
        if (shopFilter === "all") return true;
        if (shopFilter === "common") return c.rarity === "common" || c.rarity === "uncommon";
        if (shopFilter === "rare") return c.rarity === "rare";
        if (shopFilter === "epic") return c.rarity === "epic";
        if (shopFilter === "legendary") return c.rarity === "legendary" || c.rarity === "mythical";
        return true;
      });

      filtered.forEach(crop => {
        const stock = state.shop.stock[crop.id] || 0;
        const owned = state.seedInventory[crop.id] || 0;
        const canBuy = stock > 0 && state.coins >= crop.cost;

        const card = document.createElement("div");
        card.className = "item-card" + (stock <= 0 ? " out-of-stock" : "");
        card.innerHTML = `
          <div class="item-left">
            <div class="item-emoji">${crop.emoji}</div>
            <div class="item-info">
              <div class="item-title-row">
                <span class="item-name">${crop.name}</span>
                <span class="tag rarity-${crop.rarity}">${crop.rarityLabel}</span>
              </div>
              <div class="item-meta">
                ${crop.growSec}с • ${crop.multi ? "Многоразовое" : "Одноразовое"} • В сумке: <strong>${owned}</strong><br>
                В наличии: <strong>${stock > 0 ? stock + " шт." : "Нет в завозе"}</strong>
              </div>
            </div>
          </div>
          <button class="buy-btn" ${canBuy ? "" : "disabled"}>${formatNumber(crop.cost)} 🪙</button>
        `;

        card.querySelector(".buy-btn").onclick = () => {
          if (state.coins < crop.cost || (state.shop.stock[crop.id] || 0) <= 0) return;
          state.coins -= crop.cost;
          state.shop.stock[crop.id]--;
          state.seedInventory[crop.id] = (state.seedInventory[crop.id] || 0) + 1;
          state.selectedSeed = crop.id;
          activeTool = "plant";
          updateToolButtons();
          haptic("light");
          showToast(`Куплено: ${crop.emoji} ${crop.name}`);
          saveState();
          renderShop();
        };

        card.querySelector(".item-left").onclick = () => {
          if ((state.seedInventory[crop.id] || 0) > 0) {
            state.selectedSeed = crop.id;
            activeTool = "plant";
            updateToolButtons();
            saveState();
            switchView("garden");
            showToast(`Выбрано: ${crop.emoji} ${crop.name}`);
          }
        };

        list.appendChild(card);
      });
    }

    // --- RENDER GEAR SHOP (С КАТЕГОРИЯМИ И СТОКОМ КАК В ЛАВКЕ СЕМЯН) ---
    function renderGear() {
      const list = document.getElementById("gearList");
      list.innerHTML = "";

      const filtered = GEAR_ITEMS.filter(g => {
        if (gearFilter === "all") return true;
        return g.category === gearFilter;
      });

      filtered.forEach(item => {
        const isExpansion = item.id === "expand_plot";
        const stock = isExpansion
          ? (state.unlockedPlots < 15 ? 1 : 0)
          : (state.gearShop.stock[item.id] || 0);
        const owned = state.gearInventory[item.id] || 0;

        let price = item.cost;
        if (isExpansion) {
          const boughtPlots = state.unlockedPlots - 9;
          price = Math.round(1000 * Math.pow(2.4, boughtPlots));
        }

        const canBuy = stock > 0 && state.coins >= price;

        const card = document.createElement("div");
        card.className = "item-card" + (stock <= 0 ? " out-of-stock" : "");
        card.innerHTML = `
          <div class="item-left">
            <div class="item-emoji">${item.emoji}</div>
            <div class="item-info">
              <div class="item-title-row">
                <span class="item-name">${item.name}</span>
                <span class="tag rarity-${item.rarity}">${item.rarityLabel}</span>
              </div>
              <div class="item-meta">
                ${item.desc}<br>
                ${isExpansion
                  ? `Открыто грядок: <strong>${state.unlockedPlots} из 15</strong>`
                  : `В сумке: <strong>${owned}</strong> • В наличии: <strong>${stock > 0 ? stock + " шт." : "Нет в завозе"}</strong>`
                }
              </div>
            </div>
          </div>
          <button class="buy-btn" ${canBuy ? "" : "disabled"}>${isExpansion && state.unlockedPlots >= 15 ? "Макс." : formatNumber(price) + " 🪙"}</button>
        `;

        card.querySelector(".buy-btn").onclick = () => {
          if (!canBuy) return;
          if (isExpansion) {
            state.coins -= price;
            state.unlockedPlots++;
            haptic("success");
            showToast(`Открыта грядка №${state.unlockedPlots}`);
          } else {
            state.coins -= price;
            state.gearShop.stock[item.id]--;
            state.gearInventory[item.id] = (state.gearInventory[item.id] || 0) + 1;
            if (item.mode === "plot") {
              state.selectedGear = item.id;
            }
            haptic("light");
            showToast(`Куплено: ${item.emoji} ${item.name} (в сумке)`);
          }
          saveState();
          renderGear();
        };

        list.appendChild(card);
      });
    }

    // --- RENDER BACKPACK ---
    function renderBag() {
      const list = document.getElementById("bagList");
      const sellAllBtn = document.getElementById("btnSellAll");
      list.innerHTML = "";

      const sorted = [...state.harvestBag].sort((a, b) => b.value - a.value);
      const totalVal = sorted.reduce((s, item) => s + item.value, 0);

      sellAllBtn.disabled = sorted.length === 0;
      sellAllBtn.textContent = `Продать всё (${formatNumber(totalVal)} 🪙)`;

      if (sorted.length === 0) {
        list.innerHTML = `<div class="empty-state">Рюкзак пуст.<br>Нажми на созревшее растение в саду, чтобы собрать урожай.</div>`;
        return;
      }

      sorted.forEach(item => {
        const mutHtml = item.mutations && item.mutations.length
          ? item.mutations.map(m => `<span class="tag" style="background:rgba(255,255,255,0.08);color:${m.color}">${m.name} x${m.mult}</span>`).join(" ")
          : `<span class="tag" style="background:rgba(255,255,255,0.05);color:#8a9992">Стандарт</span>`;

        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="item-left">
            <div class="item-emoji">${item.emoji}</div>
            <div class="item-info">
              <div class="item-title-row">
                <span class="item-name">${item.name}</span>
                <span style="font-size:11px;color:#b4d4c6;font-weight:600;">${item.weight} кг</span>
              </div>
              <div class="item-meta" style="margin-top:4px;">${mutHtml}</div>
            </div>
          </div>
          <button class="buy-btn">+${formatNumber(item.value)} 🪙</button>
        `;

        card.querySelector(".buy-btn").onclick = () => {
          state.coins += item.value;
          state.harvestBag = state.harvestBag.filter(x => x.uid !== item.uid);
          haptic("light");
          showToast(`Продано: +${formatNumber(item.value)} 🪙`);
          saveState();
          renderBag();
        };

        list.appendChild(card);
      });
    }

    // --- NAVIGATION & TOOLS ---
    function switchView(viewName) {
      currentView = viewName;
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === viewName));
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + viewName).classList.add("active");

      if (viewName === "garden") resizeCanvas();
      if (viewName === "shop") renderShop();
      if (viewName === "gear") renderGear();
      if (viewName === "bag") renderBag();
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.onclick = () => {
        haptic("light");
        switchView(btn.dataset.view);
      };
    });

    function updateToolButtons() {
      document.getElementById("toolPlant").classList.toggle("active", activeTool === "plant");
      document.getElementById("toolGear").classList.toggle("active", activeTool === "gear");
      document.getElementById("toolShovel").classList.toggle("active", activeTool === "shovel");
    }

    document.getElementById("toolPlant").onclick = () => {
      if (activeTool === "plant") {
        openSeedPicker();
      } else {
        activeTool = "plant";
        updateToolButtons();
      }
      haptic("light");
    };

    document.getElementById("toolGear").onclick = () => {
      haptic("light");
      openGearPicker();
    };

    document.getElementById("selectedSeedHud").onclick = () => {
      haptic("light");
      openSeedPicker();
    };

    document.getElementById("toolShovel").onclick = () => {
      activeTool = activeTool === "shovel" ? "plant" : "shovel";
      updateToolButtons();
      haptic("light");
    };

    document.getElementById("btnSellAll").onclick = () => {
      if (state.harvestBag.length === 0) return;
      const total = state.harvestBag.reduce((s, i) => s + i.value, 0);
      state.coins += total;
      state.harvestBag = [];
      haptic("success");
      showToast(`Продано на ${formatNumber(total)} 🪙`);
      saveState();
      renderBag();
    };

    document.querySelectorAll("#seedFilters .filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#seedFilters .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        shopFilter = btn.dataset.filter;
        renderShop();
      };
    });

    document.querySelectorAll("#gearFilters .filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#gearFilters .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        gearFilter = btn.dataset.gfilter;
        renderGear();
      };
    });

    // --- SLEEK BOTANICAL CANVAS RENDERER ---
    const canvasContainer = document.getElementById("canvasContainer");
    const canvas = document.getElementById("gardenCanvas");
    const ctx = canvas.getContext("2d");
    let logicalW = 360;
    let logicalH = 480;
    const plotRects = [];

    function resizeCanvas() {
      const rect = canvasContainer.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      logicalW = rect.width;
      logicalH = rect.height;
      canvas.width = Math.round(logicalW * dpr);
      canvas.height = Math.round(logicalH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    if (window.ResizeObserver) {
      new ResizeObserver(resizeCanvas).observe(canvasContainer);
    } else {
      window.addEventListener("resize", resizeCanvas);
    }

    const drops = Array.from({ length: 34 }, () => ({
      x: Math.random() * 500,
      y: Math.random() * 700,
      speed: 2 + Math.random() * 3.5,
      size: 1 + Math.random() * 1.5
    }));

    function drawGarden(ts) {
      if (currentView === "garden") {
        const wObj = WEATHERS.find(w => w.id === state.weather.id) || WEATHERS[0];

        // Спокойный матовый фон теплицы/участка
        const grad = ctx.createLinearGradient(0, 0, 0, logicalH);
        grad.addColorStop(0, wObj.skyTop);
        grad.addColorStop(1, wObj.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, logicalW, logicalH);

        // Тонкая архитектурная сетка на фоне
        ctx.strokeStyle = "rgba(255, 255, 255, 0.025)";
        ctx.lineWidth = 1;
        for (let gx = 24; gx < logicalW; gx += 32) {
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.lineTo(gx, logicalH);
          ctx.stroke();
        }

        const hasDevices = state.devices.length > 0;
        const topOffset = hasDevices ? 60 : 38;
        const cols = 3;
        const rows = 5;
        const padX = 12;
        const padBottom = 12;
        const gap = 9;
        const cellW = (logicalW - padX * 2 - gap * (cols - 1)) / cols;
        const cellH = (logicalH - topOffset - padBottom - gap * (rows - 1)) / rows;

        plotRects.length = 0;

        for (let i = 0; i < 15; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = padX + col * (cellW + gap);
          const y = topOffset + row * (cellH + gap);
          plotRects.push({ x, y, w: cellW, h: cellH });

          const unlocked = i < state.unlockedPlots;
          const p = state.plots[i];

          ctx.save();

          if (!unlocked) {
            ctx.beginPath();
            ctx.roundRect(x, y, cellW, cellH, 10);
            ctx.fillStyle = "rgba(255, 255, 255, 0.02)";
            ctx.fill();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
            ctx.font = "13px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🔒", x + cellW / 2, y + cellH / 2);
            ctx.restore();
            continue;
          }

          // Строгий короб грядки с темным грунтом
          ctx.beginPath();
          ctx.roundRect(x, y, cellW, cellH, 10);
          ctx.fillStyle = p.cropId ? "#211b17" : "#181512";
          ctx.fill();

          // Подсветка в зависимости от выбранного инструмента
          if (activeTool === "shovel" && p.cropId) {
            ctx.strokeStyle = "#cf5656";
            ctx.lineWidth = 1.6;
          } else if (activeTool === "gear" && p.cropId && !p.ready) {
            ctx.strokeStyle = "#d4a348";
            ctx.lineWidth = 1.6;
          } else if (p.ready) {
            ctx.strokeStyle = "#2ea877";
            ctx.lineWidth = 1.8;
          } else {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.11)";
            ctx.lineWidth = 1.2;
          }
          ctx.stroke();

          // Минималистичные линии грядки
          ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + 12, y + cellH * 0.38);
          ctx.lineTo(x + cellW - 12, y + cellH * 0.38);
          ctx.moveTo(x + 12, y + cellH * 0.64);
          ctx.lineTo(x + cellW - 12, y + cellH * 0.64);
          ctx.stroke();

          // Растение
          if (p.cropId) {
            const crop = getCrop(p.cropId);
            const maxMs = p.growDuration * 1000;
            const progress = p.ready ? 1 : Math.min(0.99, p.progressMs / maxMs);

            // Тонкое кольцо мутации
            if (p.ready && p.mutations && p.mutations.length > 0) {
              const topMut = p.mutations[p.mutations.length - 1];
              const radius = Math.min(cellW, cellH) * 0.32;
              ctx.beginPath();
              ctx.arc(x + cellW / 2, y + cellH / 2 - 4, radius, 0, Math.PI * 2);
              ctx.strokeStyle = topMut.color + "66";
              ctx.lineWidth = 1.5;
              ctx.stroke();
            }

            const baseEmojiSize = Math.min(cellW, cellH) * 0.42;
            let scale = 0.55 + progress * 0.45;
            if (p.ready && crop) {
              const ratio = Math.min(1.5, p.weight / crop.maxKg);
              scale = 1.0 + ratio * 0.42;
            }

            ctx.font = `${Math.round(baseEmojiSize * scale)}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const icon = progress < 0.35 ? "🌱" : progress < 0.75 ? "🌿" : crop.emoji;
            ctx.fillText(icon, x + cellW / 2, y + cellH / 2 - 5);

            if (!p.ready) {
              const barW = cellW - 20;
              ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
              ctx.fillRect(x + 10, y + cellH - 10, barW, 3);

              ctx.fillStyle = "#2ea877";
              ctx.fillRect(x + 10, y + cellH - 10, Math.max(3, barW * progress), 3);
            } else {
              ctx.fillStyle = "rgba(11, 14, 13, 0.88)";
              ctx.beginPath();
              ctx.roundRect(x + 8, y + cellH - 18, cellW - 16, 13, 4);
              ctx.fill();
              ctx.fillStyle = p.mutations.length ? "#ebd096" : "#dce5e1";
              ctx.font = "600 9.5px sans-serif";
              ctx.fillText(`${p.weight} кг`, x + cellW / 2, y + cellH - 11.5);
            }
          }
          ctx.restore();
        }

        // Спокойные погодные эффекты
        if (state.weather.id === "rain" || state.weather.id === "storm") {
          ctx.strokeStyle = "rgba(148, 197, 224, 0.25)";
          ctx.lineWidth = 1;
          drops.forEach(d => {
            d.y += d.speed * 2;
            d.x -= 0.8;
            if (d.y > logicalH) { d.y = -10; d.x = Math.random() * logicalW; }
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 2, d.y + 8);
            ctx.stroke();
          });
        } else if (state.weather.id === "frost") {
          ctx.fillStyle = "rgba(210, 232, 245, 0.35)";
          drops.forEach(d => {
            d.y += d.speed * 0.45;
            d.x += Math.sin(ts / 600 + d.y) * 0.3;
            if (d.y > logicalH) { d.y = -5; d.x = Math.random() * logicalW; }
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (state.weather.id === "meteor") {
          ctx.strokeStyle = "rgba(235, 208, 150, 0.45)";
          ctx.lineWidth = 1.2;
          drops.slice(0, 6).forEach(d => {
            d.y += d.speed * 2.5;
            d.x += d.speed * 1.4;
            if (d.y > logicalH || d.x > logicalW) { d.y = -10; d.x = Math.random() * (logicalW * 0.7); }
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 10, d.y - 16);
            ctx.stroke();
          });
        }
      }

      requestAnimationFrame(drawGarden);
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;

      for (let i = 0; i < plotRects.length; i++) {
        const r = plotRects[i];
        if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) {
          handlePlotTap(i);
          break;
        }
      }
    });

    // --- BOOT ---
    initProfile();
    resizeCanvas();
    updateToolButtons();
    gameTick();
    setInterval(gameTick, 400);
    requestAnimationFrame(drawGarden);
  </script>
</body>
</html>
